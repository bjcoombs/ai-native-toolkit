name: Refine dedupe (reusable)

# Duplicate detection for one issue (issues #1321, #1327). Adopt it with one
# `uses:` line from a workflow triggered on `issues: opened` and
# `workflow_dispatch`; refine-dedupe.yml is the reference caller.
#
#   plan   (issues: read) refine.py writes the deterministic verdict. Unless
#          it found an exact pair, the /dedupe command looks for issues that
#          cover the same work, with only gh.sh reads allowed, and returns at
#          most three candidates.
#   apply  (issues: write, no model) closes an exact pair with both issues
#          open, under the weekly close cap and with the `/reopen` route, or
#          names the validated candidates in one comment, never closing them.
#
# Permissions, credentials and allowed_non_write_users: as in
# reusable-refine-triage.yml.
on:
  workflow_call:
    inputs:
      enabled:
        description: Kill switch. Pass `vars.REFINE_ENABLED == 'true'`; false skips every job.
        type: boolean
        default: false
      mode:
        description: "`live` writes; any other value, including empty, is a dry-run."
        type: string
        default: dry-run
      issue_number:
        type: number
        required: true
      model:
        description: A Sonnet-class model.
        type: string
        default: sonnet
      close_cap:
        description: The most duplicate closes the bot may make in any 7 days.
        type: number
        default: 10
      anthropic_federation_rule_id:
        type: string
        default: ''
      anthropic_organization_id:
        type: string
        default: ''
      anthropic_service_account_id:
        type: string
        default: ''
      anthropic_workspace_id:
        type: string
        default: ''
    secrets:
      anthropic_api_key:
        required: false
      claude_code_oauth_token:
        description: Used only when neither the API key nor Workload Identity Federation is set; as in reusable-refine-triage.yml.
        required: false

jobs:
  # The model runs here, with a token that can read issues but write
  # nothing: a prompt-injected `gh issue close` fails even if it runs. The
  # job hands its verdict and plan to `apply` as an artifact.
  plan:
    if: inputs.enabled
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    concurrency:
      group: refine-dedupe-${{ github.repository }}-${{ inputs.issue_number }}
      cancel-in-progress: true
    outputs:
      model: ${{ steps.route.outputs.model }}
      planned: ${{ steps.save.outputs.planned }}
      verdict_sha256: ${{ steps.digest.outputs.sha256 }}
      artifact: ${{ steps.artifact.outputs.name }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ inputs.issue_number }}
      APPLY: .refine-toolkit/skills/refine/scripts/refine_apply.py
    steps:
      # The default branch only, never code from an issue or a pull request.
      - name: Check out the repository (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # The refinement scripts come from the commit this reusable workflow was
      # called at (job.workflow_repository at job.workflow_sha): the ref the
      # caller pinned in its `uses:` line. No input chooses the code, and a
      # missing or malformed value fails the job.
      - name: Pin the refinement scripts to this workflow's commit
        id: toolkit
        env:
          TOOLKIT_REPO: ${{ job.workflow_repository }}
          TOOLKIT_SHA: ${{ job.workflow_sha }}
        run: |
          if [ "$TOOLKIT_REPO" != "bjcoombs/ai-native-toolkit" ] && [ "$TOOLKIT_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::The refinement scripts come only from bjcoombs/ai-native-toolkit or this repository, not '${TOOLKIT_REPO}'."
            exit 1
          fi
          if [[ ! "$TOOLKIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The refinement scripts are pinned only to a full commit sha, not '${TOOLKIT_SHA}'."
            exit 1
          fi

      - name: Check out the refinement scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .refine-toolkit
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skills/refine/
            docs/contributing/definition-of-ready.md

      # The artifact's name is a job output, so a re-run of `apply` alone
      # downloads the artifact this attempt uploaded: `github.run_attempt`
      # moves on in the re-run, while upstream job outputs carry over.
      - name: Name the plan artifact
        id: artifact
        env:
          NAME: refine-dedupe-plan-${{ inputs.issue_number }}-${{ github.run_attempt }}
        run: echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Write the deterministic verdict
        timeout-minutes: 5
        run: |
          mkdir -p .refine
          python3 .refine-toolkit/skills/refine/scripts/refine.py --repo "$GH_REPO" --issue "$ISSUE" \
            --out .refine/verdict.json

      # The apply job trusts this verdict for agent-ready and closes, so its
      # digest is taken before the model runs and checked again in apply.
      - name: Record the verdict digest
        id: digest
        run: echo "sha256=$(sha256sum .refine/verdict.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Route
        id: route
        run: python3 "$APPLY" dedupe-route --verdict .refine/verdict.json --issue "$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Check the credential and the author
        id: gate
        if: steps.route.outputs.model == 'true'
        env:
          HAS_KEY: ${{ secrets.anthropic_api_key != '' }}
          HAS_WIF: ${{ inputs.anthropic_federation_rule_id != '' && inputs.anthropic_organization_id != '' }}
          HAS_OAUTH: ${{ secrets.claude_code_oauth_token != '' }}
          TRUSTED: ${{ github.event_name == 'workflow_dispatch' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) }}
        run: |
          # An untrusted author gets no model run, so needs no credential.
          if [ "$TRUSTED" != "true" ]; then
            echo "::notice::The author has no write access; only the exact-duplicate check runs."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            # Credential order: the API key, then Workload Identity Federation,
            # then the Claude Code OAuth token. Only the chosen one reaches the
            # model step. A model run with none fails the plan job here.
            if [ "$HAS_KEY" = "true" ]; then
              echo "auth=api_key" >> "$GITHUB_OUTPUT"
            elif [ "$HAS_WIF" = "true" ]; then
              echo "auth=wif" >> "$GITHUB_OUTPUT"
            elif [ "$HAS_OAUTH" = "true" ]; then
              echo "auth=oauth" >> "$GITHUB_OUTPUT"
            else
              echo "::error::No refiner credential is set. Pass the anthropic_api_key secret, the Workload Identity Federation inputs (anthropic_federation_rule_id and anthropic_organization_id) or the claude_code_oauth_token secret."
              exit 1
            fi
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          # Claude Code's --json-schema validator does not load the draft
          # 2020-12 meta-schema the file names, so the $schema key is dropped.
          # The value goes inside single quotes below; a test keeps ' out of it.
          echo "schema=$(jq -c 'del(.["$schema"])' .refine-toolkit/skills/refine/scripts/dedupe-plan.schema.json)" >> "$GITHUB_OUTPUT"

      # The prompts ship under skills/refine/commands/; a repository may keep
      # its own copy in .claude/commands/, which is left in place.
      - name: Install the refiner commands
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p .claude/commands
          for f in .refine-toolkit/skills/refine/commands/*.md; do
            [ -e ".claude/commands/$(basename "$f")" ] || cp "$f" .claude/commands/
          done

      # Default permission mode: in a run with no one to ask, a tool not on
      # --allowedTools is denied, never reviewed. The allow-list is the
      # read-only gh.sh wrapper and Read of the verdict.
      - name: Look for duplicates (model, read-only token)
        id: model
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 10
        continue-on-error: true
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c  # v1.0.290
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          anthropic_federation_rule_id: ${{ steps.gate.outputs.auth == 'wif' && inputs.anthropic_federation_rule_id || '' }}
          anthropic_organization_id: ${{ steps.gate.outputs.auth == 'wif' && inputs.anthropic_organization_id || '' }}
          anthropic_service_account_id: ${{ steps.gate.outputs.auth == 'wif' && inputs.anthropic_service_account_id || '' }}
          anthropic_workspace_id: ${{ steps.gate.outputs.auth == 'wif' && inputs.anthropic_workspace_id || '' }}
          claude_code_oauth_token: ${{ steps.gate.outputs.auth == 'oauth' && secrets.claude_code_oauth_token || '' }}
          prompt: "/dedupe REPO: ${{ github.repository }} ISSUE: ${{ inputs.issue_number }} VERDICT: .refine/verdict.json"
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns 20
            --allowedTools "Bash(./.refine-toolkit/skills/refine/scripts/gh.sh:*),Read(./.refine/**)"
            --disallowedTools "WebFetch,WebSearch,Write,Edit,MultiEdit,NotebookEdit"
            --json-schema '${{ steps.gate.outputs.schema }}'

      - name: Save the plan
        id: save
        if: steps.model.outcome == 'success' && steps.model.outputs.structured_output != ''
        env:
          PLAN: ${{ steps.model.outputs.structured_output }}
        run: |
          printf '%s' "$PLAN" > .refine/plan.json
          echo "planned=true" >> "$GITHUB_OUTPUT"

      - name: Report final status
        if: always() && steps.gate.outputs.run == 'true'
        env:
          OUTCOME: ${{ steps.model.outcome }}
          CONCLUSION: ${{ steps.model.outputs.conclusion }}
          EXEC_FILE: ${{ steps.model.outputs.execution_file }}
        run: bash .refine-toolkit/skills/refine/scripts/check-model-run.sh

      - name: Hand the verdict and plan to the apply job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .refine/
          if-no-files-found: error
          # upload-artifact skips hidden files by default, and .refine/ is one.
          include-hidden-files: true

  # No model runs here. The plan is validated against its schema before
  # anything is applied, and every write goes through the write scripts.
  apply:
    needs: plan
    if: inputs.enabled && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    # An exact-pair close shares one repository-wide group with the sweep, so
    # two runs never read the weekly close count at once and both close (#1345).
    # GitHub keeps one pending run per group and cancels an older pending one;
    # a close dropped that way is still an exact, closable pair, and the next
    # sweep closes it. Naming candidates closes nothing, so it keeps a
    # per-issue group.
    concurrency:
      group: >-
        ${{ needs.plan.outputs.model == 'false' && format('refine-close-{0}', github.repository) || format('refine-dedupe-apply-{0}-{1}', github.repository, inputs.issue_number) }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ inputs.issue_number }}
      REFINE_MODE: ${{ inputs.mode }}
      REFINE_CLOSE_CAP: ${{ inputs.close_cap }}
      CLAUDE_CODE_SCRIPT_CAPS: '{"close-duplicate.sh":1,"comment-on-duplicates.sh":1}'
      APPLY: .refine-toolkit/skills/refine/scripts/refine_apply.py
    steps:
      # The default branch only, never code from an issue or a pull request.
      - name: Check out the repository (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # The refinement scripts come from the commit this reusable workflow was
      # called at (job.workflow_repository at job.workflow_sha): the ref the
      # caller pinned in its `uses:` line. No input chooses the code, and a
      # missing or malformed value fails the job.
      - name: Pin the refinement scripts to this workflow's commit
        id: toolkit
        env:
          TOOLKIT_REPO: ${{ job.workflow_repository }}
          TOOLKIT_SHA: ${{ job.workflow_sha }}
        run: |
          if [ "$TOOLKIT_REPO" != "bjcoombs/ai-native-toolkit" ] && [ "$TOOLKIT_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::The refinement scripts come only from bjcoombs/ai-native-toolkit or this repository, not '${TOOLKIT_REPO}'."
            exit 1
          fi
          if [[ ! "$TOOLKIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The refinement scripts are pinned only to a full commit sha, not '${TOOLKIT_SHA}'."
            exit 1
          fi

      - name: Check out the refinement scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .refine-toolkit
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            skills/refine/scripts/

      - name: Fetch the verdict and plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ${{ needs.plan.outputs.artifact }}
          path: .refine

      - name: Check the verdict is the one written before the model ran
        env:
          EXPECTED: ${{ needs.plan.outputs.verdict_sha256 }}
        run: echo "$EXPECTED  .refine/verdict.json" | sha256sum --check --strict

      - name: Close an exact duplicate (no model)
        if: needs.plan.outputs.model == 'false'
        run: python3 "$APPLY" dedupe-exact --verdict .refine/verdict.json --issue "$ISSUE"

      - name: Name the candidates (no model)
        if: needs.plan.outputs.planned == 'true'
        run: python3 "$APPLY" dedupe --verdict .refine/verdict.json --issue "$ISSUE" --plan .refine/plan.json

      - name: Write the job summary
        if: always()
        run: python3 "$APPLY" summary >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the actions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: refine-dedupe-actions-${{ inputs.issue_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/refine/actions.jsonl
          if-no-files-found: ignore
