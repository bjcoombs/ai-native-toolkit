name: Security

# Layer 5 security scanning, advisory (not in branch protection).
#
# - CodeQL static analysis over the Python deterministic core and build
#   pipeline, the canary driver (scripts/canaries/*.mjs), and the workflows
#   themselves (the `actions` language catches untrusted-input injection in
#   `run:` steps). Findings land in the Security tab as code-scanning alerts.
# - pip-audit over the Python packages CI and the Assess Gate install: the
#   two uv projects (skills/assess/ and scripts/), read from their committed
#   uv.lock files with the dev group the tests.yml jobs install, and the PEP 723
#   inline deps of every `uv run` script (complexity-treemap.py runs in every
#   consumer's Assess Gate, so it has the widest reach). The projects audit the
#   exact pins CI runs; the scripts commit no lock, so their specifiers resolve
#   fresh, which is what a run installs that day. Each set is audited on its
#   own because the scripts pin different Python floors and can resolve a
#   shared package differently.
#
# Runs on PRs and pushes to main, and weekly so new advisories against
# unchanged code still surface.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d  # v4.38.3
        with:
          category: /language:${{ matrix.language }}

  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      # Every set carries hashes so pip-audit can read the pins directly
      # (--disable-pip) instead of installing them into a venv. --locked fails
      # on a lock that no longer matches its pyproject.toml.
      - name: Resolve dependency sets
        run: |
          out="$RUNNER_TEMP/audit"
          mkdir -p "$out"
          uv export --locked --quiet --no-header --project skills/assess \
            -o "$out/requirements-project-assess.txt"
          uv export --locked --quiet --no-header --project scripts \
            -o "$out/requirements-project-scripts.txt"
          grep -rl --include='*.py' --exclude-dir=.git --exclude-dir=fixtures \
            '^# /// script' . | sort | while read -r script; do
            # Name each set by its full path so same-named scripts never collide.
            name="${script#./}"
            name="${name%.py}"
            uv export --quiet --script "$script" --no-header \
              -o "$out/requirements-script-${name//\//_}.txt"
          done
          # Pin count per set, for the log only: grep exits 1 when a set is
          # empty (a script with no inline deps), which is expected here.
          grep -c '==' "$out"/requirements-*.txt || true

      - name: Audit for known vulnerabilities
        run: |
          status=0
          for req in "$RUNNER_TEMP"/audit/requirements-*.txt; do
            # A script with no inline dependencies exports an empty set.
            grep -q '==' "$req" || continue
            echo "::group::$(basename "$req")"
            uvx pip-audit==2.10.1 --strict --disable-pip --require-hashes \
              --progress-spinner off -r "$req" || status=1
            echo "::endgroup::"
          done
          exit "$status"
