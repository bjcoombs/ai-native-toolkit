name: Security

# Layer 5 security scanning, advisory (not in branch protection).
#
# - CodeQL static analysis over the Python deterministic core and build
#   pipeline, the canary driver (scripts/canaries/*.mjs), and the workflows
#   themselves (the `actions` language catches untrusted-input injection in
#   `run:` steps). Findings land in the Security tab as code-scanning alerts.
# - pip-audit over the Python packages CI and the Assess Gate install: the
#   deps declared in skills/assess/pyproject.toml and scripts/pyproject.toml,
#   the test and lint tools tests.yml adds with `uv run --with`, and the PEP 723
#   inline deps of every `uv run` script (complexity-treemap.py runs in every
#   consumer's Assess Gate, so it has the widest reach). Nothing commits a
#   lockfile, so the audit resolves the same specifiers fresh, which is what a
#   run installs that day. Each set is audited on its own because the scripts
#   pin different Python floors and can resolve a shared package differently.
#
# Runs on PRs and pushes to main, and weekly so new advisories against
# unchanged code still surface.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      # Keep the tool list in step with the `uv run --with` flags in tests.yml.
      # Every set is resolved with hashes so pip-audit can read the pins
      # directly (--disable-pip) instead of installing them into a venv.
      - name: Resolve dependency sets
        run: |
          out="$RUNNER_TEMP/audit"
          mkdir -p "$out"
          printf '%s\n' pytest pytest-cov pyyaml ruff mypy > "$out/ci-tools.in"
          uv pip compile --quiet --generate-hashes --python-version 3.11 \
            skills/assess/pyproject.toml scripts/pyproject.toml \
            "$out/ci-tools.in" -o "$out/requirements-projects.txt"
          grep -rl --include='*.py' --exclude-dir=.git --exclude-dir=fixtures \
            '^# /// script' . | sort | while read -r script; do
            uv export --quiet --script "$script" --no-header \
              -o "$out/requirements-script-$(basename "$script" .py).txt"
          done
          grep -c '==' "$out"/requirements-*.txt || true

      - name: Audit for known vulnerabilities
        run: |
          status=0
          for req in "$RUNNER_TEMP"/audit/requirements-*.txt; do
            # A script with no inline dependencies exports an empty set.
            grep -q '==' "$req" || continue
            echo "::group::$(basename "$req")"
            uvx pip-audit==2.10.1 --strict --disable-pip --require-hashes \
              --progress-spinner off -r "$req" || status=1
            echo "::endgroup::"
          done
          exit "$status"
