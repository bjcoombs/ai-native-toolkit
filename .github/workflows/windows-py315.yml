name: Windows Python 3.15 probe

# Python 3.15 probe (#1490). On Windows under Git Bash with Python 3.15, a
# contributor saw every pytest-xdist worker crash at startup with
# `OSError: [Errno 22]` during execnet bootstrap. This workflow runs the same
# parallel commands as windows.yml on 3.15 to show whether that reproduces on
# the runner image. On 2026-11-28 it did not: every worker started on CPython
# 3.15.2, in this job's first run, then a windows.yml job on pull request #1657:
# https://github.com/bjcoombs/ai-native-toolkit/actions/runs/46136533682/job/140952977344
# It runs weekly and on demand only, never on a pull request or a push,
# so it is not a check any merge waits on and costs one Windows runner a week.
# Each suite step is continue-on-error, so a crash or a test failure leaves
# the job green; the last step writes each step's outcome, and whether its log
# shows a worker crash, to the job summary and raises a warning annotation
# when one failed.
on:
  schedule:
    - cron: "29 4 * * 1"  # Mondays 04:29 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python315:
    name: windows / python 3.15 (weekly xdist probe)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The python.org-style build a Windows contributor installs. If the
      # runner's manifest has no 3.15, uv downloads its own 3.15 below.
      - name: Set up Python 3.15
        continue-on-error: true
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.15"
          allow-prereleases: true

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0

      # Only the promissory-marker tests need rg, and they degrade without it,
      # so a Chocolatey outage here is not worth windows.yml's full retry step.
      - name: Git Bash tools
        continue-on-error: true
        shell: bash
        run: |
          command -v rg >/dev/null || choco install ripgrep -y --no-progress
          command -v jq >/dev/null || choco install jq -y --no-progress
          git config --global user.email ci@example.invalid
          git config --global user.name ci

      - name: Python version
        continue-on-error: true
        shell: bash
        run: uv run --locked --python 3.15 python -VV
        working-directory: skills/assess

      # The `make check` command for skills/assess (`-n auto --dist loadfile`)
      # under Git Bash, on one fifth of the files: a startup crash shows in the
      # first seconds, and the whole suite on one runner takes over 45 minutes.
      - name: skills/assess pytest on 3.15 (shard 1/5)
        id: assess
        continue-on-error: true
        shell: bash
        working-directory: skills/assess
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: |
          set -o pipefail
          uv run --locked --python 3.15 \
            pytest -ra -p no:cacheprovider -n auto --dist loadfile --no-cov \
            -p pytest_shard --shard 1/5 --shard-weights tests/shard-weights.json \
            2>&1 | tee "$RUNNER_TEMP/py315-assess.log"

      - name: plugin contract pytest on 3.15
        id: contract
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          uv run --python 3.15 --with pytest --with pyyaml --with jsonschema --with "pytest-xdist>=3.6,<4" \
            pytest -ra -p no:cacheprovider -n auto --dist loadfile tests/ \
            --ignore-glob='tests/test_ghsync*.py' --ignore-glob='tests/test_ghreport*.py' \
            2>&1 | tee "$RUNNER_TEMP/py315-contract.log"

      # A crash is told apart from an ordinary test failure by the log: the
      # reported OSError, or xdist's own words for a worker that went down.
      - name: Record the 3.15 outcome
        if: ${{ !cancelled() }}
        shell: bash
        env:
          ASSESS: ${{ steps.assess.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
        run: |
          crash_re='Errno 22|node down|worker .* crashed|replacing crashed worker|INTERNALERROR'
          summary="$RUNNER_TEMP/py315-summary.md"
          {
            echo "### Python 3.15 xdist probe (#1490)"
            echo
            echo "| Suite | Outcome | Worker crash in log |"
            echo "|-------|---------|---------------------|"
          } > "$summary"
          for pair in "skills/assess shard 1/5:$ASSESS:py315-assess.log" "plugin contract:$CONTRACT:py315-contract.log"; do
            IFS=: read -r suite outcome log <<< "$pair"
            crash=no
            if [ -f "$RUNNER_TEMP/$log" ] && grep -Eq "$crash_re" "$RUNNER_TEMP/$log"; then
              crash=yes
            fi
            echo "| $suite | $outcome | $crash |" >> "$summary"
            if [ "$outcome" != "success" ]; then
              echo "::warning title=Python 3.15 probe::$suite: $outcome (worker crash in log: $crash)"
            fi
          done
          cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          cat "$summary"
