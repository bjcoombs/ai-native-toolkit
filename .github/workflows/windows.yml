name: Windows

# Runs the skills/assess suite (the fleet tests included) on windows-latest so
# separator, encoding and path-conversion regressions in /fleet and /assess
# show up before a Windows user hits them (#701, #713).
#
# Tests that need POSIX-only machinery (symlinks, chmod/getuid permissions,
# #!/bin/sh stubs on PATH) carry a skip marker on Windows; see the
# "Windows skip markers" note in skills/assess/tests/conftest.py. No coverage
# gate here: the Linux job owns the floor.
#
# The job is continue-on-error until its first green run; then drop that line
# and add "windows fleet + assess pytest" to the required checks.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-pytest:
    name: windows fleet + assess pytest
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      # Without this, checkout converts every text file to CRLF and fixture
      # byte and line counts stop matching the Linux goldens.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      # The promissory-marker scan and the fleet golden run shell out to rg.
      - name: Install ripgrep
        run: |
          choco install ripgrep -y --no-progress
          rg --version

      - name: Python version
        run: uv run --locked --python 3.11 python --version
        working-directory: skills/assess

      # -ra lists every skip and failure in the summary, so one log read shows
      # the whole picture.
      - name: Run pytest
        run: uv run --locked --python 3.11 pytest -ra -p no:cacheprovider
        working-directory: skills/assess
