name: Windows

# The whole repository on windows-latest, the Git for Windows baseline (#749):
# every test suite, the bash skill scripts under Git Bash, and end-to-end smoke
# runs of /assess, /fleet and the marathon contract gates on fixtures (#754).
# Separator, encoding, line-ending and path-conversion regressions show up here
# before a Windows user hits them (#701, #713, #752, #753).
#
# Parallel matrix legs (#938), each on its own windows-latest runner with the
# same setup: assess in four shards (skills/assess pytest; shard 1 also runs
# the fleet golden run and the CPU-budget tests), scripts-contract (scripts/
# pytest and plugin contract pytest), ghsync in two shards (the ghsync/ghreport
# suites behind the #971 path gate) and smoke (the CRLF check, standalone ZIPs,
# eval scaffolds and the smoke runs). A shard keeps whole test files
# (tests/pytest_shard.py), and the shards of a suite are disjoint and together
# hold its full collection (tests/test_pytest_shard.py). fail-fast is off, so one
# red leg does not cancel the others. Branch protection requires only the
# aggregator job, "windows suites + smoke runs": it always runs (`always()`)
# and passes only when the matrix result is success, so a failed, cancelled or
# skipped leg turns it red. No leg is skipped at job level; the ghsync gate is
# a step inside its leg, so that leg still reports success when it skips.
#
# Within a leg every suite step and smoke step runs even when an earlier one
# fails (`!cancelled()`), and -ra lists every skip and failure, so one log read
# per leg shows it all. The suites run on
# every core with pytest-xdist (`-n auto --dist loadfile`: one file per worker,
# so cross-file state, #831, cannot interleave), as the Linux jobs in tests.yml
# do. pytest-xdist comes from each package's locked dev group; tests/ has no
# lockfile and adds it with `--with`. Serial, the job took over an hour.
# No coverage gate here: the Linux jobs own the floors.
#
# Tests that need POSIX-only machinery carry one of the Windows skip markers
# declared in skills/assess/tests/conftest.py (WINDOWS_SKIP_MARKERS:
# needs_symlink, needs_posix_perms, needs_posix_shell), or call its
# skip_without_posix_shell() from a fixture that puts a #!/bin/sh gh/glab stub
# on PATH.

# merge_group: the merge queue runs the legs and the aggregator on main plus
# the queued pull requests (#1088). Every leg runs in full there, the ghsync
# leg included: the path gate below runs its suites on any event but a pull
# request.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# A run is five jobs, so a new push to a PR cancels that PR's older run. The
# required check is per commit, so the cancelled run's aggregator reports only
# on the superseded commit. Pushes to main never cancel each other.
concurrency:
  group: windows-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  suites:
    name: windows / ${{ matrix.suite }}${{ matrix.shards && format(' {0}/{1}', matrix.shard, matrix.shards) || '' }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # assess and ghsync run as shards (tests/pytest_shard.py): each leg keeps
      # whole test files, so --dist loadfile still holds a file on one worker
      # (#831), and the N legs of a suite hold disjoint shards whose union is the
      # full collection. shard is 1-based; every value 1..shards appears once.
      matrix:
        include:
          - {suite: assess, shard: 1, shards: 4}
          - {suite: assess, shard: 2, shards: 4}
          - {suite: assess, shard: 3, shards: 4}
          - {suite: assess, shard: 4, shards: 4}
          - {suite: scripts-contract}
          - {suite: ghsync, shard: 1, shards: 2}
          - {suite: ghsync, shard: 2, shards: 2}
          - {suite: smoke}
    steps:
      # Without this, checkout converts every text file to CRLF and fixture
      # byte and line counts stop matching the Linux goldens. The step "Shell
      # scripts are LF in a CRLF checkout" below checks the default a Windows
      # user gets (core.autocrlf=true) in a fresh clone.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      # Full history: the plugin contract tests reason about the diff against
      # the PR base, which a shallow checkout cannot see (as in tests.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the PR base ref
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      # An explicit interpreter for uv to pick up: --python 3.11 below then runs on
      # this one rather than one uv downloads.
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      # The promissory-marker scan and the fleet golden run shell out to rg.
      # community.chocolatey.org returns 503/504 at times, so choco gets three
      # tries with a short backoff. If all three fail, the same version comes
      # from the BurntSushi/ripgrep GitHub release (the zip the Chocolatey
      # package itself unpacks), checked against RG_SHA256 before it is used.
      # RG_SHA256 was computed from the release asset and matches the release's
      # published .sha256 asset. A version bump changes both env values. The
      # step fails only when both paths fail, or when rg is not RG_VERSION.
      - name: Install ripgrep
        shell: pwsh
        env:
          RG_VERSION: "15.2.0"
          RG_SHA256: "71b2fef860abe467217a538ff31de02f5258807c0129f771846f87bd029aafc5"
        run: |
          $installed = $false
          foreach ($attempt in 1..3) {
            choco install ripgrep --version $env:RG_VERSION -y --no-progress
            if ($LASTEXITCODE -eq 0) { $installed = $true; break }
            Write-Host "choco install ripgrep failed (attempt $attempt of 3, exit $LASTEXITCODE)"
            if ($attempt -lt 3) { Start-Sleep -Seconds (15 * $attempt) }
          }
          if (-not $installed) {
            Write-Host "Falling back to the ripgrep $env:RG_VERSION GitHub release"
            $name = "ripgrep-$env:RG_VERSION-x86_64-pc-windows-msvc"
            $url = "https://github.com/BurntSushi/ripgrep/releases/download/$env:RG_VERSION/$name.zip"
            $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 10
            $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($hash -ne $env:RG_SHA256) {
              Write-Host "::error::$name.zip SHA256 is $hash, expected $env:RG_SHA256"
              exit 1
            }
            Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
            $dir = Join-Path $env:RUNNER_TEMP $name
            Add-Content -Path $env:GITHUB_PATH -Value $dir
            $env:PATH = "$dir;$env:PATH"
          }
          $version = (rg --version | Select-Object -First 1)
          Write-Host $version
          if ($version -notmatch "^ripgrep $([regex]::Escape($env:RG_VERSION))(\s|$)") {
            Write-Host "::error::expected ripgrep $env:RG_VERSION, got: $version"
            exit 1
          }
          # A failed choco attempt leaves $LASTEXITCODE non-zero, and the
          # runner's pwsh wrapper exits with it. Reaching here means rg is
          # RG_VERSION from one of the two paths, so the step passes.
          exit 0

      # `shell: bash` on windows-latest is Git Bash. Git Bash does not ship jq;
      # the runner image usually does. The smoke fixtures and the eval
      # scaffolds commit, so git needs an identity.
      - name: Git Bash tools
        shell: bash
        run: |
          command -v jq >/dev/null || choco install jq -y --no-progress
          bash --version | head -1
          git --version
          jq --version
          command -v timeout
          git config --global user.email ci@example.invalid
          git config --global user.name ci

      - name: Python version
        run: uv run --locked --python 3.11 python --version
        working-directory: skills/assess

      # .gitattributes (`*.sh text eol=lf`) must keep every *.sh LF in the
      # core.autocrlf=true checkout a Windows user gets: a fresh clone of this
      # commit made with that setting. README.md turning CRLF there proves the
      # conversion really ran. The bytes are read in Python: Git for Windows'
      # grep strips CR before matching, so `grep $'\r'` never finds one.
      - name: Shell scripts are LF in a CRLF checkout
        if: ${{ !cancelled() && matrix.suite == 'smoke' }}
        shell: bash
        run: |
          crlf="$RUNNER_TEMP/crlf-clone"
          git clone -q --no-local --no-checkout -c core.autocrlf=true "$GITHUB_WORKSPACE" "$crlf"
          git -C "$crlf" checkout -q --detach "$(git rev-parse HEAD)"
          git -C "$crlf" ls-files -z '*.sh' > "$RUNNER_TEMP/sh-files"
          python -c '
          import sys
          from pathlib import Path
          root = Path(sys.argv[1])
          assert b"\r\n" in (root / "README.md").read_bytes(), "autocrlf=true did not convert README.md"
          names = [n for n in Path(sys.argv[2]).read_bytes().decode("utf-8").split("\0") if n]
          bad = [n for n in names if b"\r" in (root / n).read_bytes()]
          print(len(names), "shell scripts checked;", "CRLF:", bad or "none")
          sys.exit(1 if bad or not names else 0)
          ' "$crlf" "$RUNNER_TEMP/sh-files"

      # --- Test suites ----------------------------------------------------------

      # A fixture estate built at test time is run through fleet.py and its
      # repos.jsonl compared with the one committed from Linux
      # (tests/fixtures/fleet_golden/repos.jsonl): field-level differences are
      # listed by dotted path, then the bytes (LF endings) are compared.
      # Shard 1 alone runs it.
      - name: Fleet golden run against the committed Linux repos.jsonl
        if: ${{ !cancelled() && matrix.suite == 'assess' && matrix.shard == 1 }}
        run: uv run --locked --python 3.11 pytest -ra -p no:cacheprovider tests/test_fleet_golden.py
        working-directory: skills/assess

      # One shard of the suite, balanced by the Windows seconds per file in
      # tests/shard-weights.json (a file missing from it counts as the median).
      # --shard-record keeps this run's seconds per file, uploaded below.
      - name: skills/assess pytest
        if: ${{ !cancelled() && matrix.suite == 'assess' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: >-
          uv run --locked --python 3.11
          pytest -ra -p no:cacheprovider -n auto --dist loadfile
          --ignore=tests/test_fleet_golden.py
          -p pytest_shard --shard ${{ matrix.shard }}/${{ matrix.shards }}
          --shard-weights tests/shard-weights.json
          --shard-record "${{ runner.temp }}/shard-seconds.json"
        working-directory: skills/assess

      # The cpu_budget tests skip in the xdist pool above (tests/conftest.py,
      # CPU_BUDGET_SKIP) and run here, serially, as in tests.yml, in shard 1 only.
      - name: skills/assess CPU-budget tests
        if: ${{ !cancelled() && matrix.suite == 'assess' && matrix.shard == 1 }}
        run: >-
          uv run --locked --python 3.11
          pytest -ra -p no:cacheprovider -p no:xdist -m cpu_budget --no-cov
        working-directory: skills/assess

      - name: scripts/ pytest
        if: ${{ !cancelled() && matrix.suite == 'scripts-contract' }}
        run: >-
          uv run --locked --python 3.11
          pytest -ra -p no:cacheprovider -n auto --dist loadfile
        working-directory: scripts

      # Under Git Bash: some contract tests and every ghsync/ghreport test run
      # bash, and tests/gitbash.py resolves it on PATH (from PowerShell, `bash`
      # can be the WSL launcher in System32).
      - name: plugin contract pytest
        if: ${{ !cancelled() && matrix.suite == 'scripts-contract' }}
        shell: bash
        run: >-
          uv run --python 3.11 --with pytest --with pyyaml --with "pytest-xdist>=3.6,<4"
          pytest -ra -p no:cacheprovider -n auto --dist loadfile tests/
          --ignore-glob='tests/test_ghsync*.py' --ignore-glob='tests/test_ghreport*.py'

      # The ghsync/ghreport suites take about 12 minutes and test only these
      # paths (#971). A step-level gate, not a workflow `paths:` filter or a
      # job-level `if:`: the required aggregator must always report, and it
      # treats a skipped leg as a failure. A push to main always runs them; so
      # does a PR whose diff cannot be computed.
      - name: Decide whether the ghsync and ghreport suites run
        id: ghsync_gate
        if: ${{ !cancelled() && matrix.suite == 'ghsync' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "ghsync/ghreport suites: run ($EVENT_NAME event)"
            exit 0
          fi
          if ! changed=$(git diff --name-only "origin/$BASE_REF...HEAD"); then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "ghsync/ghreport suites: run (diff against origin/$BASE_REF failed)"
            exit 0
          fi
          hit=""
          while IFS= read -r f; do
            case "$f" in
              skills/ghsync/*|skills/ghreport/*|tests/gitbash.py|tests/conftest.py|tests/pytest_shard.py|tests/ghsync_gitlab_env.py|tests/ghreport_gitlab_env.py|tests/test_ghsync*.py|tests/test_ghreport*.py|.github/workflows/windows.yml)
                hit="$f"; break ;;
            esac
          done <<< "$changed"
          if [ -n "$hit" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "ghsync/ghreport suites: run ($hit changed)"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "ghsync/ghreport suites: skipped (no change under skills/ghsync, skills/ghreport, tests/gitbash.py, tests/conftest.py, tests/pytest_shard.py, tests/*_gitlab_env.py, tests/test_ghsync*.py, tests/test_ghreport*.py or windows.yml)"
          fi

      # One shard of the files, balanced by file size.
      - name: ghsync and ghreport suites under Git Bash
        if: ${{ !cancelled() && matrix.suite == 'ghsync' && steps.ghsync_gate.outputs.run != 'false' }}
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/tests
        run: >-
          uv run --python 3.11 --with pytest --with pyyaml --with "pytest-xdist>=3.6,<4"
          pytest -ra -p no:cacheprovider -n auto --dist loadfile
          -p pytest_shard --shard ${{ matrix.shard }}/${{ matrix.shards }}
          --shard-record "${{ runner.temp }}/shard-seconds.json"
          tests/test_ghsync*.py tests/test_ghreport*.py

      # The seconds per test file a shard took on Windows: the measurements a
      # --shard-weights file would be built from (tests/pytest_shard.py). Not a
      # test result, so an artifact outage or a skipped suite leaves the leg green.
      - name: Upload the shard's seconds per test file
        if: ${{ !cancelled() && matrix.shards > 1 }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: shard-seconds-${{ matrix.suite }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-seconds.json
          if-no-files-found: ignore

      - name: Standalone skill ZIPs
        if: ${{ !cancelled() && matrix.suite == 'smoke' }}
        shell: bash
        run: |
          dest=$(mktemp -d)
          bash scripts/build-standalone-skills.sh --dest "$dest"
          ls -l "$dest"
          compgen -G "$dest/*.zip" >/dev/null

      - name: Eval scaffolds build their fixtures
        if: ${{ !cancelled() && matrix.suite == 'smoke' }}
        shell: bash
        run: |
          while IFS= read -r -d '' s; do
            ws=$(mktemp -d)
            (cd "$ws" && bash "$GITHUB_WORKSPACE/$s")
            git -C "$ws" log --oneline -1
            test -n "$(git -C "$ws" ls-files)"
            echo "ok: $s"
          done < <(git ls-files -z 'evals/**/scaffold.sh')

      # --- Smoke runs on fixtures -----------------------------------------------
      # A ghsync-layout estate (<root>/acme/<repo>/<repo>-main) of two repos whose
      # source and commit subjects hold non-ASCII text, so a wrong code page or
      # separator shows up as a failed scan or a garbled report.

      - name: Smoke fixture estate
        if: ${{ !cancelled() && matrix.suite == 'smoke' }}
        shell: bash
        run: |
          for r in widget gadget; do
            co="$RUNNER_TEMP/estate/acme/$r/$r-main"
            mkdir -p "$co"
            git -C "$co" init -q -b main
            printf 'def greet(name):\n    """Say hello."""\n    return f"caf\xc3\xa9 \xc2\xb7 {name}"\n' > "$co/app.py"
            printf '# %s\n\nSee [the app](app.py).\n' "$r" > "$co/README.md"
            git -C "$co" add -A
            git -C "$co" commit -q -m "init $r "$'caf\xc3\xa9'
          done
          find "$RUNNER_TEMP/estate" -name '*-main' -type d

      - name: Smoke assess_signals.py
        if: ${{ !cancelled() && matrix.suite == 'smoke' }}
        shell: bash
        working-directory: skills/assess
        run: |
          uv run --locked --python 3.11 python scripts/assess_signals.py \
            "$RUNNER_TEMP/estate/acme/widget/widget-main" --out "$RUNNER_TEMP/signals.json"
          uv run --locked --python 3.11 python -c '
          import json, sys
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          scans = doc["scans"]
          assert len(scans) > 10, sorted(scans)
          print(len(scans), "scan blocks")
          ' "$RUNNER_TEMP/signals.json"

      - name: Smoke assess_core.py
        if: ${{ !cancelled() && matrix.suite == 'smoke' }}
        shell: bash
        working-directory: skills/assess
        run: |
          co="$RUNNER_TEMP/estate/acme/widget/widget-main"
          uv run --locked --python 3.11 python scripts/assess_core.py "$co"
          uv run --locked --python 3.11 python scripts/assess_report.py "$co" --stdout > "$RUNNER_TEMP/report.md"
          uv run --locked --python 3.11 python -c '
          import json, sys
          from pathlib import Path
          json.loads((Path(sys.argv[1]) / ".assess" / "run-context.json").read_text(encoding="utf-8"))
          report = Path(sys.argv[2]).read_bytes().decode("utf-8")
          assert report.startswith("# Deterministic Assessment Snapshot: widget-main"), report[:200]
          assert "·" in report, "headline separator missing or garbled"
          assert "init widget café" in report, "commit subject garbled"
          print(report[:400])
          ' "$co" "$RUNNER_TEMP/report.md"

      # Both SVG scripts declare requires-python >=3.12 and their own
      # dependencies in an inline script header, so `uv run <script>` builds a
      # 3.12 environment from that header (uv fetches 3.12; the project venv
      # stays 3.11). check_svg.py is stdlib only and runs on the setup Python.
      - name: Smoke the SVG scripts on Python 3.12
        if: ${{ !cancelled() && matrix.suite == 'smoke' }}
        shell: bash
        working-directory: skills/assess
        run: |
          co="$RUNNER_TEMP/estate/acme/widget/widget-main"
          uv run --python 3.12 scripts/complexity-treemap.py "$co" \
            -o "$RUNNER_TEMP/complexity-heatmap.svg" --stats "$RUNNER_TEMP/complexity-stats.json"
          uv run --python 3.12 scripts/doc-graph-svg.py "$co" -o "$RUNNER_TEMP/doc-graph.svg"
          python ../../tests/fixtures/windows_smoke/check_svg.py \
            "$RUNNER_TEMP/complexity-heatmap.svg" "$RUNNER_TEMP/doc-graph.svg"

      - name: Smoke fleet.py over a ghsync-layout root
        if: ${{ !cancelled() && matrix.suite == 'smoke' }}
        shell: bash
        working-directory: skills/assess
        run: |
          uv run --locked --python 3.11 python ../fleet/scripts/fleet.py "$RUNNER_TEMP/estate" \
            --out "$RUNNER_TEMP/fleet-root" --jobs 2 --no-history
          uv run --locked --python 3.11 python ../../tests/fixtures/windows_smoke/check_fleet_rows.py \
            "$RUNNER_TEMP/fleet-root/repos.jsonl" acme/gadget acme/widget

      - name: Smoke fleet.py --from-list
        if: ${{ !cancelled() && matrix.suite == 'smoke' }}
        shell: bash
        working-directory: skills/assess
        run: |
          # Deliberately mixed: widget by its checkout dir, gadget by its repository
          # dir. --from-list accepts both forms and both must map to acme/<name>.
          printf '%s\n' "$RUNNER_TEMP/estate/acme/widget/widget-main" "$RUNNER_TEMP/estate/acme/gadget" \
            > "$RUNNER_TEMP/fleet-list.txt"
          uv run --locked --python 3.11 python ../fleet/scripts/fleet.py --from-list "$RUNNER_TEMP/fleet-list.txt" \
            --out "$RUNNER_TEMP/fleet-list" --jobs 2 --no-history
          uv run --locked --python 3.11 python ../../tests/fixtures/windows_smoke/check_fleet_rows.py \
            "$RUNNER_TEMP/fleet-list/repos.jsonl" acme/gadget acme/widget

      # tests/fixtures/windows_smoke/contract holds run "smoke": freeze evidence
      # with a passing kill test, verifier results and the provenance token, so
      # both gates open. A run with no record must be refused by both.
      - name: Smoke start_gate.py and complete_gate.py
        if: ${{ !cancelled() && matrix.suite == 'smoke' }}
        shell: bash
        run: |
          dir=tests/fixtures/windows_smoke/contract
          python scripts/contract/start_gate.py smoke --contract-dir "$dir"
          python scripts/contract/complete_gate.py smoke --contract-dir "$dir"
          if python scripts/contract/start_gate.py no-such-run --contract-dir "$dir"; then
            echo "start gate opened for a run with no record"; exit 1
          fi
          if python scripts/contract/complete_gate.py no-such-run --contract-dir "$dir"; then
            echo "complete gate passed a run with no record"; exit 1
          fi
          echo "both gates open for smoke and refuse no-such-run"

  # The required check. `always()` makes it report on every run, including one
  # where a leg failed or was cancelled; the result test makes it pass only
  # when every leg succeeded. needs.suites.result is success only if every
  # leg and shard is; failure, cancelled and skipped all fail here.
  windows:
    name: windows suites + smoke runs
    needs: suites
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every Windows leg passed
        env:
          RESULT: ${{ needs.suites.result }}
        run: |
          echo "windows matrix result: $RESULT"
          [ "$RESULT" = "success" ]
