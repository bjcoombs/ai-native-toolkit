name: Refine triage (reusable)

# Backlog refinement for one issue (issues #1321, #1327). Adopt it with one
# `uses:` line from a workflow triggered on `issues: opened` and
# `issue_comment: created`; refine-triage.yml in this repository is the
# reference caller.
#
# Order of work, with no model until the last possible step:
#   1. skills/refine/scripts/refine.py writes the deterministic verdict.
#   2. A settled issue is handled with no model (refine_apply.py settled).
#   3. Otherwise the /triage-issue command runs. It may read through gh.sh
#      and nothing else, and returns a JSON plan; it never writes.
#   4. refine_apply.py applies the plan through the write scripts, which
#      hold the label allow-list, the agent-ready rule and the call caps.
#
# A `/reopen` comment on an issue the refiner closed as a duplicate runs the
# `reopen` job instead: no model.
#
# Permissions: this workflow declares none, so its jobs take the caller's
# grant. Grant `contents: read` and `issues: write`, and add
# `id-token: write` only when you authenticate with Workload Identity
# Federation. A called workflow cannot ask for more than its caller grants.
#
# allowed_non_write_users is left unset on purpose. The model step runs only
# for an issue or comment from an OWNER, MEMBER or COLLABORATOR; an outside
# contributor's issue gets the deterministic steps here and the scheduled
# sweep, never a model run its author can steer.
on:
  workflow_call:
    inputs:
      enabled:
        description: Kill switch. Pass `vars.REFINE_ENABLED == 'true'`; false skips every job.
        type: boolean
        default: false
      mode:
        description: "`live` writes; any other value, including empty, is a dry-run."
        type: string
        default: dry-run
      issue_number:
        description: The issue to refine.
        type: number
        required: true
      toolkit_repository:
        description: Where skills/refine/ is checked out from.
        type: string
        default: bjcoombs/ai-native-toolkit
      toolkit_ref:
        description: The toolkit ref; keep it equal to the ref in your `uses:` line.
        type: string
        default: main
      model:
        description: A Sonnet-class model.
        type: string
        default: sonnet
      ready_label:
        type: string
        default: agent-ready
      triage_label:
        type: string
        default: needs-triage
      allowed_labels:
        description: Comma-separated labels the refiner may add or remove.
        type: string
        default: agent-ready,needs-triage,bug,enhancement,documentation,question
      max_points:
        description: The largest size that can be agent-ready; match max_points in your definition of ready.
        type: number
        default: 3
      questions_issue:
        description: The issue that collects questions for the maintainer. Empty keeps questions in the job summary.
        type: string
        default: ''
      anthropic_federation_rule_id:
        type: string
        default: ''
      anthropic_organization_id:
        type: string
        default: ''
      anthropic_service_account_id:
        type: string
        default: ''
      anthropic_workspace_id:
        type: string
        default: ''
    secrets:
      anthropic_api_key:
        description: Console API key, in its own workspace with a spend limit. Not needed with Workload Identity Federation.
        required: false

jobs:
  triage:
    if: >-
      inputs.enabled &&
      github.event.issue.state != 'closed' &&
      github.event.comment.user.type != 'Bot' &&
      !(github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/reopen'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: refine-triage-${{ github.repository }}-${{ inputs.issue_number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ inputs.issue_number }}
      REFINE_MODE: ${{ inputs.mode }}
      REFINE_READY_LABEL: ${{ inputs.ready_label }}
      REFINE_TRIAGE_LABEL: ${{ inputs.triage_label }}
      REFINE_ALLOWED_LABELS: ${{ inputs.allowed_labels }}
      REFINE_MAX_POINTS: ${{ inputs.max_points }}
      REFINE_QUESTIONS_ISSUE: ${{ inputs.questions_issue }}
      CLAUDE_CODE_SCRIPT_CAPS: '{"edit-issue-labels.sh":1,"write-size-marker.sh":1,"add-blocked-by.sh":5,"post-questions.sh":1}'
      APPLY: .refine-toolkit/skills/refine/scripts/refine_apply.py
    steps:
      # The default branch only, never code from an issue or a pull request.
      - name: Check out the repository (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # In the toolkit's own repository the scripts come from the
      # default-branch checkout above; elsewhere from the toolkit at the
      # ref the caller pinned.
      - name: Use this repository's refinement scripts
        if: inputs.toolkit_repository == github.repository
        run: ln -s . .refine-toolkit

      - name: Check out the refinement scripts
        if: inputs.toolkit_repository != github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.toolkit_repository }}
          ref: ${{ inputs.toolkit_ref }}
          path: .refine-toolkit
          fetch-depth: 1
          persist-credentials: false

      - name: Write the deterministic verdict
        timeout-minutes: 5
        run: |
          mkdir -p .refine
          python3 .refine-toolkit/skills/refine/scripts/refine.py --repo "$GH_REPO" --issue "$ISSUE" \
            --out .refine/verdict.json

      - name: Route
        id: route
        run: python3 "$APPLY" route --verdict .refine/verdict.json --issue "$ISSUE" >> "$GITHUB_OUTPUT"

      - name: Apply a settled verdict (no model)
        if: steps.route.outputs.model == 'false'
        run: python3 "$APPLY" settled --verdict .refine/verdict.json --issue "$ISSUE"

      - name: Check the credential and the author
        id: gate
        if: steps.route.outputs.model == 'true'
        env:
          HAS_KEY: ${{ secrets.anthropic_api_key != '' }}
          HAS_WIF: ${{ inputs.anthropic_federation_rule_id != '' && inputs.anthropic_organization_id != '' }}
          TRUSTED: ${{ github.event_name == 'workflow_dispatch' || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association || github.event.issue.author_association) }}
        run: |
          if [ "$HAS_KEY" != "true" ] && [ "$HAS_WIF" != "true" ]; then
            echo "::notice::No refiner credential is set; the model step is skipped."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$TRUSTED" != "true" ]; then
            echo "::notice::The author has no write access; this issue waits for the scheduled sweep."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "schema=$(jq -c . .refine-toolkit/skills/refine/scripts/triage-plan.schema.json)" >> "$GITHUB_OUTPUT"

      # The prompts ship under skills/refine/commands/; a repository may keep
      # its own copy in .claude/commands/, which is left in place.
      - name: Install the refiner commands
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p .claude/commands
          for f in .refine-toolkit/skills/refine/commands/*.md; do
            [ -e ".claude/commands/$(basename "$f")" ] || cp "$f" .claude/commands/
          done

      - name: Research the issue (model, read-only)
        id: model
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 10
        continue-on-error: true
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c  # v1.0.290
        with:
          github_token: ${{ github.token }}
          anthropic_api_key: ${{ secrets.anthropic_api_key }}
          anthropic_federation_rule_id: ${{ inputs.anthropic_federation_rule_id }}
          anthropic_organization_id: ${{ inputs.anthropic_organization_id }}
          anthropic_service_account_id: ${{ inputs.anthropic_service_account_id }}
          anthropic_workspace_id: ${{ inputs.anthropic_workspace_id }}
          prompt: "/triage-issue REPO: ${{ github.repository }} ISSUE: ${{ inputs.issue_number }} VERDICT: .refine/verdict.json"
          # The command's allowed-tools name only gh.sh and Read; auto mode
          # reviews anything else, and the disallowed tools never run.
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns 30
            --permission-mode auto
            --disallowedTools "WebFetch,WebSearch,Write,Edit,MultiEdit,NotebookEdit"
            --json-schema '${{ steps.gate.outputs.schema }}'

      - name: Apply the plan (no model)
        if: steps.model.outcome == 'success' && steps.model.outputs.structured_output != ''
        env:
          PLAN: ${{ steps.model.outputs.structured_output }}
        run: |
          printf '%s' "$PLAN" > .refine/plan.json
          python3 "$APPLY" triage --verdict .refine/verdict.json --issue "$ISSUE" --plan .refine/plan.json

      - name: Report final status
        if: always() && steps.gate.outputs.run == 'true'
        env:
          OUTCOME: ${{ steps.model.outcome }}
          CONCLUSION: ${{ steps.model.outputs.conclusion }}
          EXEC_FILE: ${{ steps.model.outputs.execution_file }}
        run: bash .refine-toolkit/skills/refine/scripts/check-model-run.sh

      - name: Write the job summary
        if: always()
        run: python3 "$APPLY" summary >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the verdict, plan and actions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: refine-triage-${{ inputs.issue_number }}-${{ github.run_attempt }}
          path: |
            .refine/
            ${{ runner.temp }}/refine/actions.jsonl
          if-no-files-found: ignore

  reopen:
    if: >-
      inputs.enabled &&
      github.event_name == 'issue_comment' &&
      github.event.comment.user.type != 'Bot' &&
      startsWith(github.event.comment.body, '/reopen')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: refine-reopen-${{ github.repository }}-${{ inputs.issue_number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REFINE_MODE: ${{ inputs.mode }}
      REFINE_TRIAGE_LABEL: ${{ inputs.triage_label }}
      CLAUDE_CODE_SCRIPT_CAPS: '{"reopen-duplicate.sh":1}'
    steps:
      - name: Check out the repository (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      # In the toolkit's own repository the scripts come from the
      # default-branch checkout above; elsewhere from the toolkit at the
      # ref the caller pinned.
      - name: Use this repository's refinement scripts
        if: inputs.toolkit_repository == github.repository
        run: ln -s . .refine-toolkit

      - name: Check out the refinement scripts
        if: inputs.toolkit_repository != github.repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ inputs.toolkit_repository }}
          ref: ${{ inputs.toolkit_ref }}
          path: .refine-toolkit
          fetch-depth: 1
          persist-credentials: false

      - name: Reopen (no model)
        timeout-minutes: 2
        env:
          ISSUE: ${{ inputs.issue_number }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: .refine-toolkit/skills/refine/scripts/reopen-duplicate.sh --issue "$ISSUE" --commenter "$COMMENTER"

      - name: Write the job summary
        if: always()
        run: python3 .refine-toolkit/skills/refine/scripts/refine_apply.py summary >> "$GITHUB_STEP_SUMMARY" || true
