name: Tests

# Runs the pytest suite for the /assess deterministic core.
# The core is intentionally deterministic - same input, same output - so
# CI failure means a real regression, not flake.

# merge_group: the merge queue runs these jobs on main plus the queued pull
# requests, under the same job names, which are the required check contexts
# (#1088). Branch protection reads them by name on the group's head.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  pytest:
    name: skills/assess pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      # The promissory-marker scan shells out to ripgrep; without it the scan
      # honestly degrades to "rg not on PATH" and its fixture tests cannot
      # exercise the detector. ubuntu-latest does not ship rg.
      - name: Install ripgrep
        run: sudo apt-get update -q && sudo apt-get install -y -q ripgrep

      # Tools come from the dev group in skills/assess/pyproject.toml, pinned
      # by the committed uv.lock; --locked fails the step if the lock no longer
      # matches pyproject.toml. pyyaml is in that group because eight structural
      # guards in tests/test_action_contract.py parse action.yml /
      # assess-gate.yml and pytest.skip without it - a skipped guard is a
      # decorative guard. `make check` runs the same command.
      # Line coverage is gated by a floor: [tool.coverage.report] fail_under
      # in skills/assess/pyproject.toml fails this step below it. A ratchet -
      # raise it when coverage rises (docs/contributing/ci.md, "Coverage floor").
      # pytest-xdist (in the same dev group) runs the suite on every core;
      # --dist loadfile keeps each test file on one worker, so state shared
      # across a file's tests (#831) cannot interleave. pytest-cov combines the
      # workers' data before the floor is checked. Serial for debugging:
      # replace `-n auto --dist loadfile` with `-p no:xdist`.
      - name: Run pytest
        run: >-
          uv run --locked pytest -v -n auto --dist loadfile
          --cov=scripts --cov-report=term --cov-report=xml:coverage.xml
        working-directory: skills/assess

      # Absolute CPU-time budgets (marker cpu_budget) skip in the xdist pool: a
      # busy worker on the sibling hardware thread doubles their CPU seconds.
      # They run here, serially; they are no_cover, so the floor above is
      # unaffected. See CPU_BUDGET_SKIP in tests/conftest.py (#930).
      - name: Run the CPU-budget tests serially
        if: ${{ !cancelled() }}
        run: uv run --locked pytest -v -p no:xdist -m cpu_budget --no-cov
        working-directory: skills/assess

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-skills-assess
          path: skills/assess/coverage.xml
          if-no-files-found: warn

      # The guided tour's sample report (#1102), the input of tests/test_cold_reader.py, which
      # the pytest step above already checks. Written here too so a reader can open the exact
      # first screen a newcomer sees on this commit.
      - name: Write the tour's sample report
        run: uv run --locked python scripts/assess_tour.py report --out "$RUNNER_TEMP/tour-sample-report.md"
        working-directory: skills/assess

      # continue-on-error: an artifact outage, or a 409 on a re-run, is not a test result
      # and must not turn this required job red. A missing report still errors in the log.
      - name: Upload the tour's sample report
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tour-sample-report
          path: ${{ runner.temp }}/tour-sample-report.md
          if-no-files-found: error

  pipeline-tests:
    name: scripts/ pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      # Line coverage is gated by a floor: [tool.coverage.report] fail_under
      # in scripts/pyproject.toml fails this step below it. A ratchet - raise
      # it when coverage rises (docs/contributing/ci.md, "Coverage floor").
      # Parallel with pytest-xdist from the dev group, as in the job above.
      - name: Run pytest
        run: >-
          uv run --locked pytest -v -n auto --dist loadfile
          --cov=. --cov-report=term --cov-report=xml:coverage.xml
        working-directory: scripts

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-scripts
          path: scripts/coverage.xml
          if-no-files-found: warn

  contract-tests:
    name: plugin contract pytest
    runs-on: ubuntu-latest
    steps:
      # Full history: the contract tests reason about the diff against the PR
      # base (a same-PR version bump, a changelog entry), which a shallow
      # checkout cannot see. Read-only job, so the token is not persisted.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # fetch-depth: 0 deepens the merge ref, it does not create the base
      # branch ref locally. Fetch it explicitly so `origin/<base>` resolves.
      # No --depth: a depth-limited fetch into a complete clone writes a
      # .git/shallow graft at the fetched tip, cutting the base's ancestry so
      # `git merge-base` cannot resolve past it. fetch-depth: 0 already paid
      # for the full history.
      - name: Fetch the PR base ref
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      # tests/ has no project or lockfile, so pytest-xdist comes in with
      # --with at the same range the two dev groups pin; parallel as above.
      - name: Run pytest
        run: >-
          uv run --with pytest --with pyyaml --with jsonschema --with "pytest-xdist>=3.6,<4"
          pytest -v -n auto --dist loadfile tests/

  lint:
    name: ruff + mypy gates
    runs-on: ubuntu-latest
    steps:
      # Read-only job: don't persist the checkout token for later steps
      # (defense-in-depth; the workflow already restricts permissions to
      # contents: read).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      # Lock freshness: each package's uv.lock must match its pyproject.toml.
      # The --locked runs below would also refuse a stale lock; this step fails
      # first and names the cause, so a pyproject edit without `uv lock` reads
      # as a lock problem rather than a lint or type failure.
      - name: Lockfiles match pyproject.toml
        run: |
          (cd skills/assess && uv lock --check)
          (cd scripts && uv lock --check)

      # Layer 3 complexity ratchet + pyflakes/pycodestyle gate (issue #77).
      # Config (threshold, exclusions, per-function noqa) lives in each
      # pyproject.toml so the gate is identical locally and in CI.
      - name: Ruff lint + complexity gate (skills/assess)
        run: uv run --locked ruff check .
        working-directory: skills/assess

      # The fleet, marathon, refine and doc-contradictions skill scripts (#1208, #1320, #1453) run on skills/assess's
      # locked ruff; skills/fleet/ruff.toml, skills/marathon/ruff.toml, skills/refine/ruff.toml and skills/doc-contradictions/ruff.toml extend
      # its rules, so the gate is the same one.
      - name: Ruff lint + complexity gate (skills/fleet, skills/marathon, skills/refine, skills/doc-contradictions)
        run: uv run --locked ruff check ../fleet/scripts ../marathon/scripts ../refine/scripts ../doc-contradictions/scripts
        working-directory: skills/assess

      - name: Ruff lint + complexity gate (scripts)
        run: uv run --locked ruff check .
        working-directory: scripts

      # Layer 2 type gate (issue #79). mypy strict, disallow_any_generics
      # included, over all of skills/assess/scripts/: the deterministic core
      # (lib/), the orchestrators and the SVG renderers. Config in
      # skills/assess/pyproject.toml selects the files and checks.
      - name: Mypy type gate (skills/assess)
        run: uv run --locked mypy
        working-directory: skills/assess

      # The fleet, marathon, refine and doc-contradictions skill scripts (#1208, #1320, #1453) under the same strict
      # config: run from skills/assess, its mypy_path resolves the lib/ the
      # fleet scripts import, so those calls are checked, not Any.
      - name: Mypy type gate (skills/fleet, skills/marathon, skills/refine, skills/doc-contradictions)
        run: uv run --locked mypy ../fleet/scripts ../marathon/scripts ../refine/scripts ../doc-contradictions/scripts
        working-directory: skills/assess

      # Same gate, full strict, for the build pipeline and contract tooling;
      # config in scripts/pyproject.toml selects the files (floor_check.py
      # excluded) and relaxes per module only the flags floor-protected code
      # fails today.
      - name: Mypy type gate (scripts)
        run: uv run --locked mypy
        working-directory: scripts
