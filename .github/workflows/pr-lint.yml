name: PR Title Lint + Auto-Label

# Two jobs in one workflow:
#  1. Validate the PR title is conventional-commit format
#     (feat|fix|docs|chore|refactor)(scope?)(!)?: description
#     A failing title blocks merge once branch protection requires this check.
#  2. Extract the type from the title and apply the matching label
#     so .github/release.yml can categorise the PR in auto-generated
#     release notes. Labels: feat / fix / docs / chore / refactor.
#     Breaking changes (`feat!:` or `feat(scope)!:`) also get a `breaking`
#     label (create with `gh label create breaking` if you want it).

# merge_group: `Validate PR title` is a required check, so it must report on
# the merge queue's group too (#1088). A group has no pull request title: the
# job runs and passes there without the lint step, because the queue admits
# only a pull request whose title already passed this check. Auto-label skips.
on:
  pull_request:
    types: [opened, edited, synchronize]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write    # github.rest.issues.addLabels uses the issues API

jobs:
  lint-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - name: Merge group (title checked on the pull request)
        if: github.event_name == 'merge_group'
        run: echo "Merge group - the title was validated on the pull request before it was queued."

      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            refactor
            ci
            build
            test
            perf
            style
            revert
          requireScope: false

  auto-label:
    name: Auto-label from PR title
    needs: lint-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const match = title.match(/^(feat|fix|docs|chore|refactor)(\([^)]+\))?(!)?:/);
            if (!match) return;

            const labels = [match[1]];
            if (match[3]) labels.push('breaking');

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels,
            });
