[project]
name = "standalone-skill-pipeline"
version = "0.1.0"
description = "Build pipeline for standalone skill ZIPs"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Mirror the skills/assess gate (issue #77): Ruff's default E4/E7/E9 + F rules
# plus the mccabe complexity ratchet. build_standalone_skill_zip (ccn 17)
# carries an explicit ``# noqa: C901``; the gate fails the moment any other
# function regresses past the threshold.
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.coverage.run]
# The suite's own tests are measurement apparatus, not the package under
# measurement (CI runs --cov=. from this directory).
omit = ["*/tests/*"]

[tool.mypy]
# Mirrors the skills/assess type gate: strict, over the build pipeline modules
# plus the contract and canary tooling. floor_check.py is left out: it carries
# two type errors (one name bound to an int and then a list) and is
# floor-protected (FLOOR.md clause iii), so its fix needs the maintainer's floor
# sign-off. tests/ is out of scope, as it is for skills/assess.
files = [
    "transform_skill.py",
    "standalone_skill_config.py",
    "floor_anchor.py",
    "contract",
    "canaries",
]
# contract/ and canaries/ scripts put contract/ on sys.path and import their
# siblings as top-level modules (``import tiers``, ``import freeze as fz``). Listing
# those directories as bases names each file by its bare module name, so those
# imports resolve and the cross-module calls are type-checked rather than
# silently becoming ``Any`` under ignore_missing_imports.
mypy_path = ["contract", "canaries", "."]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
# Full strict here, disallow_any_generics included: unlike skills/assess, the
# non-floor modules carry no bare generics.
strict = true
# strict does not reject a bare ``# type: ignore``; this makes the error code
# mandatory. The trailing ``  # reason`` stays a house convention mypy cannot check.
enable_error_code = ["ignore-without-code"]

# Floor-protected modules (FLOOR.md clause iii) keep the strict flags they
# already pass; only the flags their current code fails are relaxed, per module,
# because fixing that code needs the maintainer's floor sign-off. Each relaxed
# flag lists the modules that fail it today; tighten a module here in the PR
# that fixes it under sign-off.
[[tool.mypy.overrides]]
# Return a value read from json.loads / a parsed blob without narrowing it.
module = ["floor_anchor", "freeze", "validate_completion", "verifier"]
warn_return_any = false

[[tool.mypy.overrides]]
# Bare ``dict`` / ``subprocess.CompletedProcess`` annotations.
module = ["floor_anchor", "start_gate", "run_canaries"]
disallow_any_generics = false

[[tool.mypy.overrides]]
# One helper with an unannotated parameter.
module = ["floor_anchor"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
