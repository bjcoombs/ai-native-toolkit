<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg class="assess-step-ladder" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 508" width="680" height="508" role="img">
<title>Where you are on the Steps</title>
<desc>In place: Step 3 of 4, Unattended agent changes: agents make changes nobody has to watch. Step 4, Autonomous loops, opens when a coverage gate is enforced.</desc>
<style>svg.assess-step-ladder text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }svg.assess-step-ladder .t-bg,svg.assess-step-ladder .f-bg {fill:#ffffff}svg.assess-step-ladder .s-bg {stroke:#ffffff}svg.assess-step-ladder .t-fg,svg.assess-step-ladder .f-fg {fill:#1d2321}svg.assess-step-ladder .s-fg {stroke:#1d2321}svg.assess-step-ladder .t-muted,svg.assess-step-ladder .f-muted {fill:#5d6763}svg.assess-step-ladder .s-muted {stroke:#5d6763}svg.assess-step-ladder .t-rule,svg.assess-step-ladder .f-rule {fill:#d9dedb}svg.assess-step-ladder .s-rule {stroke:#d9dedb}svg.assess-step-ladder .t-accent,svg.assess-step-ladder .f-accent {fill:#1f6f6b}svg.assess-step-ladder .s-accent {stroke:#1f6f6b}svg.assess-step-ladder .t-bad,svg.assess-step-ladder .f-bad {fill:#b33a2e}svg.assess-step-ladder .s-bad {stroke:#b33a2e}svg.assess-step-ladder .t-warn,svg.assess-step-ladder .f-warn {fill:#b7791f}svg.assess-step-ladder .s-warn {stroke:#b7791f}svg.assess-step-ladder .t-unk,svg.assess-step-ladder .f-unk {fill:#9aa39f}svg.assess-step-ladder .s-unk {stroke:#9aa39f}@media (prefers-color-scheme: dark){svg.assess-step-ladder .t-bg,svg.assess-step-ladder .f-bg {fill:#1a201e}svg.assess-step-ladder .s-bg {stroke:#1a201e}svg.assess-step-ladder .t-fg,svg.assess-step-ladder .f-fg {fill:#e6ebe8}svg.assess-step-ladder .s-fg {stroke:#e6ebe8}svg.assess-step-ladder .t-muted,svg.assess-step-ladder .f-muted {fill:#9aa5a0}svg.assess-step-ladder .s-muted {stroke:#9aa5a0}svg.assess-step-ladder .t-rule,svg.assess-step-ladder .f-rule {fill:#2c3532}svg.assess-step-ladder .s-rule {stroke:#2c3532}svg.assess-step-ladder .t-accent,svg.assess-step-ladder .f-accent {fill:#5fb8b1}svg.assess-step-ladder .s-accent {stroke:#5fb8b1}svg.assess-step-ladder .t-bad,svg.assess-step-ladder .f-bad {fill:#ec7a6c}svg.assess-step-ladder .s-bad {stroke:#ec7a6c}svg.assess-step-ladder .t-warn,svg.assess-step-ladder .f-warn {fill:#e0a84a}svg.assess-step-ladder .s-warn {stroke:#e0a84a}svg.assess-step-ladder .t-unk,svg.assess-step-ladder .f-unk {fill:#5f6a66}svg.assess-step-ladder .s-unk {stroke:#5f6a66}}</style>
<defs></defs>
<rect x="0" y="0" width="680" height="508" class="f-bg"/>
<text x="16.0" y="28.0" font-size="15" text-anchor="start" class="t-fg" font-weight="600">Where you are on the Steps</text>
<text x="16.0" y="48.0" font-size="12" text-anchor="start" class="t-muted">Each rung is a Step of agent autonomy; the gate between two rungs lifts you to the next</text>
<rect x="40.0" y="68.0" width="500.0" height="52.0" rx="6" class="f-bg s-rule" stroke-width="2" data-step="4" data-state="ahead"/>
<text x="54.0" y="89.0" font-size="14" text-anchor="start" class="t-muted" font-weight="600">Step 4 · Autonomous loops</text>
<text x="54.0" y="108.0" font-size="12" text-anchor="start" class="t-muted">Agents run longer loops on their own</text>
<path d="M70.0 204.0 L70.0 128.0 M64.0 134.0 L70.0 128.0 L76.0 134.0" fill="none" class="s-warn" stroke-width="2.5" data-gate-to="4" data-next="true"/>
<text x="88.0" y="144.0" font-size="12" text-anchor="start" class="t-warn" font-weight="600">Next gates: a coverage gate is enforced (not yet);</text>
<text x="88.0" y="160.0" font-size="12" text-anchor="start" class="t-warn" font-weight="600">most merged changes are reviewed and approved (not yet);</text>
<text x="88.0" y="176.0" font-size="12" text-anchor="start" class="t-warn" font-weight="600">agent permissions are committed (not yet);</text>
<text x="88.0" y="192.0" font-size="12" text-anchor="start" class="t-warn" font-weight="600">a boundary or ownership map names module paths (not yet)</text>
<rect x="40.0" y="208.0" width="500.0" height="52.0" rx="6" class="f-accent s-accent" stroke-width="2" data-step="3" data-state="here"/>
<text x="54.0" y="229.0" font-size="14" text-anchor="start" class="t-bg" font-weight="600">Step 3 · Unattended agent changes</text>
<text x="54.0" y="248.0" font-size="12" text-anchor="start" class="t-bg">Agents make changes nobody has to watch</text>
<path d="M550.0 234.0 l10 -7 l0 14 z" class="f-accent"/>
<text x="566.0" y="239.0" font-size="13" text-anchor="start" class="t-accent" font-weight="600">You are here</text>
<path d="M70.0 344.0 L70.0 268.0 M64.0 274.0 L70.0 268.0 L76.0 274.0" fill="none" class="s-muted" stroke-width="1.5" data-gate-to="3"/>
<text x="88.0" y="284.0" font-size="12" text-anchor="start" class="t-muted">Gates: CI turns red on a broken check (in place);</text>
<text x="88.0" y="300.0" font-size="12" text-anchor="start" class="t-muted">merged changes show review evidence (in place);</text>
<text x="88.0" y="316.0" font-size="12" text-anchor="start" class="t-muted">CI runs a linter (in place);</text>
<text x="88.0" y="332.0" font-size="12" text-anchor="start" class="t-muted">a secrets guard is configured (in place)</text>
<rect x="40.0" y="348.0" width="500.0" height="52.0" rx="6" class="f-bg s-accent" stroke-width="2" data-step="2" data-state="reached"/>
<text x="54.0" y="369.0" font-size="14" text-anchor="start" class="t-fg" font-weight="600">Step 2 · Supervised agent changes</text>
<text x="54.0" y="388.0" font-size="12" text-anchor="start" class="t-fg">An agent makes changes, and a person reviews each one</text>
<path d="M70.0 436.0 L70.0 408.0 M64.0 414.0 L70.0 408.0 L76.0 414.0" fill="none" class="s-muted" stroke-width="1.5" data-gate-to="2"/>
<text x="88.0" y="424.0" font-size="12" text-anchor="start" class="t-muted">Gate: the instruction file names a check, and its claims hold (in place)</text>
<rect x="40.0" y="440.0" width="500.0" height="52.0" rx="6" class="f-bg s-accent" stroke-width="2" data-step="1" data-state="reached"/>
<text x="54.0" y="461.0" font-size="14" text-anchor="start" class="t-fg" font-weight="600">Step 1 · Assisted</text>
<text x="54.0" y="480.0" font-size="12" text-anchor="start" class="t-fg">An agent can read and help with your code</text>
</svg>
