<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 264" width="680" height="264" role="img">
<title>Review on recent merges</title>
<desc>In place: 9 of 30 sampled merged changes approved and 20 more reviewed. Each tick is one merged change, oldest first, so a run of ticks merged without review shows a stretch that a single share hides; a dot marks review-bot output.</desc>
