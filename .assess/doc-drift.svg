<title>Docs behind their code</title>
<desc>In place: 22 docs map to code of their own, and 19 of them keep pace with that code. The longest bars are the docs whose code has moved most since the doc last changed, so they are the first to read again before an agent leans on them. 225 docs measured against the whole repository are counted here, not drawn.</desc>
