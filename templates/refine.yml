# Backlog refinement for GitLab CI (#1327).
#
# The GitLab twin of the refiner's GitHub workflows
# (.github/workflows/reusable-refine-*.yml): the same refine.py verdict, the
# same /triage-issue and /dedupe prompts and the same guarded write scripts,
# run from the toolkit fetched at a pinned release tag or commit. Add it to a
# project's .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/bjcoombs/ai-native-toolkit/v4.0.0/templates/refine.yml
#
# GitLab has no CI trigger for a new issue, so a pipeline schedule on the
# default branch does the work: the sweep over every open issue, plus triage
# and dedupe for each issue opened since the last refine-apply job that
# succeeded there. The jobs run in every scheduled pipeline on the default
# branch; with other schedules, set REFINE_ENABLED on the refiner's schedule
# only. A project webhook calling a pipeline trigger token is an optional
# faster path for new issues (docs/refine.md).
#
# Three jobs, so the model never holds a token that can write:
#   refine-verdict  no model, read token: refine.py writes the verdict and
#                   lists the new issues.
#   refine-plan     the model, read token: for each new issue the script left
#                   unsettled, /triage-issue and /dedupe return JSON plans.
#                   Its allowed tools are the read-only gh.sh and Read of the
#                   verdict.
#   refine-apply    no model, write token (environment refine-apply): checks
#                   each plan against its schema and applies it, or the
#                   settled verdict, through the write scripts and their caps;
#                   then, on a scheduled or manual pipeline, the sweep.
#
# Settings are CI/CD variables; the defaults below give way to a project or
# group variable of the same name:
#   REFINE_ENABLED            kill switch; every job is skipped unless "true"
#   REFINE_MODE               "live" writes; anything else is a dry-run
#   REFINE_READ_TOKEN         read_api token for refine-verdict and refine-plan
#   REFINE_WRITE_TOKEN        api token, scoped to the environment refine-apply
#   REFINE_ANTHROPIC_API_KEY  Claude Console key in a workspace with a spend limit
#   REFINE_QUESTIONS_ISSUE, REFINE_READY_LABEL, REFINE_TRIAGE_LABEL,
#   REFINE_ALLOWED_LABELS, REFINE_MAX_POINTS, REFINE_CLOSE_CAP,
#   REFINE_BUILDER_SLOTS, REFINE_MODEL, REFINE_MAX_NEW_ISSUES, REFINE_BOT_LOGIN
#
# The toolkit is fetched by tag or full commit sha from the inputs below,
# never from a variable, so no pipeline variable chooses the code that runs
# with the write token.
spec:
  inputs:
    toolkit_ref:
      description: The ai-native-toolkit release tag (vX.Y.Z) or full 40-character commit sha the jobs run. Keep a tag equal to the tag in the include line.
      default: v4.0.0
      regex: ^(v[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{40})$
    toolkit_url:
      description: Where to fetch the toolkit from, for a mirror on a self-hosted GitLab.
      default: https://github.com/bjcoombs/ai-native-toolkit.git
    image:
      description: The image for refine-verdict and refine-apply. It needs bash, curl, git and python3 (3.8 or newer).
      default: python:3.12-bookworm
    plan_image:
      description: The image for refine-plan. It also needs node and npm for Claude Code, and apt-get for jq.
      default: node:22-bookworm
    claude_code_version:
      description: The exact @anthropic-ai/claude-code version refine-plan installs.
      default: 2.1.322
    glab_version:
      description: The glab release the jobs install.
      default: 1.128.0
    glab_sha256:
      description: The sha256 of glab_<version>_linux_amd64.tar.gz for that release, from its checksums.txt.
      default: bc024819e7598b19429a199cd87f640d98b2b67416d8ad796f19e4260b57a7c7
    stage:
      description: The stage the three jobs run in.
      default: test
---
.refine-base:
  stage: $[[ inputs.stage ]]
  image: $[[ inputs.image ]]
  rules:
    - if: $REFINE_ENABLED != "true"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "web")
  variables:
    GIT_DEPTH: "1"
    GITLAB_HOST: $CI_SERVER_URL
    GLAB_CHECK_UPDATE: "false"
    GH_REPO: $CI_PROJECT_PATH
    REFINE_PLATFORM: gitlab
    REFINE_MODE: dry-run
    REFINE_READY_LABEL: agent-ready
    REFINE_TRIAGE_LABEL: needs-triage
    REFINE_ALLOWED_LABELS: agent-ready,needs-triage,bug,enhancement,documentation,question
    REFINE_MAX_POINTS: "0"  # 0: max_points from the definition of ready
    REFINE_CLOSE_CAP: "10"
    REFINE_BUILDER_SLOTS: "5"
    REFINE_MODEL: sonnet
    REFINE_MAX_NEW_ISSUES: "20"
    SCRIPTS: .refine-toolkit/skills/refine/scripts
  before_script:
    # The toolkit is pinned to a release tag or a full commit sha; a branch
    # name or a short sha fails the job.
    - |
      ref='$[[ inputs.toolkit_ref ]]'
      if ! printf '%s' "$ref" | grep -Eq '^(v[0-9]+\.[0-9]+\.[0-9]+|[0-9a-f]{40})$'; then
        echo "refine: the toolkit is pinned only to a release tag (vX.Y.Z) or a full commit sha, not '$ref'."
        exit 1
      fi
      git init -q .refine-toolkit
      git -C .refine-toolkit fetch -q --depth 1 '$[[ inputs.toolkit_url ]]' "$ref"
      git -C .refine-toolkit checkout -q FETCH_HEAD
    - |
      glab_v='$[[ inputs.glab_version ]]'
      curl -sSfL -o /tmp/glab.tgz "https://gitlab.com/api/v4/projects/gitlab-org%2Fcli/packages/generic/glab/${glab_v}/glab_${glab_v}_linux_amd64.tar.gz"
      echo '$[[ inputs.glab_sha256 ]]  /tmp/glab.tgz' | sha256sum --check --strict
      tar -xzf /tmp/glab.tgz -C /usr/local bin/glab
    - mkdir -p .refine

# No model. Writes the verdict over the whole backlog and the issues to
# triage this run. A webhook pipeline for anything but a newly opened issue
# stops here, with no issues.
refine-verdict:
  extends: .refine-base
  timeout: 15m
  variables:
    GITLAB_TOKEN: $REFINE_READ_TOKEN
  script:
    - |
      if [ -n "${REFINE_WRITE_TOKEN:-}" ]; then
        echo "refine: REFINE_WRITE_TOKEN reached a read-only job. Scope the variable to the environment refine-apply."
        exit 1
      fi
      python3 "$SCRIPTS/refine_gitlab_read.py" new-issues --max "$REFINE_MAX_NEW_ISSUES" \
        ${TRIGGER_PAYLOAD:+--payload "$TRIGGER_PAYLOAD"} > .refine/issues.txt
      if [ "$CI_PIPELINE_SOURCE" = "trigger" ] && [ ! -s .refine/issues.txt ]; then
        echo "refine: the webhook did not open an issue; nothing to do."
        exit 0
      fi
      python3 .refine-toolkit/skills/refine/scripts/refine.py --platform gitlab --repo "$CI_PROJECT_PATH" \
        --builder-slots "$REFINE_BUILDER_SLOTS" --out .refine/verdict.json
  artifacts:
    paths:
      - .refine/verdict.json
      - .refine/issues.txt
    expire_in: 30 days

# The model, with a token that can read issues but write nothing. Default
# permission mode: a tool off --allowedTools is denied, never asked about.
# A failed model run drops that issue's plan and ends the job with exit 7,
# shown as a warning, so the other issues' plans still reach refine-apply.
refine-plan:
  extends: .refine-base
  image: $[[ inputs.plan_image ]]
  needs: [refine-verdict]
  timeout: 90m
  allow_failure:
    exit_codes: [7]
  variables:
    GITLAB_TOKEN: $REFINE_READ_TOKEN
  script:
    - |
      if [ -n "${REFINE_WRITE_TOKEN:-}" ]; then
        echo "refine: REFINE_WRITE_TOKEN reached the model's job. Scope the variable to the environment refine-apply."
        exit 1
      fi
      mkdir -p .refine/plans .refine/model
      if [ ! -s .refine/issues.txt ]; then echo "refine: no new issues."; exit 0; fi
      if [ -z "${REFINE_ANTHROPIC_API_KEY:-}" ]; then
        echo "refine: REFINE_ANTHROPIC_API_KEY is not set; the model step is skipped."
        exit 0
      fi
      apt-get update -qq && apt-get install -y -qq jq >/dev/null
      npm install -g --no-fund --no-audit "@anthropic-ai/claude-code@$[[ inputs.claude_code_version ]]"
      mkdir -p .claude/commands
      for f in .refine-toolkit/skills/refine/commands/*.md; do
        [ -e ".claude/commands/$(basename "$f")" ] || cp "$f" .claude/commands/
      done
      run_model() {  # <command> <issue> <schema file> <max turns>
        log=".refine/model/$1-$2.json"
        env -u REFINE_WRITE_TOKEN -u CI_JOB_TOKEN -u CI_REGISTRY_PASSWORD -u CI_DEPENDENCY_PROXY_PASSWORD \
          ANTHROPIC_API_KEY="$REFINE_ANTHROPIC_API_KEY" timeout 600 \
          claude -p "/$1 REPO: $CI_PROJECT_PATH ISSUE: $2 VERDICT: .refine/verdict.json" \
            --model "$REFINE_MODEL" --max-turns "$4" --output-format json \
            --allowedTools "Bash(./.refine-toolkit/skills/refine/scripts/gh.sh:*),Read(./.refine/**)" \
            --disallowedTools "WebFetch,WebSearch,Write,Edit,MultiEdit,NotebookEdit" \
            --json-schema "$(jq -c . "$3")" > "$log"
        code=$?
        outcome=failure; [ "$code" = 0 ] && outcome=success
        OUTCOME=$outcome CONCLUSION=$outcome EXEC_FILE=$log bash "$SCRIPTS/check-model-run.sh" || return 1
        jq -e '.structured_output | objects' "$log" > ".refine/plans/$2-$1.json" || { rm -f ".refine/plans/$2-$1.json"; return 1; }
      }
      failed=0
      for n in $(cat .refine/issues.txt); do
        if [ "$(python3 "$SCRIPTS/refine_gitlab_read.py" trusted-author --issue "$n")" != "true" ]; then
          echo "refine: #$n: the author is not a Reporter or above, so no model runs; the sweep covers it."
          continue
        fi
        if [ "$(python3 "$SCRIPTS/refine_apply.py" route --verdict .refine/verdict.json --issue "$n")" = "model=true" ]; then
          run_model triage-issue "$n" "$SCRIPTS/triage-plan.schema.json" 30 || failed=1
        fi
        if [ "$(python3 "$SCRIPTS/refine_apply.py" dedupe-route --verdict .refine/verdict.json --issue "$n")" = "model=true" ]; then
          run_model dedupe "$n" "$SCRIPTS/dedupe-plan.schema.json" 20 || failed=1
        fi
      done
      if [ "$failed" != 0 ]; then exit 7; fi
  artifacts:
    when: always
    paths:
      - .refine/plans/
      - .refine/model/
    expire_in: 30 days

# No model. The only job that holds the write token. Each issue gets its own
# call caps, as each GitHub run does; the sweep runs on scheduled and manual
# pipelines, not on a webhook.
refine-apply:
  extends: .refine-base
  needs:
    - job: refine-verdict
      artifacts: true
    - job: refine-plan
      artifacts: true
  environment:
    name: refine-apply
    action: prepare
  resource_group: refine-apply
  timeout: 30m
  variables:
    GITLAB_TOKEN: $REFINE_WRITE_TOKEN
    REFINE_ACTIONS_LOG: .refine/actions.jsonl
  script:
    - |
      if [ -z "${REFINE_WRITE_TOKEN:-}" ]; then
        if [ "$REFINE_MODE" = "live" ]; then
          echo "refine: REFINE_MODE is live but REFINE_WRITE_TOKEN is not set for the environment refine-apply."
          exit 1
        fi
        echo "refine: no REFINE_WRITE_TOKEN; the dry-run reads with REFINE_READ_TOKEN."
        export GITLAB_TOKEN="$REFINE_READ_TOKEN"
      fi
      if [ ! -s .refine/verdict.json ]; then echo "refine: no verdict this run."; exit 0; fi
      APPLY="$SCRIPTS/refine_apply.py"; V=.refine/verdict.json; failed=0
      for n in $(cat .refine/issues.txt); do
        export REFINE_STATE_DIR=".refine/state/$n"
        export CLAUDE_CODE_SCRIPT_CAPS='{"edit-issue-labels.sh":1,"write-size-marker.sh":1,"add-blocked-by.sh":5,"post-questions.sh":1}'
        if [ -f ".refine/plans/$n-triage-issue.json" ]; then
          python3 "$APPLY" triage --verdict "$V" --issue "$n" --plan ".refine/plans/$n-triage-issue.json" || failed=1
        elif [ "$(python3 "$APPLY" route --verdict "$V" --issue "$n")" = "model=false" ]; then
          python3 "$APPLY" settled --verdict "$V" --issue "$n" || failed=1
        fi
        export CLAUDE_CODE_SCRIPT_CAPS='{"close-duplicate.sh":1,"comment-on-duplicates.sh":1}'
        if [ "$(python3 "$APPLY" dedupe-route --verdict "$V" --issue "$n")" = "model=false" ]; then
          python3 "$APPLY" dedupe-exact --verdict "$V" --issue "$n" || failed=1
        elif [ -f ".refine/plans/$n-dedupe.json" ]; then
          python3 "$APPLY" dedupe --verdict "$V" --issue "$n" --plan ".refine/plans/$n-dedupe.json" || failed=1
        fi
      done
      if [ "$CI_PIPELINE_SOURCE" != "trigger" ]; then
        export REFINE_STATE_DIR=.refine/state/sweep
        export CLAUDE_CODE_SCRIPT_CAPS='{"edit-issue-labels.sh":30,"close-duplicate.sh":10,"post-buffer-report.sh":1}'
        python3 "$APPLY" sweep --verdict "$V" || failed=1
      fi
      python3 "$APPLY" summary || true
      if [ "$failed" != 0 ]; then exit 1; fi
  artifacts:
    when: always
    paths:
      - .refine/actions.jsonl
    expire_in: 30 days
