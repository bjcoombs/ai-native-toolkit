# File-size ratchet for the Python under skills/assess/ and scripts/.
#
# Every Python file there may be at most `default_limit` lines. A file already
# over the limit when the ratchet started is listed under [ceilings] with its
# line count as its ceiling: it may shrink, but not grow past that ceiling.
# Enforced by tests/test_file_size_ratchet.py (the `plugin contract pytest`
# job).
#
# A file over its limit: split it. Raise a ceiling only when the growth is
# justified, and say why in that entry's `reason`. Once an allowlisted file
# drops to `default_limit` or below, delete its entry; the test fails until
# you do.
#
# The ceiling follows a file down. An allowlisted file more than
# max(shrink_slack_lines, shrink_slack_percent% of its ceiling) lines below
# that ceiling fails until the ceiling is lowered to the current count, a
# one-line edit. 20 lines or 2%: a typical edit to these files (a new import,
# a reworded docstring, a small fix) moves them by single digits, so honest
# edits never force a ceiling edit, while even a ceiling near 2000 leaves only
# about 2% to regrow without review - not the hundreds a split would free.
#
# 800 lines: the current distribution has a median of 276, p75 of 473 and
# p90 of 876 across 159 files, so 800 sits above the shape of a well-split
# module and test file (88% of files already fit) while biting on the
# monoliths that only ever grow.

default_limit = 800
shrink_slack_lines = 20
shrink_slack_percent = 2
roots = ["skills/assess", "scripts"]

