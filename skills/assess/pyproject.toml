[project]
name = "assess"
version = "0.1.0"
description = "Deterministic core for /assess skill"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "grimp>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ holds the modules under test; tests/ is added so test modules can
# import shared test helpers (e.g. `golden.py`, the dogfood-baseline normalizer).
pythonpath = ["scripts", "tests"]
addopts = "-v --tb=short"
# Fixture repos under tests/fixtures/ contain test_*.py files that are scanned
# as *data* by the test_pressure heuristics, not run as pytest tests. They
# import from their own `src/` package which isn't on the path, so collecting
# them errors. Exclude the whole fixtures tree from collection.
norecursedirs = ["tests/fixtures"]
# pytest-cov registers no_cover itself; declaring it here keeps a run without
# pytest-cov (the plain local `uv run --with pytest pytest`) free of an
# unknown-marker warning.
markers = ["no_cover: run this test with coverage tracing paused (pytest-cov)"]

[tool.ruff]
target-version = "py311"
# Test fixtures are deliberately messy sample repos consumed as *data*, not
# code we own. The doc-graph and test-pressure scans already exclude them; the
# linter must too, or it grades the fixtures instead of the core.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Ruff's default rule set (E4/E7/E9 pycodestyle + F pyflakes) plus the mccabe
# cyclomatic-complexity gate (C901). This is the Layer 3 "no linter" fix from
# issue #77: a load-bearing complexity ratchet, not a style overhaul.
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files deliberately re-export names (some private, e.g.
# test_pressure's shutil/subprocess/_parse_* surfaced for test monkeypatching);
# F401 "imported but unused" is the wrong signal there.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
# Per-function cyclomatic complexity. 15 fences current reality: every function
# already sits at or below it except two genuine offenders (ccn 17-19), which
# carry an explicit ``# noqa: C901`` with a note - authorship_analysis here and
# build_standalone_skill_zip in scripts/. The gate fails the moment any other
# function regresses past 15; ratchet down as the two are decomposed
# (build_doc_graph was split into phases and render in doc-graph-svg.py into
# named steps, each retiring its waiver).
max-complexity = 15

[tool.mypy]
# Issue #79: type hints existed but were unenforced. This gate makes them a
# contract. Scoped to the deterministic core (lib/) where the annotations are
# densest and most load-bearing, plus the orchestrator assess_core.py (the
# most-churned file, ratcheted in here), and the two SVG renderers. The
# renderers have hyphenated filenames, so they are listed as paths, not module
# names. The remaining orchestrator scripts (assess_finalize.py and the rest)
# and the build pipeline are the next ratchet step.
files = [
    "scripts/lib",
    "scripts/assess_core.py",
    "scripts/doc-graph-svg.py",
    "scripts/complexity-treemap.py",
]
# lib/ is a package; treat scripts/ as the import base so lib.<mod> resolves and
# the back-compat shims (scripts/stats_diff.py, lib/assess_core.py) don't collide
# as duplicate top-level modules.
mypy_path = "scripts"
explicit_package_bases = true
namespace_packages = true
# networkx and grimp ship no type stubs; their absence is not a code defect.
# The lib modules carry a defensive mypy assignment suppression on their
# degrade-gracefully ``nx = None`` fallbacks so they also type-check when stubs
# ARE installed; ``warn_unused_ignores`` is left off so those stay put.
ignore_missing_imports = true
warn_redundant_casts = true

[tool.mutmut]
# Layer 6 truth-pressure: line coverage shows the tests execute this code,
# mutation testing shows they would fail if it were wrong. Scoped to three
# deterministic, well-tested lib/ modules from /assess's own test-focus list;
# widening the scope is a deliberate ratchet, since a run is O(mutants).
# Run weekly and on demand by .github/workflows/mutation.yml, never per PR.
#
# "src" is a link to scripts/ made at run time (`ln -sfn scripts src`, ignored
# by git). mutmut 3 names a mutant after its file path with only a leading
# "src." stripped, so scripts/lib/x.py would be keyed scripts.lib.x while the
# tests import it as lib.x (pythonpath = scripts) and no mutant would match.
# Run locally from skills/assess:
#   ln -sfn scripts src
#   uv run --with mutmut==3.8.0 --with pytest mutmut run
source_paths = ["src"]
only_mutate = [
    "src/lib/stats_diff.py",
    "src/lib/promissory_markers.py",
    "src/lib/doc_staleness.py",
]
# Each mutant runs only the tests mutmut's coverage pass maps to it; this list
# bounds that pass to the suites that own the modules in scope. (tests_dir is
# deprecated in mutmut 3.8 and appends the whole tests/ tree to this list.)
pytest_add_cli_args_test_selection = [
    "tests/test_stats_diff.py",
    "tests/test_promissory_markers.py",
    "tests/test_doc_staleness.py",
]
