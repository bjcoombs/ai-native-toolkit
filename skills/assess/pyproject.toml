[project]
name = "assess"
version = "0.1.0"
description = "Deterministic core for /assess skill"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.0",
    "grimp>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# scripts/ holds the modules under test; tests/ is added so test modules can
# import shared test helpers (e.g. `golden.py`, the dogfood-baseline normalizer).
pythonpath = ["scripts", "tests"]
addopts = "-v --tb=short"
# Fixture repos under tests/fixtures/ contain test_*.py files that are scanned
# as *data* by the test_pressure heuristics, not run as pytest tests. They
# import from their own `src/` package which isn't on the path, so collecting
# them errors. Exclude the whole fixtures tree from collection.
norecursedirs = ["tests/fixtures"]
# pytest-cov registers no_cover itself; declaring it here keeps a run without
# pytest-cov (the plain local `uv run --with pytest pytest`) free of an
# unknown-marker warning.
markers = ["no_cover: run this test with coverage tracing paused (pytest-cov)"]

[tool.coverage.report]
# Layer 6 floor: CI's --cov=scripts run fails below this line rate. Measured
# 93.44% (9945 statements, 652 missed) on 2026-10-07, identical over three
# runs; rounded down to 93, a margin of about 44 uncovered lines. A ratchet:
# raise it when coverage rises, never lower it without a stated reason in the
# PR that does. Applies to any local run with pytest-cov too.
fail_under = 93

[tool.ruff]
target-version = "py311"
# Test fixtures are deliberately messy sample repos consumed as *data*, not
# code we own. The doc-graph and test-pressure scans already exclude them; the
# linter must too, or it grades the fixtures instead of the core.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
# Ruff's default rule set (E4/E7/E9 pycodestyle + F pyflakes) plus the mccabe
# cyclomatic-complexity gate (C901). This is the Layer 3 "no linter" fix from
# issue #77: a load-bearing complexity ratchet, not a style overhaul.
select = ["E4", "E7", "E9", "F", "C901"]

[tool.ruff.lint.per-file-ignores]
# Package __init__.py files deliberately re-export names (some private, e.g.
# test_pressure's shutil/subprocess/_parse_* surfaced for test monkeypatching);
# F401 "imported but unused" is the wrong signal there.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.mccabe]
# Per-function cyclomatic complexity. 15 fences current reality: every function
# already sits at or below it except two genuine offenders (ccn 17-19), which
# carry an explicit ``# noqa: C901`` with a note - authorship_analysis here and
# build_standalone_skill_zip in scripts/. The gate fails the moment any other
# function regresses past 15; ratchet down as the two are decomposed
# (build_doc_graph was split into phases and render in doc-graph-svg.py into
# named steps, each retiring its waiver).
max-complexity = 15

[tool.mypy]
# Issue #79: type hints existed but were unenforced. This gate makes them a
# contract. It covers every module under scripts/: the deterministic core
# (lib/), every orchestrator (assess_core, assess_finalize, assess_report,
# assess_gate, assess_emit_workflow), and the two SVG renderers. Listing the
# directory rather than each file means a new orchestrator joins the gate by
# construction instead of waiting for a ratchet step. tests/ is out of scope.
files = ["scripts"]
# lib/ is a package; treat scripts/ as the import base so lib.<mod> resolves
# the same way the orchestrators import it at runtime.
mypy_path = "scripts"
explicit_package_bases = true
namespace_packages = true
# networkx ships no type stubs; their absence is not a code defect (grimp ships
# py.typed, so it is checked). The lib modules' degrade-gracefully ``nx = None`` fallbacks carry
# ``# type: ignore[assignment, unused-ignore]``: without stubs nx is Any and the
# ignore is unused; with stubs installed the None assignment is a real mismatch.
ignore_missing_imports = true
# Strict, minus one flag globally. disallow_any_generics flagged 444 bare
# ``dict`` / ``list`` annotations, almost all on JSON blobs (run-context,
# stats sidecars, finding rows). The fix is a TypedDict per known shape
# (shared row shapes in ``lib/run_context_types.py``) and ``dict[str, Any]``
# only where the keys are genuinely dynamic, applied module by module through
# the overrides below. 235 remain, all in the not-yet-covered modules.
strict = true
disallow_any_generics = false
# strict does not reject a bare ``# type: ignore``; this makes the error code
# mandatory. The trailing ``  # reason`` stays a house convention mypy cannot check.
enable_error_code = ["ignore-without-code"]

# disallow_any_generics ratchet. Every lib/ module is covered by the wildcard,
# so a new lib module joins the stricter gate by construction; the second
# override lists the modules not yet converted. Ratchet rule: the exception
# list only shrinks and the covered list only grows. When no exception and no
# uncovered script is left, flip the global flag above to true and delete both
# overrides. Uncovered today: the exceptions below plus the orchestrators
# assess_core, assess_finalize, assess_report and complexity-treemap.
[[tool.mypy.overrides]]
module = ["lib.*", "assess_emit_workflow", "assess_gate", "doc-graph-svg"]
disallow_any_generics = true

[[tool.mypy.overrides]]
module = ["lib.keyhole_signals", "lib.test_pressure.*"]
disallow_any_generics = false

[tool.mutmut]
# Layer 6 truth-pressure: line coverage shows the tests execute this code,
# mutation testing shows they would fail if it were wrong. Scoped to five
# deterministic lib/ modules: three small ones from /assess's own test-focus
# list plus the two largest complexity hotspots (doc_graph, keyhole_signals),
# about 4.5k mutants as of 2026-10 (the weekly job summary has the live count).
# Widening the scope is a deliberate ratchet, since a run is O(mutants): keep
# the weekly run well inside the workflow's 45m budget.
# Run weekly and on demand by .github/workflows/mutation.yml, never per PR.
#
# "src" is a committed relative symlink to scripts/. mutmut 3 names a mutant
# after its file path with only a leading "src." stripped, so scripts/lib/x.py
# would be keyed scripts.lib.x while the tests import it as lib.x
# (pythonpath = scripts) and no mutant would match. Committing the link keeps
# this config self-contained: CI and the /assess opt-in mutation pass run it as
# checked out. /assess's walks do not descend the link (treemap entries are
# keyed by resolved path), so nothing is counted twice. Run locally from
# skills/assess, then remove mutants/ (gitignored, and skipped by /assess):
#   uv run --with mutmut==3.8.0 --with pytest mutmut run
#   uv run --with mutmut==3.8.0 --with pytest mutmut results   # survivors
#   rm -rf mutants
source_paths = ["src"]
only_mutate = [
    "src/lib/stats_diff.py",
    "src/lib/promissory_markers.py",
    "src/lib/doc_staleness.py",
    "src/lib/doc_graph.py",
    "src/lib/keyhole_signals.py",
]
# Each mutant runs only the tests mutmut's coverage pass maps to it; this list
# bounds that pass to the suites that own the modules in scope. (tests_dir is
# deprecated in mutmut 3.8 and appends the whole tests/ tree to this list.)
pytest_add_cli_args_test_selection = [
    "tests/test_stats_diff.py",
    "tests/test_promissory_markers.py",
    "tests/test_doc_staleness.py",
    "tests/test_doc_graph.py",
    "tests/test_keyhole_signals.py",
]
