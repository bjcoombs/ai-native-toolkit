<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg class="fleet-trend" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 526" width="880" height="526" role="img">
<title>Group Step over time</title>
<desc>Line chart of each fleet group&#x27;s lowest Step over its measured repositories across dated fleet runs, oldest on the left, never an average; a line breaks where the maturity-model version changes, older runs without stored Steps are named, not drawn, and runs where a group has no measured repository are listed on a hatched note, not drawn at Step 0.</desc>
