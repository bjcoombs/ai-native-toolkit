<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 470" width="1090" height="470" role="img">
<title>Practices in place by truth tag, across the fleet</title>
<desc>In place: 4 of the 8 truth tags measured on at least one repository, each shown with the median share met. Each dot is the median share of a tag&#x27;s measured conditions met across the repositories measured on it, and the whisker spans the middle half of them. A dashed row was not measured on any repository, never read as zero.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }.t-bg,.f-bg{fill:#ffffff}.s-bg{stroke:#ffffff}.t-fg,.f-fg{fill:#1d2321}.s-fg{stroke:#1d2321}.t-muted,.f-muted{fill:#5d6763}.s-muted{stroke:#5d6763}.t-rule,.f-rule{fill:#d9dedb}.s-rule{stroke:#d9dedb}.t-accent,.f-accent{fill:#1f6f6b}.s-accent{stroke:#1f6f6b}.t-bad,.f-bad{fill:#b33a2e}.s-bad{stroke:#b33a2e}.t-warn,.f-warn{fill:#b7791f}.s-warn{stroke:#b7791f}.t-unk,.f-unk{fill:#9aa39f}.s-unk{stroke:#9aa39f}@media (prefers-color-scheme: dark){.t-bg,.f-bg{fill:#1a201e}.s-bg{stroke:#1a201e}.t-fg,.f-fg{fill:#e6ebe8}.s-fg{stroke:#e6ebe8}.t-muted,.f-muted{fill:#9aa5a0}.s-muted{stroke:#9aa5a0}.t-rule,.f-rule{fill:#2c3532}.s-rule{stroke:#2c3532}.t-accent,.f-accent{fill:#5fb8b1}.s-accent{stroke:#5fb8b1}.t-bad,.f-bad{fill:#ec7a6c}.s-bad{stroke:#ec7a6c}.t-warn,.f-warn{fill:#e0a84a}.s-warn{stroke:#e0a84a}.t-unk,.f-unk{fill:#5f6a66}.s-unk{stroke:#5f6a66}}</style>
<defs></defs>
<rect x="0" y="0" width="1090" height="470" class="f-bg"/>
<text x="16.0" y="28.0" font-size="15" text-anchor="start" class="t-fg" font-weight="600">Practices in place by truth tag, across the fleet</text>
<text x="16.0" y="48.0" font-size="12" text-anchor="start" class="t-muted">Median share of each tag's measured conditions met, one row per truth tag</text>
<text x="382.0" y="76.0" font-size="11" text-anchor="middle" class="t-muted">0%</text>
<text x="462.0" y="76.0" font-size="11" text-anchor="middle" class="t-muted">25%</text>
<text x="542.0" y="76.0" font-size="11" text-anchor="middle" class="t-muted">50%</text>
<text x="622.0" y="76.0" font-size="11" text-anchor="middle" class="t-muted">75%</text>
<text x="702.0" y="76.0" font-size="11" text-anchor="middle" class="t-muted">100%</text>
<line x1="382.0" y1="88.0" x2="382.0" y2="328.0" class="s-rule" stroke-width="1"/>
<line x1="462.0" y1="88.0" x2="462.0" y2="328.0" class="s-rule" stroke-width="1"/>
<line x1="542.0" y1="88.0" x2="542.0" y2="328.0" class="s-rule" stroke-width="1"/>
<line x1="622.0" y1="88.0" x2="622.0" y2="328.0" class="s-rule" stroke-width="1"/>
<line x1="702.0" y1="88.0" x2="702.0" y2="328.0" class="s-rule" stroke-width="1"/>
<g data-tag="behaviour" data-state="share"><title>That the code's behaviour is checked by something that runs on every change, not taken on trust.</title><text x="370.0" y="107.0" font-size="12" text-anchor="end" class="t-fg">Behaviour · 3 conditions · 3 of 4 repositories</text><line x1="382.0" y1="103.0" x2="702.0" y2="103.0" class="s-muted" stroke-width="1.5"/><g data-mark="whisker" class="s-fg" stroke-width="2"><line x1="542.0" y1="103.0" x2="648.7" y2="103.0"/><line x1="542.0" y1="98.0" x2="542.0" y2="108.0"/><line x1="648.7" y1="98.0" x2="648.7" y2="108.0"/></g><circle cx="595.3" cy="103.0" r="6.0" class="f-accent s-bg" stroke-width="1.5" data-mark="dot"/><text x="718.0" y="107.0" font-size="11.5" text-anchor="start" class="t-fg">median 67%, middle half 50% to 83%</text></g>
<g data-tag="contracts" data-state="none"><title>That generated output and its source agree, so an agent editing one does not quietly break the other.</title><text x="370.0" y="137.0" font-size="12" text-anchor="end" class="t-fg">Contracts · 0 conditions · 0 of 4 repositories</text><line x1="382.0" y1="133.0" x2="702.0" y2="133.0" class="s-muted" stroke-width="1.5" stroke-dasharray="4 4" data-mark="dashed"/><text x="718.0" y="137.0" font-size="11.5" text-anchor="start" class="t-muted">not yet measured: no condition has this tag</text></g>
<g data-tag="docs" data-state="share"><title>That what an agent reads about the code is still true of the code.</title><text x="370.0" y="167.0" font-size="12" text-anchor="end" class="t-fg">Docs · 3 conditions · 1 of 4 repositories</text><line x1="382.0" y1="163.0" x2="702.0" y2="163.0" class="s-muted" stroke-width="1.5"/><circle cx="542.0" cy="163.0" r="6.0" class="f-accent s-bg" stroke-width="1.5" data-mark="dot"/><text x="718.0" y="167.0" font-size="11.5" text-anchor="start" class="t-fg">median 50%</text></g>
<g data-tag="structure" data-state="share"><title>That the code is shaped so an agent can work on one part without holding the whole repository in mind.</title><text x="370.0" y="197.0" font-size="12" text-anchor="end" class="t-fg">Structure · 6 conditions · 2 of 4 repositories</text><line x1="382.0" y1="193.0" x2="702.0" y2="193.0" class="s-muted" stroke-width="1.5"/><g data-mark="whisker" class="s-fg" stroke-width="2"><line x1="414.0" y1="193.0" x2="478.0" y2="193.0"/><line x1="414.0" y1="188.0" x2="414.0" y2="198.0"/><line x1="478.0" y1="188.0" x2="478.0" y2="198.0"/></g><circle cx="446.0" cy="193.0" r="6.0" class="f-accent s-bg" stroke-width="1.5" data-mark="dot"/><text x="718.0" y="197.0" font-size="11.5" text-anchor="start" class="t-fg">median 20%, middle half 10% to 30%</text></g>
<g data-tag="agent_context" data-state="share"><title>That an agent starts each task knowing how this repository works and how to check its own change.</title><text x="370.0" y="227.0" font-size="12" text-anchor="end" class="t-fg">Agent context · 6 conditions · 4 of 4 repositories</text><line x1="382.0" y1="223.0" x2="702.0" y2="223.0" class="s-muted" stroke-width="1.5"/><g data-mark="whisker" class="s-fg" stroke-width="2"><line x1="522.0" y1="223.0" x2="642.0" y2="223.0"/><line x1="522.0" y1="218.0" x2="522.0" y2="228.0"/><line x1="642.0" y1="218.0" x2="642.0" y2="228.0"/></g><circle cx="582.0" cy="223.0" r="6.0" class="f-accent s-bg" stroke-width="1.5" data-mark="dot"/><text x="718.0" y="227.0" font-size="11.5" text-anchor="start" class="t-fg">median 62%, middle half 44% to 81%</text></g>
<g data-tag="agent_runtime" data-state="listed"><title>That an agent can see the system it changes run, and confirm a change there, not only in the code.</title><text x="370.0" y="257.0" font-size="12" text-anchor="end" class="t-fg">Agent runtime · 4 conditions · 0 of 4 repositories</text><line x1="382.0" y1="253.0" x2="702.0" y2="253.0" class="s-muted" stroke-width="1.5" stroke-dasharray="4 4" data-mark="dashed"/><text x="718.0" y="257.0" font-size="11.5" text-anchor="start" class="t-muted">not counted: its conditions are listed, never counted</text></g>
<g data-tag="governance" data-state="not_measured"><title>That people stay in the loop on what agents change, and that what agents may do is agreed and visible.</title><text x="370.0" y="287.0" font-size="12" text-anchor="end" class="t-fg">Governance · 3 conditions · 0 of 4 repositories</text><line x1="382.0" y1="283.0" x2="702.0" y2="283.0" class="s-muted" stroke-width="1.5" stroke-dasharray="4 4" data-mark="dashed"/><text x="718.0" y="287.0" font-size="11.5" text-anchor="start" class="t-muted">not measured on any repository</text></g>
<g data-tag="supply_chain" data-state="listed"><title>That an agent builds and tests against the same dependency versions as CI and everyone else.</title><text x="370.0" y="317.0" font-size="12" text-anchor="end" class="t-fg">Supply chain · 1 condition · 0 of 4 repositories</text><line x1="382.0" y1="313.0" x2="702.0" y2="313.0" class="s-muted" stroke-width="1.5" stroke-dasharray="4 4" data-mark="dashed"/><text x="718.0" y="317.0" font-size="11.5" text-anchor="start" class="t-muted">not counted: its conditions are listed, never counted</text></g>
<circle cx="23.0" cy="349.0" r="6.0" class="f-accent s-bg" stroke-width="1.5"/>
<text x="38.0" y="353.0" font-size="12" text-anchor="start" class="t-fg">Median: the middle value of the repositories' shares of the tag's measured conditions met</text>
<line x1="16.0" y1="369.0" x2="30.0" y2="369.0" class="s-fg" stroke-width="2"/>
<text x="38.0" y="373.0" font-size="12" text-anchor="start" class="t-fg">Whisker: the middle half of the repositories, 25th to 75th percentile</text>
<line x1="16.0" y1="389.0" x2="30.0" y2="389.0" class="s-muted" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="38.0" y="393.0" font-size="12" text-anchor="start" class="t-fg">Not measured on any repository: no dot, never 0</text>
<text x="16.0" y="418.0" font-size="12" text-anchor="start" class="t-muted">Row label: the tag, its condition count and the repositories measured on it, of those scanned with a per-tag tally.</text>
<text x="16.0" y="436.0" font-size="12" text-anchor="start" class="t-fg">Each dot is the median share of a tag's measured conditions met across the repositories measured on it, and the whisker spans the middle half of them.</text>
<text x="16.0" y="454.0" font-size="12" text-anchor="start" class="t-fg">A dashed row was not measured on any repository, never read as zero.</text>
</svg>
