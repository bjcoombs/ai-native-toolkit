<title>Fleet maturity, before and after</title>
<desc>Slope chart: one line per group from its mean maturity in the earlier run to this one, up in the accent colour, down in the alarm colour; groups with no practice known in both runs are listed on a hatched strip, not drawn at zero.</desc>
