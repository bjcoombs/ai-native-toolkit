<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg class="fleet-slope" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 449" width="860" height="449" role="img">
<title>Fleet Steps, before and after</title>
<desc>Slope chart: one line per group from its lowest Step in the earlier run to this one, never an average, up in the accent colour, down in the alarm colour; groups with no measured repository on a side are listed on a hatched strip, not drawn at Step 0.</desc>
<style>svg.fleet-slope text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }svg.fleet-slope .t-bg,svg.fleet-slope .f-bg {fill:#ffffff}svg.fleet-slope .s-bg {stroke:#ffffff}svg.fleet-slope .t-fg,svg.fleet-slope .f-fg {fill:#1d2321}svg.fleet-slope .s-fg {stroke:#1d2321}svg.fleet-slope .t-muted,svg.fleet-slope .f-muted {fill:#5d6763}svg.fleet-slope .s-muted {stroke:#5d6763}svg.fleet-slope .t-rule,svg.fleet-slope .f-rule {fill:#d9dedb}svg.fleet-slope .s-rule {stroke:#d9dedb}svg.fleet-slope .t-accent,svg.fleet-slope .f-accent {fill:#1f6f6b}svg.fleet-slope .s-accent {stroke:#1f6f6b}svg.fleet-slope .t-bad,svg.fleet-slope .f-bad {fill:#b33a2e}svg.fleet-slope .s-bad {stroke:#b33a2e}svg.fleet-slope .t-warn,svg.fleet-slope .f-warn {fill:#b7791f}svg.fleet-slope .s-warn {stroke:#b7791f}svg.fleet-slope .t-unk,svg.fleet-slope .f-unk {fill:#9aa39f}svg.fleet-slope .s-unk {stroke:#9aa39f}@media (prefers-color-scheme: dark){svg.fleet-slope .t-bg,svg.fleet-slope .f-bg {fill:#1a201e}svg.fleet-slope .s-bg {stroke:#1a201e}svg.fleet-slope .t-fg,svg.fleet-slope .f-fg {fill:#e6ebe8}svg.fleet-slope .s-fg {stroke:#e6ebe8}svg.fleet-slope .t-muted,svg.fleet-slope .f-muted {fill:#9aa5a0}svg.fleet-slope .s-muted {stroke:#9aa5a0}svg.fleet-slope .t-rule,svg.fleet-slope .f-rule {fill:#2c3532}svg.fleet-slope .s-rule {stroke:#2c3532}svg.fleet-slope .t-accent,svg.fleet-slope .f-accent {fill:#5fb8b1}svg.fleet-slope .s-accent {stroke:#5fb8b1}svg.fleet-slope .t-bad,svg.fleet-slope .f-bad {fill:#ec7a6c}svg.fleet-slope .s-bad {stroke:#ec7a6c}svg.fleet-slope .t-warn,svg.fleet-slope .f-warn {fill:#e0a84a}svg.fleet-slope .s-warn {stroke:#e0a84a}svg.fleet-slope .t-unk,svg.fleet-slope .f-unk {fill:#5f6a66}svg.fleet-slope .s-unk {stroke:#5f6a66}}</style>
<defs><pattern id="fleet-slope-fleet-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="f-bg"/><line x1="0" y1="0" x2="0" y2="6" class="s-unk" stroke-width="2.4"/></pattern></defs>
<rect x="0" y="0" width="860" height="449" class="f-bg"/>
<text x="16.0" y="34.0" font-size="18" text-anchor="start" class="t-fg" font-weight="bold">Fleet Steps, before and after</text>
<text x="16.0" y="56.0" font-size="12" text-anchor="start" class="t-muted">5 groups · lowest Step in 2026-10-20 and 2026-11-20, with how many repositories were measured</text>
<text x="16.0" y="74.0" font-size="11.5" text-anchor="start" class="t-muted">Each group's lowest Step over its measured repositories, never an average; a repository with no Step counts as not measured</text>
<line x1="250.0" y1="352.0" x2="460.0" y2="352.0" class="s-rule" stroke-width="0.6" data-tick="1"><title>Step 1</title></line>
<line x1="250.0" y1="232.0" x2="460.0" y2="232.0" class="s-rule" stroke-width="0.6" data-tick="2"><title>Step 2</title></line>
<line x1="250.0" y1="112.0" x2="460.0" y2="112.0" class="s-rule" stroke-width="0.6" data-tick="3"><title>Step 3</title></line>
<line x1="250.0" y1="104.0" x2="250.0" y2="352.0" class="s-muted" stroke-width="1"/>
<text x="250.0" y="96.0" font-size="11.5" text-anchor="middle" class="t-muted">2026-10-20</text>
<line x1="460.0" y1="104.0" x2="460.0" y2="352.0" class="s-muted" stroke-width="1"/>
<text x="460.0" y="96.0" font-size="11.5" text-anchor="middle" class="t-muted">2026-11-20</text>
<line x1="250.0" y1="352.0" x2="460.0" y2="352.0" class="s-muted" stroke-width="2.4" data-group="data" data-then="1" data-now="1" data-change="+0" data-measured-then="3" data-repos-then="3" data-measured-now="3" data-repos-now="3"><title>data: Step 1 → Step 1 (+0); 3 of 3 measured then, 3 of 3 measured now</title></line>
<circle cx="250.0" cy="352.0" r="4" class="f-muted"/>
<circle cx="460.0" cy="352.0" r="4" class="f-muted"/>
<text x="238.0" y="356.0" font-size="12.5" text-anchor="end" class="t-fg" data-label="data">data Step 1<title>data</title></text>
<text x="472.0" y="356.0" font-size="12.5" text-anchor="start" class="t-fg" font-weight="600">Step 1</text>
<text x="530.0" y="356.0" font-size="11.5" text-anchor="start" class="t-muted">=</text>
<text x="556.0" y="356.0" font-size="11.5" text-anchor="start" class="t-muted">3 of 3 → 3 of 3 measured</text>
<line x1="250.0" y1="352.0" x2="460.0" y2="232.0" class="s-accent" stroke-width="2.4" data-group="payments" data-then="1" data-now="2" data-change="+1" data-measured-then="3" data-repos-then="3" data-measured-now="3" data-repos-now="3"><title>payments: Step 1 → Step 2 (+1); 3 of 3 measured then, 3 of 3 measured now</title></line>
<circle cx="250.0" cy="352.0" r="4" class="f-accent"/>
<circle cx="460.0" cy="232.0" r="4" class="f-accent"/>
<text x="238.0" y="373.0" font-size="12.5" text-anchor="end" class="t-fg" data-label="payments">payments Step 1<title>payments</title></text>
<text x="472.0" y="236.0" font-size="12.5" text-anchor="start" class="t-fg" font-weight="600">Step 2</text>
<text x="530.0" y="236.0" font-size="11.5" text-anchor="start" class="t-accent">+1</text>
<text x="556.0" y="236.0" font-size="11.5" text-anchor="start" class="t-muted">3 of 3 → 3 of 3 measured</text>
<line x1="250.0" y1="112.0" x2="460.0" y2="112.0" class="s-muted" stroke-width="2.4" data-group="platform" data-then="3" data-now="3" data-change="+0" data-measured-then="3" data-repos-then="3" data-measured-now="3" data-repos-now="3"><title>platform: Step 3 → Step 3 (+0); 3 of 3 measured then, 3 of 3 measured now</title></line>
<circle cx="250.0" cy="112.0" r="4" class="f-muted"/>
<circle cx="460.0" cy="112.0" r="4" class="f-muted"/>
<text x="238.0" y="116.0" font-size="12.5" text-anchor="end" class="t-fg" data-label="platform">platform Step 3<title>platform</title></text>
<text x="472.0" y="116.0" font-size="12.5" text-anchor="start" class="t-fg" font-weight="600">Step 3</text>
<text x="530.0" y="116.0" font-size="11.5" text-anchor="start" class="t-muted">=</text>
<text x="556.0" y="116.0" font-size="11.5" text-anchor="start" class="t-muted">3 of 3 → 3 of 3 measured</text>
<line x1="250.0" y1="232.0" x2="460.0" y2="352.0" class="s-bad" stroke-width="2.4" data-group="web" data-then="2" data-now="1" data-change="-1" data-measured-then="2" data-repos-then="2" data-measured-now="3" data-repos-now="3"><title>web: Step 2 → Step 1 (-1); 2 of 2 measured then, 3 of 3 measured now</title></line>
<circle cx="250.0" cy="232.0" r="4" class="f-bad"/>
<circle cx="460.0" cy="352.0" r="4" class="f-bad"/>
<text x="238.0" y="236.0" font-size="12.5" text-anchor="end" class="t-fg" data-label="web">web Step 2<title>web</title></text>
<text x="472.0" y="373.0" font-size="12.5" text-anchor="start" class="t-fg" font-weight="600">Step 1</text>
<text x="530.0" y="373.0" font-size="11.5" text-anchor="start" class="t-bad">-1</text>
<text x="556.0" y="373.0" font-size="11.5" text-anchor="start" class="t-muted">2 of 2 → 3 of 3 measured *</text>
<text x="16.0" y="397.0" font-size="11.5" text-anchor="start" class="t-muted">* the group's repositories or how many were measured moved too, so the Step may have moved with the set</text>
<rect x="16.0" y="406.0" width="14.0" height="14.0" fill="url(#fleet-slope-fleet-hatch)" class="s-muted" stroke-width="1"/>
<text x="38.0" y="417.0" font-size="11.5" text-anchor="start" class="t-fg">Not plotted, unknown is not Step 0: mobile (new since the earlier run)</text>
</svg>
