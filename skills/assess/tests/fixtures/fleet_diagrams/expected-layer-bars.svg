<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img">
<title>Fleet maturity by layer</title>
<desc>Stacked horizontal bars, one per team row of the maturity model: how many fleet repositories reach each level, pale to dark; repositories with an undetermined level are a hatched segment, not counted as level 0.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }.t-bg,.f-bg{fill:#ffffff}.s-bg{stroke:#ffffff}.t-fg,.f-fg{fill:#1d2321}.s-fg{stroke:#1d2321}.t-muted,.f-muted{fill:#5d6763}.s-muted{stroke:#5d6763}.t-rule,.f-rule{fill:#d9dedb}.s-rule{stroke:#d9dedb}.t-accent,.f-accent{fill:#1f6f6b}.s-accent{stroke:#1f6f6b}.t-bad,.f-bad{fill:#b33a2e}.s-bad{stroke:#b33a2e}.t-warn,.f-warn{fill:#b7791f}.s-warn{stroke:#b7791f}.t-unk,.f-unk{fill:#9aa39f}.s-unk{stroke:#9aa39f}@media (prefers-color-scheme: dark){.t-bg,.f-bg{fill:#1a201e}.s-bg{stroke:#1a201e}.t-fg,.f-fg{fill:#e6ebe8}.s-fg{stroke:#e6ebe8}.t-muted,.f-muted{fill:#9aa5a0}.s-muted{stroke:#9aa5a0}.t-rule,.f-rule{fill:#2c3532}.s-rule{stroke:#2c3532}.t-accent,.f-accent{fill:#5fb8b1}.s-accent{stroke:#5fb8b1}.t-bad,.f-bad{fill:#ec7a6c}.s-bad{stroke:#ec7a6c}.t-warn,.f-warn{fill:#e0a84a}.s-warn{stroke:#e0a84a}.t-unk,.f-unk{fill:#5f6a66}.s-unk{stroke:#5f6a66}}</style>
<defs><pattern id="fleet-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="f-bg"/><line x1="0" y1="0" x2="0" y2="6" class="s-unk" stroke-width="2.4"/></pattern></defs>
<rect x="0" y="0" width="760" height="340" class="f-bg"/>
<text x="16.0" y="34.0" font-size="18" text-anchor="start" class="t-fg" font-weight="bold">Fleet maturity by layer</text>
<text x="16.0" y="56.0" font-size="12" text-anchor="start" class="t-muted">15 repositories · one bar per team row of the maturity model, split by the level each repository reaches</text>
<text x="16.0" y="74.0" font-size="11.5" text-anchor="start" class="t-muted">A wide pale or hatched band is where the whole fleet is behind</text>
<line x1="161.2" y1="84.0" x2="161.2" y2="160.0" class="s-rule" stroke-width="0.6"/>
<text x="161.2" y="176.0" font-size="11" text-anchor="middle" class="t-muted">0</text>
<line x1="340.8" y1="84.0" x2="340.8" y2="160.0" class="s-rule" stroke-width="0.6"/>
<text x="340.8" y="176.0" font-size="11" text-anchor="middle" class="t-muted">5</text>
<line x1="520.4" y1="84.0" x2="520.4" y2="160.0" class="s-rule" stroke-width="0.6"/>
<text x="520.4" y="176.0" font-size="11" text-anchor="middle" class="t-muted">10</text>
<line x1="700.0" y1="84.0" x2="700.0" y2="160.0" class="s-rule" stroke-width="0.6"/>
<text x="700.0" y="176.0" font-size="11" text-anchor="middle" class="t-muted">15</text>
<text x="151.2" y="107.0" font-size="12.5" text-anchor="end" class="t-fg">Agent instructions<title>Agent instructions (instructions)</title></text>
<rect x="161.2" y="90.0" width="71.8" height="26.0" fill="#fff7ec" class="s-bg" stroke-width="1"><title>Agent instructions: 2 at level 0 of 2</title></rect>
<text x="197.2" y="107.0" font-size="11" fill="#1a1a1a" text-anchor="middle">2</text>
<rect x="233.1" y="90.0" width="179.6" height="26.0" fill="#fc8d59" class="s-bg" stroke-width="1"><title>Agent instructions: 5 at level 1 of 2</title></rect>
<text x="322.9" y="107.0" font-size="11" fill="#1a1a1a" text-anchor="middle">5</text>
<rect x="412.7" y="90.0" width="215.5" height="26.0" fill="#7f0000" class="s-bg" stroke-width="1"><title>Agent instructions: 6 at level 2 of 2</title></rect>
<text x="520.4" y="107.0" font-size="11" fill="#ffffff" text-anchor="middle">6</text>
<rect x="628.2" y="90.0" width="71.8" height="26.0" fill="url(#fleet-hatch)" class="s-bg" stroke-width="1"><title>Agent instructions: level unknown for data/notebooks, mobile/android</title></rect>
<text x="664.1" y="107.0" font-size="11" text-anchor="middle" class="t-fg" font-weight="600">2</text>
<text x="151.2" y="145.0" font-size="12.5" text-anchor="end" class="t-fg">Agent use<title>Agent use (agent-use)</title></text>
<rect x="161.2" y="128.0" width="107.8" height="26.0" fill="#fff7ec" class="s-bg" stroke-width="1"><title>Agent use: 3 at level 0 of 3</title></rect>
<text x="215.1" y="145.0" font-size="11" fill="#1a1a1a" text-anchor="middle">3</text>
<rect x="269.0" y="128.0" width="143.7" height="26.0" fill="#fdbb84" class="s-bg" stroke-width="1"><title>Agent use: 4 at level 1 of 3</title></rect>
<text x="340.8" y="145.0" font-size="11" fill="#1a1a1a" text-anchor="middle">4</text>
<rect x="412.7" y="128.0" width="107.8" height="26.0" fill="#ef6548" class="s-bg" stroke-width="1"><title>Agent use: 3 at level 2 of 3</title></rect>
<text x="466.5" y="145.0" font-size="11" fill="#1a1a1a" text-anchor="middle">3</text>
<rect x="520.4" y="128.0" width="107.8" height="26.0" fill="#7f0000" class="s-bg" stroke-width="1"><title>Agent use: 3 at level 3 of 3</title></rect>
<text x="574.3" y="145.0" font-size="11" fill="#ffffff" text-anchor="middle">3</text>
<rect x="628.2" y="128.0" width="71.8" height="26.0" fill="url(#fleet-hatch)" class="s-bg" stroke-width="1"><title>Agent use: level unknown for mobile/android, mobile/watch</title></rect>
<text x="664.1" y="145.0" font-size="11" text-anchor="middle" class="t-fg" font-weight="600">2</text>
<text x="430.6" y="194.0" font-size="12" text-anchor="middle" class="t-muted">Repositories</text>
<text x="161.2" y="218.0" font-size="11.5" text-anchor="start" class="t-muted">Rows with top level 2:</text>
<rect x="318.8" y="207.0" width="14.0" height="14.0" fill="#fff7ec" class="s-muted" stroke-width="0.6"/>
