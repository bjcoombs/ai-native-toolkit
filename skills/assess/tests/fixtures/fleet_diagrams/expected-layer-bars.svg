<rect x="401.8" y="207.0" width="14.0" height="14.0" fill="#fc8d59" class="s-muted" stroke-width="0.6"/>
<text x="421.8" y="218.0" font-size="11.5" text-anchor="start" class="t-fg">Level 1</text>
<rect x="484.8" y="207.0" width="14.0" height="14.0" fill="#7f0000" class="s-muted" stroke-width="0.6"/>
<text x="504.8" y="218.0" font-size="11.5" text-anchor="start" class="t-fg">Level 2 (top)</text>
<text x="161.2" y="236.0" font-size="11.5" text-anchor="start" class="t-muted">Rows with top level 3:</text>
<rect x="318.8" y="225.0" width="14.0" height="14.0" fill="#fff7ec" class="s-muted" stroke-width="0.6"/>
<text x="338.8" y="236.0" font-size="11.5" text-anchor="start" class="t-fg">Level 0</text>
<rect x="401.8" y="225.0" width="14.0" height="14.0" fill="#fdbb84" class="s-muted" stroke-width="0.6"/>
<text x="421.8" y="236.0" font-size="11.5" text-anchor="start" class="t-fg">Level 1</text>
<rect x="484.8" y="225.0" width="14.0" height="14.0" fill="#ef6548" class="s-muted" stroke-width="0.6"/>
<text x="504.8" y="236.0" font-size="11.5" text-anchor="start" class="t-fg">Level 2</text>
<rect x="567.7" y="225.0" width="14.0" height="14.0" fill="#7f0000" class="s-muted" stroke-width="0.6"/>
<text x="587.7" y="236.0" font-size="11.5" text-anchor="start" class="t-fg">Level 3 (top)</text>
<rect x="161.2" y="243.0" width="14.0" height="14.0" fill="url(#fleet-hatch)" class="s-muted" stroke-width="0.6"/>
<text x="181.2" y="254.0" font-size="11.5" text-anchor="start" class="t-fg">Unknown: level undetermined, never counted as 0</text>
<text x="161.2" y="276.0" font-size="11.5" text-anchor="start" class="t-muted">Level unknown for Agent instructions: data/notebooks, mobile/android.</text>
<text x="161.2" y="292.0" font-size="11.5" text-anchor="start" class="t-muted">Level unknown for Agent use: mobile/android, mobile/watch.</text>
<text x="161.2" y="308.0" font-size="11.5" text-anchor="start" class="t-muted">Not drawn: org rows read group settings, not repositories: Two-factor.</text>
</svg>
