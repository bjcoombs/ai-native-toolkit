<title>Docs behind their code</title>
<desc>In place: 18 docs map to code of their own, and 10 of them keep pace with that code. The longest bars are the docs whose code has moved most since the doc last changed, so they are the first to read again before an agent leans on them. 2 docs measured against the whole repository are counted here, not drawn.</desc>
