<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg class="assess-review-strip" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 304" width="680" height="304" role="img">
<title>Review on recent merges</title>
<desc>In place: 3 of 10 sampled merged changes approved and 2 more reviewed, and 1 not known. Each tick is one merged change, oldest first, so a run of ticks merged without review shows a stretch that a single share hides; a dot marks review-bot output.</desc>
<style>svg.assess-review-strip text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }svg.assess-review-strip .t-bg,svg.assess-review-strip .f-bg {fill:#ffffff}svg.assess-review-strip .s-bg {stroke:#ffffff}svg.assess-review-strip .t-fg,svg.assess-review-strip .f-fg {fill:#1d2321}svg.assess-review-strip .s-fg {stroke:#1d2321}svg.assess-review-strip .t-muted,svg.assess-review-strip .f-muted {fill:#5d6763}svg.assess-review-strip .s-muted {stroke:#5d6763}svg.assess-review-strip .t-rule,svg.assess-review-strip .f-rule {fill:#d9dedb}svg.assess-review-strip .s-rule {stroke:#d9dedb}svg.assess-review-strip .t-accent,svg.assess-review-strip .f-accent {fill:#1f6f6b}svg.assess-review-strip .s-accent {stroke:#1f6f6b}svg.assess-review-strip .t-bad,svg.assess-review-strip .f-bad {fill:#b33a2e}svg.assess-review-strip .s-bad {stroke:#b33a2e}svg.assess-review-strip .t-warn,svg.assess-review-strip .f-warn {fill:#b7791f}svg.assess-review-strip .s-warn {stroke:#b7791f}svg.assess-review-strip .t-unk,svg.assess-review-strip .f-unk {fill:#9aa39f}svg.assess-review-strip .s-unk {stroke:#9aa39f}svg.assess-review-strip .t-dr-behind,svg.assess-review-strip .f-dr-behind {fill:#d08a1e}svg.assess-review-strip .s-dr-behind {stroke:#d08a1e}svg.assess-review-strip .t-dr-current,svg.assess-review-strip .f-dr-current {fill:#8fc7c0}svg.assess-review-strip .s-dr-current {stroke:#8fc7c0}svg.assess-review-strip .t-rv-approved,svg.assess-review-strip .f-rv-approved {fill:#00635d}svg.assess-review-strip .s-rv-approved {stroke:#00635d}svg.assess-review-strip .t-rv-reviewed,svg.assess-review-strip .f-rv-reviewed {fill:#8fc7c0}svg.assess-review-strip .s-rv-reviewed {stroke:#8fc7c0}svg.assess-review-strip .t-rv-unreviewed,svg.assess-review-strip .f-rv-unreviewed {fill:#f1d9a6}svg.assess-review-strip .s-rv-unreviewed {stroke:#f1d9a6}@media (prefers-color-scheme: dark){svg.assess-review-strip .t-bg,svg.assess-review-strip .f-bg {fill:#1a201e}svg.assess-review-strip .s-bg {stroke:#1a201e}svg.assess-review-strip .t-fg,svg.assess-review-strip .f-fg {fill:#e6ebe8}svg.assess-review-strip .s-fg {stroke:#e6ebe8}svg.assess-review-strip .t-muted,svg.assess-review-strip .f-muted {fill:#9aa5a0}svg.assess-review-strip .s-muted {stroke:#9aa5a0}svg.assess-review-strip .t-rule,svg.assess-review-strip .f-rule {fill:#2c3532}svg.assess-review-strip .s-rule {stroke:#2c3532}svg.assess-review-strip .t-accent,svg.assess-review-strip .f-accent {fill:#5fb8b1}svg.assess-review-strip .s-accent {stroke:#5fb8b1}svg.assess-review-strip .t-bad,svg.assess-review-strip .f-bad {fill:#ec7a6c}svg.assess-review-strip .s-bad {stroke:#ec7a6c}svg.assess-review-strip .t-warn,svg.assess-review-strip .f-warn {fill:#e0a84a}svg.assess-review-strip .s-warn {stroke:#e0a84a}svg.assess-review-strip .t-unk,svg.assess-review-strip .f-unk {fill:#5f6a66}svg.assess-review-strip .s-unk {stroke:#5f6a66}svg.assess-review-strip .t-dr-behind,svg.assess-review-strip .f-dr-behind {fill:#e0a84a}svg.assess-review-strip .s-dr-behind {stroke:#e0a84a}svg.assess-review-strip .t-dr-current,svg.assess-review-strip .f-dr-current {fill:#2e7d76}svg.assess-review-strip .s-dr-current {stroke:#2e7d76}svg.assess-review-strip .t-rv-approved,svg.assess-review-strip .f-rv-approved {fill:#4fc1b5}svg.assess-review-strip .s-rv-approved {stroke:#4fc1b5}svg.assess-review-strip .t-rv-reviewed,svg.assess-review-strip .f-rv-reviewed {fill:#2e7d76}svg.assess-review-strip .s-rv-reviewed {stroke:#2e7d76}svg.assess-review-strip .t-rv-unreviewed,svg.assess-review-strip .f-rv-unreviewed {fill:#7a5a1c}svg.assess-review-strip .s-rv-unreviewed {stroke:#7a5a1c}}</style>
<defs><pattern id="assess-review-strip-fleet-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="f-bg"/><line x1="0" y1="0" x2="0" y2="6" class="s-unk" stroke-width="2.4"/></pattern></defs>
<rect x="0" y="0" width="680" height="304" class="f-bg"/>
<text x="16.0" y="28.0" font-size="15" text-anchor="start" class="t-fg" font-weight="600">Review on recent merges</text>
<text x="16.0" y="48.0" font-size="12" text-anchor="start" class="t-muted">10 sampled merged changes, one tick each, in merge order</text>
<rect x="16.0" y="70.0" width="16.0" height="32.0" rx="2" class="f-rv-approved s-muted" stroke-width="1" data-state="approved"><title>Approved by someone other than the author</title></rect>
<rect x="36.0" y="70.0" width="16.0" height="32.0" rx="2" class="f-rv-reviewed s-muted" stroke-width="1" data-state="reviewed"><title>Reviewed, not approved, with review-bot output</title></rect>
<circle cx="44.0" cy="63.0" r="3.5" class="f-fg" data-bot="true"/>
<rect x="56.0" y="70.0" width="16.0" height="32.0" rx="2" class="f-rv-unreviewed s-muted" stroke-width="1" data-state="unreviewed"><title>Merged without review, with review-bot output</title></rect>
<circle cx="64.0" cy="63.0" r="3.5" class="f-fg" data-bot="true"/>
<rect x="76.0" y="70.0" width="16.0" height="32.0" rx="2" class="f-rv-unreviewed s-muted" stroke-width="1" data-state="unreviewed"><title>Merged without review</title></rect>
<rect x="96.0" y="70.0" width="16.0" height="32.0" rx="2" class="f-rv-unreviewed s-muted" stroke-width="1" data-state="unreviewed"><title>Merged without review</title></rect>
<rect x="116.0" y="70.0" width="16.0" height="32.0" rx="2" fill="url(#assess-review-strip-fleet-hatch)" class="s-muted" stroke-width="1" data-state="unknown"><title>Not known: the platform left it undecided, review-bot output not known</title></rect>
<circle cx="124.0" cy="63.0" r="3.5" class="f-bg s-fg" stroke-width="1.2" data-bot="unknown"/>
<rect x="136.0" y="70.0" width="16.0" height="32.0" rx="2" class="f-rv-reviewed s-muted" stroke-width="1" data-state="reviewed"><title>Reviewed, not approved</title></rect>
<rect x="156.0" y="70.0" width="16.0" height="32.0" rx="2" class="f-rv-approved s-muted" stroke-width="1" data-state="approved"><title>Approved by someone other than the author, with review-bot output</title></rect>
<circle cx="164.0" cy="63.0" r="3.5" class="f-fg" data-bot="true"/>
<rect x="176.0" y="70.0" width="16.0" height="32.0" rx="2" class="f-rv-unreviewed s-muted" stroke-width="1" data-state="unreviewed"><title>Merged without review</title></rect>
<rect x="196.0" y="70.0" width="16.0" height="32.0" rx="2" class="f-rv-approved s-muted" stroke-width="1" data-state="approved"><title>Approved by someone other than the author</title></rect>
<text x="16.0" y="118.0" font-size="11" text-anchor="start" class="t-muted">oldest</text>
<text x="212.0" y="118.0" font-size="11" text-anchor="end" class="t-muted">newest</text>
<rect x="16.0" y="134.0" width="14.0" height="14.0" rx="2" class="f-rv-approved s-muted" stroke-width="1"/>
<text x="38.0" y="145.0" font-size="12" text-anchor="start" class="t-fg">Approved by someone other than the author (3)</text>
<rect x="16.0" y="154.0" width="14.0" height="14.0" rx="2" class="f-rv-reviewed s-muted" stroke-width="1"/>
<text x="38.0" y="165.0" font-size="12" text-anchor="start" class="t-fg">Reviewed, not approved (2)</text>
<rect x="16.0" y="174.0" width="14.0" height="14.0" rx="2" class="f-rv-unreviewed s-muted" stroke-width="1"/>
<text x="38.0" y="185.0" font-size="12" text-anchor="start" class="t-fg">Merged without review (4)</text>
<rect x="16.0" y="194.0" width="14.0" height="14.0" rx="2" fill="url(#assess-review-strip-fleet-hatch)" class="s-muted" stroke-width="1"/>
<text x="38.0" y="205.0" font-size="12" text-anchor="start" class="t-fg">Not known: the platform left it undecided (1)</text>
<circle cx="23.0" cy="221.0" r="3.5" class="f-fg"/>
<text x="38.0" y="225.0" font-size="12" text-anchor="start" class="t-fg">Review-bot output (3 known)</text>
<circle cx="23.0" cy="241.0" r="3.5" class="f-bg s-fg" stroke-width="1.2"/>
<text x="38.0" y="245.0" font-size="12" text-anchor="start" class="t-fg">Not known whether a review bot commented (1)</text>
<text x="16.0" y="270.0" font-size="12" text-anchor="start" class="t-fg">Each tick is one merged change, oldest first, so a run of ticks merged without review shows</text>
<text x="16.0" y="288.0" font-size="12" text-anchor="start" class="t-fg">a stretch that a single share hides; a dot marks review-bot output.</text>
</svg>
