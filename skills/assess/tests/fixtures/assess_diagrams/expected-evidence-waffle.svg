<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg class="assess-evidence-waffle" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 438" width="680" height="438" role="img">
<title>Evidence behind the Step</title>
<desc>In place: 3 counted conditions met (2 verified, 1 measured) and 3 listed from config or a declaration. Verified and measured squares count toward catalogue coverage, listed ones are shown but never counted, and hatched ones were not measured, never read as zero.</desc>
