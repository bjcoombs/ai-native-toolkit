<rect x="16.0" y="212.0" width="14.0" height="14.0" rx="2" class="f-ev-measured s-rule" stroke-width="1"></rect>
<text x="38.0" y="223.0" font-size="12" text-anchor="start" class="t-fg">Met, measured from the code or its history (1)</text>
<rect x="16.0" y="232.0" width="14.0" height="14.0" rx="2" class="f-ev-listed s-rule" stroke-width="1"></rect>
