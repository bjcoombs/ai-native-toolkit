<rect x="277.0" y="103.0" width="22.0" height="22.0" rx="3" fill="none" class="s-fg" stroke-width="2" data-gate="layer-5-ci.1"/>
<rect x="334.9" y="106.0" width="16.0" height="16.0" rx="2" class="f-ev-listed s-rule" stroke-width="1" data-category="listed"><title>CI and the agent's local check level 2: Met, listed from config or a declaration, not counted</title></rect>
<rect x="389.8" y="106.0" width="16.0" height="16.0" rx="2" fill="url(#fleet-hatch)" class="s-muted" stroke-width="1" data-category="not_measured"><title>CI and the agent's local check level 3: Not measured (needs GitHub or GitLab access)</title></rect>
<rect x="444.8" y="106.0" width="16.0" height="16.0" rx="2" fill="url(#fleet-hatch)" class="s-muted" stroke-width="1" data-category="not_measured"><title>CI and the agent's local check level 4: Not measured (waits on CI and the agent's local check level 3)</title></rect>
<text x="268.0" y="143.0" font-size="12" text-anchor="end" class="t-fg">Guardrails stated in the instructio…<title>Guardrails stated in the instruction files &amp; &lt;docs&gt; beside them</title></text>
<rect x="280.0" y="130.0" width="16.0" height="16.0" rx="2" class="f-ev-declined s-rule" stroke-width="1" data-category="declined"><title>Guardrails stated in the instruction files &amp; &lt;docs&gt; beside them level 1: Declined</title></rect>
<rect x="334.9" y="130.0" width="16.0" height="16.0" rx="2" class="f-bg s-muted" stroke-width="1.5" data-category="not_applicable"><title>Guardrails stated in the instruction files &amp; &lt;docs&gt; beside them level 2: Not applicable</title></rect>
<rect x="389.8" y="130.0" width="16.0" height="16.0" rx="2" class="f-ev-listed s-rule" stroke-width="1" data-category="listed"><title>Guardrails stated in the instruction files &amp; &lt;docs&gt; beside them level 3: Met, listed from config or a declaration, not counted</title></rect>
<text x="268.0" y="167.0" font-size="12" text-anchor="end" class="t-fg">Review on merged changes</text>
<rect x="280.0" y="154.0" width="16.0" height="16.0" rx="2" fill="url(#fleet-hatch)" class="s-muted" stroke-width="1" data-category="not_measured"><title>Review on merged changes level 1: Not measured (needs GitHub or GitLab access)</title></rect>
<rect x="334.9" y="154.0" width="16.0" height="16.0" rx="2" class="f-ev-verified s-rule" stroke-width="1" data-category="verified"><title>Review on merged changes level 2: Met, verified by a run or the platform</title></rect>
