<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 859 490" width="859" height="490" role="img">
<title>Practices in place by truth tag</title>
<desc>In place: 3 of the 8 truth tags have a measured condition, each shown with the share of its measured conditions met. Hollow dots: the earlier run, under the same maturity model fixture-2. Each dot is the share of that tag&#x27;s measured conditions that are met. A condition with several tags counts on each of its rows and once in the tally, and a dashed row was not measured, never read as zero.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }.t-bg,.f-bg{fill:#ffffff}.s-bg{stroke:#ffffff}.t-fg,.f-fg{fill:#1d2321}.s-fg{stroke:#1d2321}.t-muted,.f-muted{fill:#5d6763}.s-muted{stroke:#5d6763}.t-rule,.f-rule{fill:#d9dedb}.s-rule{stroke:#d9dedb}.t-accent,.f-accent{fill:#1f6f6b}.s-accent{stroke:#1f6f6b}.t-bad,.f-bad{fill:#b33a2e}.s-bad{stroke:#b33a2e}.t-warn,.f-warn{fill:#b7791f}.s-warn{stroke:#b7791f}.t-unk,.f-unk{fill:#9aa39f}.s-unk{stroke:#9aa39f}@media (prefers-color-scheme: dark){.t-bg,.f-bg{fill:#1a201e}.s-bg{stroke:#1a201e}.t-fg,.f-fg{fill:#e6ebe8}.s-fg{stroke:#e6ebe8}.t-muted,.f-muted{fill:#9aa5a0}.s-muted{stroke:#9aa5a0}.t-rule,.f-rule{fill:#2c3532}.s-rule{stroke:#2c3532}.t-accent,.f-accent{fill:#5fb8b1}.s-accent{stroke:#5fb8b1}.t-bad,.f-bad{fill:#ec7a6c}.s-bad{stroke:#ec7a6c}.t-warn,.f-warn{fill:#e0a84a}.s-warn{stroke:#e0a84a}.t-unk,.f-unk{fill:#5f6a66}.s-unk{stroke:#5f6a66}}</style>
<defs></defs>
<rect x="0" y="0" width="859" height="490" class="f-bg"/>
<text x="16.0" y="28.0" font-size="15" text-anchor="start" class="t-fg" font-weight="600">Practices in place by truth tag</text>
<text x="16.0" y="48.0" font-size="12" text-anchor="start" class="t-muted">Share of each tag's measured conditions that are met, one row per truth tag</text>
<text x="151.0" y="76.0" font-size="11" text-anchor="middle" class="t-muted">0%</text>
<text x="231.0" y="76.0" font-size="11" text-anchor="middle" class="t-muted">25%</text>
<text x="311.0" y="76.0" font-size="11" text-anchor="middle" class="t-muted">50%</text>
<text x="391.0" y="76.0" font-size="11" text-anchor="middle" class="t-muted">75%</text>
<text x="471.0" y="76.0" font-size="11" text-anchor="middle" class="t-muted">100%</text>
<line x1="151.0" y1="88.0" x2="151.0" y2="328.0" class="s-rule" stroke-width="1"/>
<line x1="231.0" y1="88.0" x2="231.0" y2="328.0" class="s-rule" stroke-width="1"/>
<line x1="311.0" y1="88.0" x2="311.0" y2="328.0" class="s-rule" stroke-width="1"/>
<line x1="391.0" y1="88.0" x2="391.0" y2="328.0" class="s-rule" stroke-width="1"/>
<line x1="471.0" y1="88.0" x2="471.0" y2="328.0" class="s-rule" stroke-width="1"/>
<g data-tag="behaviour" data-state="share"><title>That the code's behaviour is checked by something that runs on every change, not taken on trust.</title><text x="139.0" y="107.0" font-size="12" text-anchor="end" class="t-fg">Behaviour · 3</text><line x1="151.0" y1="103.0" x2="471.0" y2="103.0" class="s-muted" stroke-width="1.5"/><circle cx="257.7" cy="103.0" r="8.0" fill="none" class="s-fg" stroke-width="1.5" data-mark="prior"/><circle cx="364.3" cy="103.0" r="6.0" class="f-accent s-bg" stroke-width="1.5" data-mark="dot"/><text x="487.0" y="107.0" font-size="11.5" text-anchor="start" class="t-fg">2 of 3 met</text></g>
<g data-tag="contracts" data-state="none"><title>That generated output and its source agree, so an agent editing one does not quietly break the other.</title><text x="139.0" y="137.0" font-size="12" text-anchor="end" class="t-fg">Contracts · 0</text><line x1="151.0" y1="133.0" x2="471.0" y2="133.0" class="s-muted" stroke-width="1.5" stroke-dasharray="4 4" data-mark="dashed"/><text x="487.0" y="137.0" font-size="11.5" text-anchor="start" class="t-muted">not yet measured: no condition has this tag</text></g>
<g data-tag="docs" data-state="not_measured"><title>That what an agent reads about the code is still true of the code.</title><text x="139.0" y="167.0" font-size="12" text-anchor="end" class="t-fg">Docs · 3</text><line x1="151.0" y1="163.0" x2="471.0" y2="163.0" class="s-muted" stroke-width="1.5" stroke-dasharray="4 4" data-mark="dashed"/><circle cx="311.0" cy="163.0" r="8.0" fill="none" class="s-fg" stroke-width="1.5" data-mark="prior"/><text x="487.0" y="167.0" font-size="11.5" text-anchor="start" class="t-muted">not measured: needs GitHub or GitLab access</text></g>
<g data-tag="structure" data-state="share"><title>That the code is shaped so an agent can work on one part without holding the whole repository in mind.</title><text x="139.0" y="197.0" font-size="12" text-anchor="end" class="t-fg">Structure · 6</text><line x1="151.0" y1="193.0" x2="471.0" y2="193.0" class="s-muted" stroke-width="1.5"/><circle cx="151.0" cy="193.0" r="8.0" fill="none" class="s-fg" stroke-width="1.5" data-mark="prior"/><circle cx="151.0" cy="193.0" r="6.0" class="f-accent s-bg" stroke-width="1.5" data-mark="dot"/><text x="487.0" y="197.0" font-size="11.5" text-anchor="start" class="t-fg">0 of 2 met</text></g>
<g data-tag="agent_context" data-state="share"><title>That an agent starts each task knowing how this repository works and how to check its own change.</title><text x="139.0" y="227.0" font-size="12" text-anchor="end" class="t-fg">Agent context · 6</text><line x1="151.0" y1="223.0" x2="471.0" y2="223.0" class="s-muted" stroke-width="1.5"/><circle cx="471.0" cy="223.0" r="6.0" class="f-accent s-bg" stroke-width="1.5" data-mark="dot"/><text x="487.0" y="227.0" font-size="11.5" text-anchor="start" class="t-fg">4 of 4 met</text></g>
<g data-tag="agent_runtime" data-state="listed"><title>That an agent can see the system it changes run, and confirm a change there, not only in the code.</title><text x="139.0" y="257.0" font-size="12" text-anchor="end" class="t-fg">Agent runtime · 4</text><line x1="151.0" y1="253.0" x2="471.0" y2="253.0" class="s-muted" stroke-width="1.5" stroke-dasharray="4 4" data-mark="dashed"/><text x="487.0" y="257.0" font-size="11.5" text-anchor="start" class="t-muted">not counted: its conditions are listed, never counted</text></g>
<g data-tag="governance" data-state="not_measured"><title>That people stay in the loop on what agents change, and that what agents may do is agreed and visible.</title><text x="139.0" y="287.0" font-size="12" text-anchor="end" class="t-fg">Governance · 3</text><line x1="151.0" y1="283.0" x2="471.0" y2="283.0" class="s-muted" stroke-width="1.5" stroke-dasharray="4 4" data-mark="dashed"/><text x="487.0" y="287.0" font-size="11.5" text-anchor="start" class="t-muted">not measured: waits on another condition</text></g>
<g data-tag="supply_chain" data-state="set_aside"><title>That an agent builds and tests against the same dependency versions as CI and everyone else.</title><text x="139.0" y="317.0" font-size="12" text-anchor="end" class="t-fg">Supply chain · 2</text><line x1="151.0" y1="313.0" x2="471.0" y2="313.0" class="s-muted" stroke-width="1.5" stroke-dasharray="4 4" data-mark="dashed"/><text x="487.0" y="317.0" font-size="11.5" text-anchor="start" class="t-muted">not measured: excluded by the owner or declined</text></g>
<circle cx="23.0" cy="349.0" r="6.0" class="f-accent s-bg" stroke-width="1.5"/>
<text x="38.0" y="353.0" font-size="12" text-anchor="start" class="t-fg">This run: the share of the tag's measured conditions that are met</text>
<circle cx="23.0" cy="369.0" r="7.0" fill="none" class="s-fg" stroke-width="1.5"/>
<text x="38.0" y="373.0" font-size="12" text-anchor="start" class="t-fg">The earlier run, under the same maturity model</text>
<circle cx="23.0" cy="389.0" r="7.0" fill="none" class="s-fg" stroke-width="1.5"/>
<text x="38.0" y="393.0" font-size="12" text-anchor="start" class="t-fg">A hollow dot on a dashed row is the earlier run's share; this run did not measure it</text>
<line x1="16.0" y1="409.0" x2="30.0" y2="409.0" class="s-muted" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="38.0" y="413.0" font-size="12" text-anchor="start" class="t-fg">Not measured: drawn without a dot, never as 0</text>
<text x="16.0" y="438.0" font-size="12" text-anchor="start" class="t-muted">Hollow dots: the earlier run, under the same maturity model fixture-2.</text>
<text x="16.0" y="456.0" font-size="12" text-anchor="start" class="t-fg">Each dot is the share of that tag's measured conditions that are met. A condition with several tags counts on each of</text>
<text x="16.0" y="474.0" font-size="12" text-anchor="start" class="t-fg">its rows and once in the tally, and a dashed row was not measured, never read as zero.</text>
</svg>
