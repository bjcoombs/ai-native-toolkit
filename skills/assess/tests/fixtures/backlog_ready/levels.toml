# Test model for the "backlog kept agent-ready" practice, levels 1 (#1322) and 2 (#1323). The row waits here
# until #1324 places it in the default model or a profile after the corpus check. It is a
# practice, never a Step gate, so this model defines no Steps.
version = "backlog-ready-test-1"

[[rows]]
id = "backlog-ready"
title = "Backlog kept agent-ready"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  criteria = [
    { signal = "backlog_ready.required_form_field", op = "eq", value = true },
    { signal = "backlog_ready.untriaged_on_open", op = "eq", value = true },
    { signal = "backlog_ready.ready_label_documented", op = "eq", value = true },
    { signal = "backlog_ready.stale_job_safe", op = "eq", value = true },
  ]

  [[rows.levels]]
  level = 2
  criteria = [
    { signal = "backlog_ready.first_response_met", op = "eq", value = true },
    { signal = "backlog_ready.untriaged_met", op = "eq", value = true },
    { signal = "backlog_ready.close_open_met", op = "eq", value = true },
  ]
