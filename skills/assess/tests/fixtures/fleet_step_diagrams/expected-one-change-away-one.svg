<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg class="fleet-one-change-away" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 158" width="720" height="158" role="img">
<title>One change away from the next Step</title>
<desc>In place: 0 repositories with one change left before their next Step. Each bar counts the repositories that one change would take to their next Step. A repository waiting on a gate that was not measured is not counted.</desc>
<style>svg.fleet-one-change-away text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }svg.fleet-one-change-away .t-bg,svg.fleet-one-change-away .f-bg {fill:#ffffff}svg.fleet-one-change-away .s-bg {stroke:#ffffff}svg.fleet-one-change-away .t-fg,svg.fleet-one-change-away .f-fg {fill:#1d2321}svg.fleet-one-change-away .s-fg {stroke:#1d2321}svg.fleet-one-change-away .t-muted,svg.fleet-one-change-away .f-muted {fill:#5d6763}svg.fleet-one-change-away .s-muted {stroke:#5d6763}svg.fleet-one-change-away .t-rule,svg.fleet-one-change-away .f-rule {fill:#d9dedb}svg.fleet-one-change-away .s-rule {stroke:#d9dedb}svg.fleet-one-change-away .t-accent,svg.fleet-one-change-away .f-accent {fill:#1f6f6b}svg.fleet-one-change-away .s-accent {stroke:#1f6f6b}svg.fleet-one-change-away .t-bad,svg.fleet-one-change-away .f-bad {fill:#b33a2e}svg.fleet-one-change-away .s-bad {stroke:#b33a2e}svg.fleet-one-change-away .t-warn,svg.fleet-one-change-away .f-warn {fill:#b7791f}svg.fleet-one-change-away .s-warn {stroke:#b7791f}svg.fleet-one-change-away .t-unk,svg.fleet-one-change-away .f-unk {fill:#9aa39f}svg.fleet-one-change-away .s-unk {stroke:#9aa39f}@media (prefers-color-scheme: dark){svg.fleet-one-change-away .t-bg,svg.fleet-one-change-away .f-bg {fill:#1a201e}svg.fleet-one-change-away .s-bg {stroke:#1a201e}svg.fleet-one-change-away .t-fg,svg.fleet-one-change-away .f-fg {fill:#e6ebe8}svg.fleet-one-change-away .s-fg {stroke:#e6ebe8}svg.fleet-one-change-away .t-muted,svg.fleet-one-change-away .f-muted {fill:#9aa5a0}svg.fleet-one-change-away .s-muted {stroke:#9aa5a0}svg.fleet-one-change-away .t-rule,svg.fleet-one-change-away .f-rule {fill:#2c3532}svg.fleet-one-change-away .s-rule {stroke:#2c3532}svg.fleet-one-change-away .t-accent,svg.fleet-one-change-away .f-accent {fill:#5fb8b1}svg.fleet-one-change-away .s-accent {stroke:#5fb8b1}svg.fleet-one-change-away .t-bad,svg.fleet-one-change-away .f-bad {fill:#ec7a6c}svg.fleet-one-change-away .s-bad {stroke:#ec7a6c}svg.fleet-one-change-away .t-warn,svg.fleet-one-change-away .f-warn {fill:#e0a84a}svg.fleet-one-change-away .s-warn {stroke:#e0a84a}svg.fleet-one-change-away .t-unk,svg.fleet-one-change-away .f-unk {fill:#5f6a66}svg.fleet-one-change-away .s-unk {stroke:#5f6a66}}</style>
<defs><pattern id="fleet-one-change-away-fleet-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="f-bg"/><line x1="0" y1="0" x2="0" y2="6" class="s-unk" stroke-width="2.4"/></pattern></defs>
<rect x="0" y="0" width="720" height="158" class="f-bg"/>
<text x="16.0" y="28.0" font-size="15" text-anchor="start" class="t-fg" font-weight="600">One change away from the next Step</text>
<text x="16.0" y="48.0" font-size="12" text-anchor="start" class="t-muted">Repositories one change from their next Step, by the change</text>
<text x="16.0" y="72.0" font-size="12.5" text-anchor="start" class="t-fg">No single change takes a repository to its next Step in this run.</text>
<text x="16.0" y="124.0" font-size="12" text-anchor="start" class="t-fg">Each bar counts the repositories that one change would take to their next Step. A repository</text>
<text x="16.0" y="142.0" font-size="12" text-anchor="start" class="t-fg">waiting on a gate that was not measured is not counted.</text>
</svg>
