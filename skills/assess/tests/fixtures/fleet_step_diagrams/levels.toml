# The Step diagrams fixture model (#941): Step 2 has two gates, so one repository can be
# held by more than one; Step 3 adds a third.
version = "step-diagrams-fixture-1"

[[rows]]
id = "instructions"
title = "Agent instructions"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  criteria = [{ signal = "nested_instructions.budget.claude_code.lines", op = "gt", value = 0 }]

[[rows]]
id = "agent-use"
title = "Agent use"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  criteria = [{ signal = "ai_usage.agent_trailer_commits", op = "gt", value = 0 }]

[[rows]]
id = "ci"
title = "CI runs the tests"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  criteria = [{ signal = "ci_checks.test_or_lint_configured", op = "eq", value = true }]

[[steps]]
step = 1
name = "Assisted"

[[steps]]
step = 2
name = "Supervised agent PRs"
gates = [
  { id = "instructions", row = "instructions", level = 1 },
  { id = "agent_use", row = "agent-use", level = 1 },
]

[[steps]]
step = 3
name = "Unattended agent PRs"
gates = [
  { id = "instructions", row = "instructions", level = 1 },
  { id = "agent_use", row = "agent-use", level = 1 },
  { id = "ci_runs_tests", row = "ci", level = 1 },
]
