<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg class="fleet-step-funnel" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 265" width="720" height="265" role="img">
<title>Repositories at each Step</title>
<desc>In place: 1 repository with a measured Step, 1 of them at the top Step. Each bar counts the repositories at a Step. Its parts name the first gate that holds them back. Hatched parts were not measured, so they are never read as unmet.</desc>
<style>svg.fleet-step-funnel text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }svg.fleet-step-funnel .t-bg,svg.fleet-step-funnel .f-bg {fill:#ffffff}svg.fleet-step-funnel .s-bg {stroke:#ffffff}svg.fleet-step-funnel .t-fg,svg.fleet-step-funnel .f-fg {fill:#1d2321}svg.fleet-step-funnel .s-fg {stroke:#1d2321}svg.fleet-step-funnel .t-muted,svg.fleet-step-funnel .f-muted {fill:#5d6763}svg.fleet-step-funnel .s-muted {stroke:#5d6763}svg.fleet-step-funnel .t-rule,svg.fleet-step-funnel .f-rule {fill:#d9dedb}svg.fleet-step-funnel .s-rule {stroke:#d9dedb}svg.fleet-step-funnel .t-accent,svg.fleet-step-funnel .f-accent {fill:#1f6f6b}svg.fleet-step-funnel .s-accent {stroke:#1f6f6b}svg.fleet-step-funnel .t-bad,svg.fleet-step-funnel .f-bad {fill:#b33a2e}svg.fleet-step-funnel .s-bad {stroke:#b33a2e}svg.fleet-step-funnel .t-warn,svg.fleet-step-funnel .f-warn {fill:#b7791f}svg.fleet-step-funnel .s-warn {stroke:#b7791f}svg.fleet-step-funnel .t-unk,svg.fleet-step-funnel .f-unk {fill:#9aa39f}svg.fleet-step-funnel .s-unk {stroke:#9aa39f}svg.fleet-step-funnel .t-g0,svg.fleet-step-funnel .f-g0 {fill:#1f6f6b}svg.fleet-step-funnel .s-g0 {stroke:#1f6f6b}svg.fleet-step-funnel .t-g1,svg.fleet-step-funnel .f-g1 {fill:#4f6db8}svg.fleet-step-funnel .s-g1 {stroke:#4f6db8}svg.fleet-step-funnel .t-g2,svg.fleet-step-funnel .f-g2 {fill:#8a6a1f}svg.fleet-step-funnel .s-g2 {stroke:#8a6a1f}svg.fleet-step-funnel .t-g3,svg.fleet-step-funnel .f-g3 {fill:#7a4f8c}svg.fleet-step-funnel .s-g3 {stroke:#7a4f8c}svg.fleet-step-funnel .t-top,svg.fleet-step-funnel .f-top {fill:#238443}svg.fleet-step-funnel .s-top {stroke:#238443}@media (prefers-color-scheme: dark){svg.fleet-step-funnel .t-bg,svg.fleet-step-funnel .f-bg {fill:#1a201e}svg.fleet-step-funnel .s-bg {stroke:#1a201e}svg.fleet-step-funnel .t-fg,svg.fleet-step-funnel .f-fg {fill:#e6ebe8}svg.fleet-step-funnel .s-fg {stroke:#e6ebe8}svg.fleet-step-funnel .t-muted,svg.fleet-step-funnel .f-muted {fill:#9aa5a0}svg.fleet-step-funnel .s-muted {stroke:#9aa5a0}svg.fleet-step-funnel .t-rule,svg.fleet-step-funnel .f-rule {fill:#2c3532}svg.fleet-step-funnel .s-rule {stroke:#2c3532}svg.fleet-step-funnel .t-accent,svg.fleet-step-funnel .f-accent {fill:#5fb8b1}svg.fleet-step-funnel .s-accent {stroke:#5fb8b1}svg.fleet-step-funnel .t-bad,svg.fleet-step-funnel .f-bad {fill:#ec7a6c}svg.fleet-step-funnel .s-bad {stroke:#ec7a6c}svg.fleet-step-funnel .t-warn,svg.fleet-step-funnel .f-warn {fill:#e0a84a}svg.fleet-step-funnel .s-warn {stroke:#e0a84a}svg.fleet-step-funnel .t-unk,svg.fleet-step-funnel .f-unk {fill:#5f6a66}svg.fleet-step-funnel .s-unk {stroke:#5f6a66}svg.fleet-step-funnel .t-g0,svg.fleet-step-funnel .f-g0 {fill:#5fb8b1}svg.fleet-step-funnel .s-g0 {stroke:#5fb8b1}svg.fleet-step-funnel .t-g1,svg.fleet-step-funnel .f-g1 {fill:#8ea6e6}svg.fleet-step-funnel .s-g1 {stroke:#8ea6e6}svg.fleet-step-funnel .t-g2,svg.fleet-step-funnel .f-g2 {fill:#d8b260}svg.fleet-step-funnel .s-g2 {stroke:#d8b260}svg.fleet-step-funnel .t-g3,svg.fleet-step-funnel .f-g3 {fill:#bf98d0}svg.fleet-step-funnel .s-g3 {stroke:#bf98d0}svg.fleet-step-funnel .t-top,svg.fleet-step-funnel .f-top {fill:#78c679}svg.fleet-step-funnel .s-top {stroke:#78c679}}</style>
<defs><pattern id="fleet-step-funnel-fleet-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="f-bg"/><line x1="0" y1="0" x2="0" y2="6" class="s-unk" stroke-width="2.4"/></pattern></defs>
<rect x="0" y="0" width="720" height="265" class="f-bg"/>
<text x="16.0" y="28.0" font-size="15" text-anchor="start" class="t-fg" font-weight="600">Repositories at each Step</text>
<text x="16.0" y="48.0" font-size="12" text-anchor="start" class="t-muted">Each repository counts once, under the first gate of its next Step that does not hold</text>
<g data-step="1"><text x="234.0" y="90.0" font-size="12" text-anchor="end" class="t-fg" data-label="Assisted">Step 1 · Assisted<title>Assisted</title></text><text x="254.0" y="90.0" font-size="11.5" text-anchor="start" class="t-fg">0 repositories</text></g>
<g data-step="2"><text x="234.0" y="130.0" font-size="12" text-anchor="end" class="t-fg" data-label="Supervised agent PRs">Step 2 · Supervised agent PRs<title>Supervised agent PRs</title></text><text x="254.0" y="130.0" font-size="11.5" text-anchor="start" class="t-fg">0 repositories</text></g>
<g data-step="3"><text x="234.0" y="170.0" font-size="12" text-anchor="end" class="t-fg" data-label="Unattended agent PRs">Step 3 · Unattended agent PRs<title>Unattended agent PRs</title></text><rect x="246.0" y="156.0" width="300.0" height="20.0" class="f-top"/><text x="554.0" y="170.0" font-size="11.5" text-anchor="start" class="t-fg">1 repository</text><rect x="246.0" y="185.0" width="11.0" height="11.0" class="f-top"/><text x="264.0" y="195.0" font-size="11.5" text-anchor="start" class="t-fg">1 at the top Step</text></g>
<text x="16.0" y="231.0" font-size="12" text-anchor="start" class="t-fg">Each bar counts the repositories at a Step. Its parts name the first gate that holds them back.</text>
<text x="16.0" y="249.0" font-size="12" text-anchor="start" class="t-fg">Hatched parts were not measured, so they are never read as unmet.</text>
</svg>
