<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" width="720" height="290" role="img">
<title>One change away from the next Step</title>
<desc>In place: 3 repositories with one change left before their next Step. Each bar counts the repositories that one change would take to their next Step. A repository waiting on a gate that was not measured is not counted.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }.t-bg,.f-bg{fill:#ffffff}.s-bg{stroke:#ffffff}.t-fg,.f-fg{fill:#1d2321}.s-fg{stroke:#1d2321}.t-muted,.f-muted{fill:#5d6763}.s-muted{stroke:#5d6763}.t-rule,.f-rule{fill:#d9dedb}.s-rule{stroke:#d9dedb}.t-accent,.f-accent{fill:#1f6f6b}.s-accent{stroke:#1f6f6b}.t-bad,.f-bad{fill:#b33a2e}.s-bad{stroke:#b33a2e}.t-warn,.f-warn{fill:#b7791f}.s-warn{stroke:#b7791f}.t-unk,.f-unk{fill:#9aa39f}.s-unk{stroke:#9aa39f}@media (prefers-color-scheme: dark){.t-bg,.f-bg{fill:#1a201e}.s-bg{stroke:#1a201e}.t-fg,.f-fg{fill:#e6ebe8}.s-fg{stroke:#e6ebe8}.t-muted,.f-muted{fill:#9aa5a0}.s-muted{stroke:#9aa5a0}.t-rule,.f-rule{fill:#2c3532}.s-rule{stroke:#2c3532}.t-accent,.f-accent{fill:#5fb8b1}.s-accent{stroke:#5fb8b1}.t-bad,.f-bad{fill:#ec7a6c}.s-bad{stroke:#ec7a6c}.t-warn,.f-warn{fill:#e0a84a}.s-warn{stroke:#e0a84a}.t-unk,.f-unk{fill:#5f6a66}.s-unk{stroke:#5f6a66}}</style>
<defs><pattern id="fleet-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="f-bg"/><line x1="0" y1="0" x2="0" y2="6" class="s-unk" stroke-width="2.4"/></pattern></defs>
<rect x="0" y="0" width="720" height="290" class="f-bg"/>
<text x="16.0" y="28.0" font-size="15" text-anchor="start" class="t-fg" font-weight="600">One change away from the next Step</text>
<text x="16.0" y="48.0" font-size="12" text-anchor="start" class="t-muted">Repositories one change from their next Step, by the change</text>
<g data-condition="instructions.1"><title>instructions gate (Agent instructions), to Step 2</title><text x="16.0" y="72.0" font-size="12" text-anchor="start" class="t-fg">instructions gate (Agent instructions), to Step 2</text><rect x="16.0" y="78.0" width="300.0" height="22.0" class="f-accent"/><text x="324.0" y="94.0" font-size="12" text-anchor="start" class="t-fg">2 repositories</text></g>
<g data-condition="ci.1"><title>ci_runs_tests gate (CI runs the tests), to Step 3</title><text x="16.0" y="120.0" font-size="12" text-anchor="start" class="t-fg">ci_runs_tests gate (CI runs the tests), to Step 3</text><rect x="16.0" y="126.0" width="150.0" height="22.0" class="f-accent"/><text x="174.0" y="142.0" font-size="12" text-anchor="start" class="t-fg">1 repository</text></g>
<g data-mark="unknown"><rect x="16.0" y="164.0" width="14.0" height="14.0" fill="url(#fleet-hatch)" class="s-muted" stroke-width="1"/><text x="38.0" y="175.0" font-size="12" text-anchor="start" class="t-fg">1 repository waits on a gate that was not measured or that the owner set aside. No lift is</text><text x="38.0" y="193.0" font-size="12" text-anchor="start" class="t-fg">promised for them.</text></g>
<g data-mark="unknown"><rect x="16.0" y="208.0" width="14.0" height="14.0" fill="url(#fleet-hatch)" class="s-muted" stroke-width="1"/><text x="38.0" y="219.0" font-size="12" text-anchor="start" class="t-fg">1 repository had no measured Step in this run.</text></g>
<text x="16.0" y="256.0" font-size="12" text-anchor="start" class="t-fg">Each bar counts the repositories that one change would take to their next Step. A repository</text>
<text x="16.0" y="274.0" font-size="12" text-anchor="start" class="t-fg">waiting on a gate that was not measured is not counted.</text>
</svg>
