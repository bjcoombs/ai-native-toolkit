<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 865 339" width="865" height="339" role="img">
<title>Repositories at each Step</title>
<desc>In place: 6 repositories with a measured Step, 1 of them at the top Step. Each bar counts the repositories at a Step. Its parts name the first gate that holds them back. Hatched parts were not measured, so they are never read as unmet.</desc>
<style>text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }.t-bg,.f-bg{fill:#ffffff}.s-bg{stroke:#ffffff}.t-fg,.f-fg{fill:#1d2321}.s-fg{stroke:#1d2321}.t-muted,.f-muted{fill:#5d6763}.s-muted{stroke:#5d6763}.t-rule,.f-rule{fill:#d9dedb}.s-rule{stroke:#d9dedb}.t-accent,.f-accent{fill:#1f6f6b}.s-accent{stroke:#1f6f6b}.t-bad,.f-bad{fill:#b33a2e}.s-bad{stroke:#b33a2e}.t-warn,.f-warn{fill:#b7791f}.s-warn{stroke:#b7791f}.t-unk,.f-unk{fill:#9aa39f}.s-unk{stroke:#9aa39f}.t-g0,.f-g0{fill:#1f6f6b}.s-g0{stroke:#1f6f6b}.t-g1,.f-g1{fill:#4f6db8}.s-g1{stroke:#4f6db8}.t-g2,.f-g2{fill:#8a6a1f}.s-g2{stroke:#8a6a1f}.t-g3,.f-g3{fill:#7a4f8c}.s-g3{stroke:#7a4f8c}.t-top,.f-top{fill:#238443}.s-top{stroke:#238443}@media (prefers-color-scheme: dark){.t-bg,.f-bg{fill:#1a201e}.s-bg{stroke:#1a201e}.t-fg,.f-fg{fill:#e6ebe8}.s-fg{stroke:#e6ebe8}.t-muted,.f-muted{fill:#9aa5a0}.s-muted{stroke:#9aa5a0}.t-rule,.f-rule{fill:#2c3532}.s-rule{stroke:#2c3532}.t-accent,.f-accent{fill:#5fb8b1}.s-accent{stroke:#5fb8b1}.t-bad,.f-bad{fill:#ec7a6c}.s-bad{stroke:#ec7a6c}.t-warn,.f-warn{fill:#e0a84a}.s-warn{stroke:#e0a84a}.t-unk,.f-unk{fill:#5f6a66}.s-unk{stroke:#5f6a66}.t-g0,.f-g0{fill:#5fb8b1}.s-g0{stroke:#5fb8b1}.t-g1,.f-g1{fill:#8ea6e6}.s-g1{stroke:#8ea6e6}.t-g2,.f-g2{fill:#d8b260}.s-g2{stroke:#d8b260}.t-g3,.f-g3{fill:#bf98d0}.s-g3{stroke:#bf98d0}.t-top,.f-top{fill:#78c679}.s-top{stroke:#78c679}}</style>
<defs><pattern id="fleet-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="f-bg"/><line x1="0" y1="0" x2="0" y2="6" class="s-unk" stroke-width="2.4"/></pattern></defs>
<rect x="0" y="0" width="865" height="339" class="f-bg"/>
<text x="16.0" y="28.0" font-size="15" text-anchor="start" class="t-fg" font-weight="600">Repositories at each Step</text>
<text x="16.0" y="48.0" font-size="12" text-anchor="start" class="t-muted">Each repository counts once, under the first gate of its next Step that does not hold</text>
<g data-step="1"><text x="234.0" y="90.0" font-size="12" text-anchor="end" class="t-fg">Step 1 · Assisted<title>Assisted</title></text><rect x="246.0" y="76.0" width="180.0" height="20.0" class="f-g0"/><rect x="426.0" y="76.0" width="60.0" height="20.0" fill="url(#fleet-hatch)" class="s-g1" stroke-width="1.5" data-mark="hatched"/><text x="494.0" y="90.0" font-size="11.5" text-anchor="start" class="t-fg">4 repositories, 1 held by more than one gate</text><rect x="246.0" y="105.0" width="11.0" height="11.0" class="f-g0"/><text x="264.0" y="115.0" font-size="11.5" text-anchor="start" class="t-fg">3 held by instructions</text><rect x="246.0" y="122.0" width="11.0" height="11.0" fill="url(#fleet-hatch)" class="s-g1" stroke-width="1.5" data-mark="hatched"/><text x="264.0" y="132.0" font-size="11.5" text-anchor="start" class="t-fg">1 where agent_use was not measured (needs_platform)</text></g>
<g data-step="2"><text x="234.0" y="164.0" font-size="12" text-anchor="end" class="t-fg">Step 2 · Supervised agent PRs<title>Supervised agent PRs</title></text><rect x="246.0" y="150.0" width="60.0" height="20.0" class="f-g2"/><text x="314.0" y="164.0" font-size="11.5" text-anchor="start" class="t-fg">1 repository</text><rect x="246.0" y="179.0" width="11.0" height="11.0" class="f-g2"/><text x="264.0" y="189.0" font-size="11.5" text-anchor="start" class="t-fg">1 held by ci_runs_tests</text></g>
<g data-step="3"><text x="234.0" y="221.0" font-size="12" text-anchor="end" class="t-fg">Step 3 · Unattended agent PRs<title>Unattended agent PRs</title></text><rect x="246.0" y="207.0" width="60.0" height="20.0" class="f-top"/><text x="314.0" y="221.0" font-size="11.5" text-anchor="start" class="t-fg">1 repository</text><rect x="246.0" y="236.0" width="11.0" height="11.0" class="f-top"/><text x="264.0" y="246.0" font-size="11.5" text-anchor="start" class="t-fg">1 at the top Step</text></g>
<g data-mark="unknown"><rect x="16.0" y="260.0" width="14.0" height="14.0" fill="url(#fleet-hatch)" class="s-muted" stroke-width="1"/><text x="38.0" y="271.0" font-size="12" text-anchor="start" class="t-fg">1 repository with no measured Step, never drawn at Step 1: 1 scan_timeout.</text></g>
<text x="16.0" y="305.0" font-size="12" text-anchor="start" class="t-fg">Each bar counts the repositories at a Step. Its parts name the first gate that holds them back. Hatched parts were not</text>
<text x="16.0" y="323.0" font-size="12" text-anchor="start" class="t-fg">measured, so they are never read as unmet.</text>
</svg>
