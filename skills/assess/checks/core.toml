# The core check manifest (#789): every collector, signal, condition and finding the
# toolkit ships, declared once. Contract: skills/assess/references/check-manifest.schema.json;
# loader: skills/assess/scripts/lib/check_manifest.py. The finding tables, the coupling
# thresholds, the counts-only rules (each collector's privacy table) and the per-block
# reason descriptions of the published schemas are generated from it at import (#795).
# Agreement with the scan registry, the headless tables, the typed roots and the default
# maturity model: skills/assess/tests/test_check_manifest.py.
#
# The entries live in one fragment per collector, checks/core/<scan key>.toml (#982): the
# collector entry plus the signals, conditions and findings it owns (a signal names its
# collector, a condition reads one signal, a finding belongs to the collector of its first
# input). The loader merges the fragments in the order below, which is the scan-table
# order (lib/scan_registry.py SCANS), and an id declared in two fragments fails to load.
# A new collector adds its fragment and one line here.

manifest_version = 1
owner = "core"
fragments = [
  "run_scope",
  "scope",
  "assess_dir",
  "run_id",
  "current",
  "prior",
  "excluded_as_generated",
