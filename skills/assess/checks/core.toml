evidence = "config_text"

[[entries]]
id = "core:agent_ops.summary.hooks_present"
kind = "signal"
title = "Agent hooks are committed"
collector = "core.agent_ops"
path = "agent_ops.summary.hooks_present"
type = "bool"
evidence = "config_text"

[[entries]]
id = "core:agent_ops.summary.routines_present"
kind = "signal"
title = "Agent routines are committed"
collector = "core.agent_ops"
path = "agent_ops.summary.routines_present"
type = "bool"
evidence = "config_text"

[[entries]]
id = "core:doc_staleness.summary.stale_pct"
kind = "signal"
title = "Share of mapped docs outrun by their code"
collector = "core.doc_staleness"
path = "doc_staleness.summary.stale_pct"
type = "number"
evidence = "git_history"
null_means = "a shallow or degenerate history, no git work tree or no mapped doc"

[[entries]]
id = "core:guardrails.stated_pct"
kind = "signal"
title = "Share of configured gates an instruction file states"
collector = "core.guardrails"
path = "guardrails.stated_pct"
type = "number"
evidence = "head_structure"
null_means = "no gate found: nothing to state"

[[entries]]
id = "core:agent_consistency.conflicts"
kind = "signal"
title = "Commands and thresholds the agent systems disagree on"
collector = "core.agent_consistency"
path = "agent_consistency.conflicts"
type = "number"
evidence = "head_structure"
null_means = "fewer than two agent systems: nothing to agree with"

[[entries]]
id = "core:agent_consistency.unlinked"
kind = "signal"
title = "Agent systems not linked to the canonical instruction file"
collector = "core.agent_consistency"
path = "agent_consistency.unlinked"
type = "number"
evidence = "head_structure"
null_means = "fewer than two agent systems: nothing to link"

# -- conditions: display metadata for each default criterion -----------------------
[[entries]]
id = "core.cond.layer-0-instructions.1.instruction_file_present"
kind = "condition"
title = "An instruction file is committed"
key = "layer-0-instructions.1:layer_grades.instruction_file_present"
fix = "Commit a CLAUDE.md or AGENTS.md that tells an agent how this repository works."

[[entries]]
id = "core.cond.layer-0-instructions.2.named_total"
kind = "condition"
title = "An instruction file names a check command"
key = "layer-0-instructions.2:agent_environment.check.named_total"
fix = "Name the command that checks a change (for example make check) in your instruction file."

[[entries]]
id = "core.cond.layer-0-instructions.2.failed"
kind = "condition"
title = "Every checkable instruction claim holds"
key = "layer-0-instructions.2:instruction_claims.failed"
fix = "Update the instruction lines whose claims no longer match the repository."

[[entries]]
id = "core.cond.layer-0-instructions.2.lines"
kind = "condition"
title = "Always-loaded instructions fit in 200 lines"
key = "layer-0-instructions.2:nested_instructions.budget.claude_code.lines"
fix = "Move detail that is needed only sometimes into files the instructions point to."

[[entries]]
id = "core.cond.layer-1-liveness.1.rung"
kind = "condition"
title = "Some runtime telemetry is committed"
key = "layer-1-liveness.1:observability.rung"
fix = "Add a telemetry dependency, a runbook or an OBSERVABILITY.md so an agent can see the system run."

[[entries]]
id = "core.cond.layer-1-liveness.2.rung"
kind = "condition"
title = "Runtime telemetry reaches rung 3"
key = "layer-1-liveness.2:observability.rung"
fix = "Give agents a way to read logs or metrics, such as a logs or metrics MCP server or skill."

[[entries]]
id = "core.cond.layer-2-design.1.modularity_q"
kind = "condition"
title = "The import graph has module structure"
key = "layer-2-design.1:structure.modularity_q"
fix = "Group related modules into packages that mostly import within themselves."

[[entries]]
id = "core.cond.layer-2-design.2.cross_package_edges"
kind = "condition"
title = "Packages import one another"
key = "layer-2-design.2:structure.cross_package_edges"
fix = "Nothing to change on its own: this is met once one package imports another."

[[entries]]
id = "core.cond.layer-2-design.2.front_door_ratio"
kind = "condition"
title = "Cross-package imports use a package's front door"
key = "layer-2-design.2:structure.front_door_ratio"
fix = "Import other packages through their public API rather than their submodules."

[[entries]]
id = "core.cond.layer-3-linters.1.lint_runs"
kind = "condition"
title = "CI runs a linter or type checker"
key = "layer-3-linters.1:ci_checks.lint_runs"
fix = "Add a CI step that runs your linter (ruff check ., eslint, mypy, make lint) on pull requests, without || true, continue-on-error or allow_failure."

[[entries]]
id = "core.cond.layer-3-linters.2.stale"
kind = "condition"
title = "Stale suppressions stay at 10 or fewer"
key = "layer-3-linters.2:promissory_markers.families.suppression.stale"
fix = "Revisit the oldest suppression comments and fix or remove them."

[[entries]]
id = "core.cond.layer-3-linters.2.aging_reliable"
kind = "condition"
title = "Suppression ages can be read from history"
key = "layer-3-linters.2:promissory_markers.aging_reliable"
fix = "Run on a full clone so suppression ages can be measured."

[[entries]]
id = "core.cond.layer-4-architecture.1.boundary_patterns"
kind = "condition"
title = "A boundary or ownership map names a module path"
key = "layer-4-architecture.1:structure_drift.tier_0.boundary_patterns"
fix = "Commit a CODEOWNERS line per module path, or an ARCHITECTURE.md that names module paths."

[[entries]]
id = "core.cond.layer-4-architecture.2.p95"
kind = "condition"
title = "95% of files are 500 lines or fewer"
key = "layer-4-architecture.2:stats_summary.loc.p95"
fix = "Split the largest files along their natural seams."

[[entries]]
id = "core.cond.layer-5-ci.1.enforced_check_runs"
kind = "condition"
title = "CI runs your tests or linters, and an error stops the job"
key = "layer-5-ci.1:ci_checks.enforced_check_runs"
fix = "Add a CI step that runs your test or lint command on pull requests, without || true, continue-on-error or allow_failure."

[[entries]]
id = "core.cond.layer-5-ci.2.unlocked_total"
kind = "condition"
title = "Every dependency manifest has its lockfile"
key = "layer-5-ci.2:agent_environment.pinning.unlocked_total"
fix = "Commit the lockfile for each dependency manifest (or pin a requirements file with ==), so an agent installs what CI tests."

[[entries]]
id = "core.cond.layer-6-coverage.1.threshold_meets_minimum"
kind = "condition"
title = "A coverage gate of at least 50 percent is configured"
key = "layer-6-coverage.1:coverage_gate.threshold_meets_minimum"
fix = "Set a fail_under (or your tool's threshold) of at least 50 percent, written as a number, near your current coverage, so CI holds the line you have reached."

[[entries]]
id = "core.cond.layer-6-coverage.2.mutation_run"
kind = "condition"
title = "A mutation run has completed"
key = "layer-6-coverage.2:test_pressure.mutation_run"
fix = "Run the opt-in mutation pass to see which tests pin behaviour."

[[entries]]
id = "core.cond.layer-7-review.1.present"
kind = "condition"
title = "Changes get reviewed"
key = "layer-7-review.1:review_evidence.present"
fix = "Commit an AI review step in CI, or review merged changes before they land."

[[entries]]
id = "core.cond.layer-7-review.2.reviewed_share"
kind = "condition"
title = "Most merged changes are reviewed"
key = "layer-7-review.2:review_reality.reviewed_share"
fix = "Aim for a review on at least four in five merged changes."

[[entries]]
id = "core.cond.layer-7-review.2.approved_share"
kind = "condition"
title = "Half of merged changes are approved"
key = "layer-7-review.2:review_reality.approved_share"
fix = "Approve changes explicitly when you review them."

[[entries]]
id = "core.cond.layer-8-agent-ops.1.permissions_encoded"
kind = "condition"
title = "Agent permissions are committed"
key = "layer-8-agent-ops.1:agent_ops.summary.permissions_encoded"
fix = "Commit the agent permission allowlist your team uses, so every clone shares it."

[[entries]]
id = "core.cond.layer-8-agent-ops.2.hooks_present"
kind = "condition"
title = "Agent hooks are committed"
key = "layer-8-agent-ops.2:agent_ops.summary.hooks_present"
fix = "Commit the hooks that run checks around agent actions."

[[entries]]
id = "core.cond.layer-8-agent-ops.2.routines_present"
kind = "condition"
title = "Agent routines are committed"
key = "layer-8-agent-ops.2:agent_ops.summary.routines_present"
fix = "Commit the routines agents run on a schedule or trigger."

[[entries]]
id = "core.cond.doc-freshness.1.stale_pct"
kind = "condition"
title = "Most mapped docs keep pace with their code"
key = "doc-freshness.1:doc_staleness.summary.stale_pct"
fix = "Refresh the docs the report lists under doc freshness."

[[entries]]
id = "core.cond.doc-freshness.2.stale_pct"
kind = "condition"
title = "Four in five mapped docs keep pace"
key = "doc-freshness.2:doc_staleness.summary.stale_pct"
fix = "Refresh the docs the report lists under doc freshness, oldest first."

[[entries]]
id = "core.cond.guardrails-stated.1.stated_pct"
kind = "condition"
title = "Half the configured gates are stated"
key = "guardrails-stated.1:guardrails.stated_pct"
fix = "Add the ready one-line snippet the report gives for each unstated gate to CLAUDE.md or AGENTS.md, so the next session knows the rule before it runs into it."

[[entries]]
id = "core.cond.guardrails-stated.2.stated_pct"
kind = "condition"
title = "Every configured gate is stated"
key = "guardrails-stated.2:guardrails.stated_pct"
fix = "Add the remaining snippets the report gives, one line per gate: its rule, its threshold and the command that checks it before pushing."

[[entries]]
id = "core.cond.agent-consistency.1.conflicts"
kind = "condition"
title = "Every agent system names the same checks"
key = "agent-consistency.1:agent_consistency.conflicts"
fix = "Make the instruction files agree: name the same test and lint commands and the same thresholds in each, or replace each tool's file with the pointer line the report gives."

[[entries]]
id = "core.cond.agent-consistency.2.unlinked"
kind = "condition"
title = "Every agent system reads one canonical file"
key = "agent-consistency.2:agent_consistency.unlinked"
fix = "Keep AGENTS.md as the one source and make each other tool's file a thin pointer or a symlink to it, using the exact line the report gives for that tool."

# -- findings -----------------------------------------------------------------------
[[entries]]
id = "core.finding.hidden_coupling"
kind = "finding"
title = "Hidden coupling"
name = "hidden_coupling"
order = 0
action = "investigate the seam"
mode = "characterize_first"
concern = true
inputs = ["behaviour.hidden_coupling_findings", "structure_drift.tier_1"]
derive = "lib.coupling_analysis:detect_hidden_coupling"
suppressed_when = "doc_staleness.churn_degenerate == true"
prune_missing_paths = true
headless = "unregistered"
  [entries.thresholds]
  low_containment = 0.3
  high_modularity_q = 0.3
  high_front_door_ratio = 0.7

[[entries]]
id = "core.finding.lying_map"
kind = "finding"
title = "Stale doc over complex code"
name = "lying_map"
order = 1
action = "fix or delete the doc"
mode = "verify_then_retire"
concern = true
inputs = ["documentation.stale_doc_on_complexity"]
suppressed_when = "doc_staleness.churn_degenerate == true"
headless = "unregistered"

[[entries]]
id = "core.finding.unexplained_complexity"
kind = "finding"
title = "Unexplained complexity"
name = "unexplained_complexity"
order = 2
action = "write the contract the code needs (do NOT auto-generate)"
mode = "characterize_first"
concern = true
inputs = ["documentation.unexplained_complexity"]
headless = "unregistered"

[[entries]]
id = "core.finding.untrusted_hotspot"
kind = "finding"
title = "Untrusted hotspot"
name = "untrusted_hotspot"
order = 3
action = "strengthen tests to pin observable behaviour (not internal state)"
mode = "characterize_first"
concern = true
inputs = ["current", "test_pressure"]
derive = "lib.untrusted_hotspot:untrusted_hotspot_paths"
headless = "unregistered"

[[entries]]
id = "core.finding.self_referential_tests"
kind = "finding"
title = "Self-referential tests"
name = "self_referential_tests"
order = 4
action = "request human review - tests verify internal consistency, not truth"
mode = "verify_then_retire"
concern = true
inputs = ["current"]
derive = "lib.keyhole_signals:_self_referential_test_paths"
headless = "unregistered"

[[entries]]
id = "core.finding.unactioned_intent"
kind = "finding"
title = "Unactioned intent"
name = "unactioned_intent"
order = 5
action = "action the promise: fix it, ticket it, or delete the marker/skip"
mode = "verify_then_retire"
concern = true
inputs = ["promissory"]
derive = "lib.keyhole_signals:_unactioned_intent_paths"
headless = "unregistered"

[[entries]]
id = "core.finding.accretion_ratchet"
kind = "finding"
title = "Accretion ratchet"
name = "accretion_ratchet"
order = 6
action = "refactor down: extract, delete dead code, or split the file"
mode = "refactor_safe"
concern = true
inputs = ["accretion_ratchet"]
derive = "lib.keyhole_signals:_accretion_ratchet_finding"
headless = "unregistered"

[[entries]]
id = "core.finding.orphaned_understanding"
kind = "finding"
title = "Orphaned understanding"
name = "orphaned_understanding"
order = 7
action = "assign a human anchor before further change"
mode = "characterize_first"
concern = true
inputs = ["understanding.orphaned_understanding"]
headless = "unregistered"

[[entries]]
id = "core.finding.candidate_dead_weight"
kind = "finding"
title = "Candidate dead weight"
name = "candidate_dead_weight"
order = 8
action = "verify liveness, then delete if dead"
mode = "verify_then_retire"
concern = true
inputs = ["dead_code"]
derive = "lib.keyhole_signals:candidate_dead_weight_paths"
headless = "unregistered"

[[entries]]
id = "core.finding.override_contradicts_signals"
kind = "finding"
title = "Archetype override contradicts the signals"
name = "override_contradicts_signals"
order = 9
action = "Review archetype marker - deterministic signals suggest a different classification"
mode = "characterize_first"
concern = true
inputs = ["archetype"]
derive = "lib.keyhole_signals:_override_contradiction_paths"
headless = "unregistered"

[[entries]]
id = "core.finding.refactor_boundary"
kind = "finding"
title = "Refactor boundary"
name = "refactor_boundary"
order = 10
action = "safe to hand an agent in isolation"
mode = "refactor_safe"
concern = false
inputs = ["behaviour.refactor_boundaries"]
prune_missing_paths = true
headless = "unregistered"
