# Check manifest fragment: the units collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.units"
kind = "collector"
title = "Monorepo units"
summary = "The repository's units. First each skill folder (a SKILL.md), and a plugin's agents/ and commands/. Then the shallowest build-manifest folders, with each workspace root's declared members in its place, or the [[units]] of .assess/config.toml. Folders with only a manifest are skipped."
issues = [800, 862, 1098]
callable = "lib.core_scans:units"
publishes = ["units"]
reads = ["repo_root", "excludes"]
stage = "read_side"
headless = { units = "registered" }
whys.units = "One score for a monorepo describes none of its services. Naming each unit lets every one be scored on its own, so one service's gaps are not hidden behind another's practices."
shapes = [
  { path = "units", type = "lib.unit_discovery:UnitsBlock" },
]
revision = 2
  [entries.privacy]
  "units.source" = "token"
  "units.unit_count_reason" = "token"
  "units.units.path" = "hashed_path"
  "units.units.kind" = "token"
  "units.units.origin" = "token"
  "units.units.ecosystem" = "token"
  "units.units.workspace" = "drop"
  "units.units.name" = "drop"
  "units.aggregators.path" = "drop"
  "units.aggregators.ecosystem" = "token"
  "units.skipped.path" = "drop"
  "units.skipped.problem" = "token"
  "units.unreadable_manifests" = "drop"
