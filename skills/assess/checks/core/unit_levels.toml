# Check manifest fragment: the unit_levels collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.unit_levels"
kind = "collector"
title = "Monorepo unit Steps"
summary = "Each unit's Step, verified tally and not-measured count from the default maturity model. Each unit's own readings are in place, and every condition is labelled unit or inherited."
issues = [800, 864]
callable = "lib.run.core_scans:unit_levels"
publishes = ["unit_levels"]
reads = ["unit_readings", "agent_consistency", "agent_environment", "agent_ops", "backlog_ready", "ci_checks", "ci_hazards", "ci_model_jobs", "contributor_files", "coverage_gate", "doc_staleness", "guardrails", "instruction_claims", "layer_grades", "nested_instructions", "observability", "promissory_markers", "review_evidence", "review_reality", "secrets_guard", "skill_disclosure", "skill_library", "skill_personal_data", "skill_script_tests", "stats_summary", "structure", "structure_drift", "test_pressure", "owner_exclusions"]
stage = "post_offers"
shapes = [
  { path = "unit_levels", type = "lib.unit_levels:UnitLevelsBlock" },
]
revision = 2
  [entries.privacy]
  "unit_levels.unit_count_reason" = "token"
  "unit_levels.levels_version" = "token"
  "unit_levels.units.path" = "hashed_path"
  "unit_levels.units.inherited" = "token"
  "unit_levels.units.conditions.id" = "token"
  "unit_levels.units.conditions.state" = "token"
  "unit_levels.units.conditions.origin" = "token"
  "unit_levels.units.conditions.reason" = "token"
  "unit_levels.units.conditions.why" = "drop"
  "unit_levels.units.next_step.blockers.kind" = "token"
  "unit_levels.units.next_step.blockers.gate" = "token"
  "unit_levels.units.next_step.blockers.condition" = "token"
  "unit_levels.units.next_step.blockers.state" = "token"
  "unit_levels.units.next_step.blockers.reason" = "token"
  "unit_levels.units.next_step.blockers.disposition" = "token"
  "unit_levels.units.next_step.blockers.exclusion_kind" = "token"
  "unit_levels.units.next_step.blockers.polarity" = "token"
