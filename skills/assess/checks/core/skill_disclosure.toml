# Check manifest fragment: the skill_disclosure collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.skill_disclosure"
kind = "collector"
title = "Skill disclosure"
summary = "Each SKILL.md and agent definition against Anthropic's skill authoring guidance: body lines, size in tokens, name and description, and references that resolve one level deep."
issues = [1045]
callable = "lib.skill_disclosure:scan_skill_disclosure"
publishes = ["skill_disclosure"]
reads = ["repo_root", "scope", "excludes"]
stage = "post_offers"
unit_scope = "scoped"
unit_kinds = ["skill"]
headless = { skill_disclosure = "registered" }
whys.skill_disclosure = "A skill loads its whole SKILL.md every time it triggers, so detail that only one branch needs spends an agent's context before work starts; keeping the body small, the description within its limit and references one level deep keeps that cost to what the task uses."
why_sources.skill_disclosure = "https://docs.claude.com/en/docs/agents-and-tools/agent-skills/best-practices"
shapes = [
  { path = "skill_disclosure", type = "lib.skill_disclosure:SkillDisclosureBlock" },
]
revision = 1
  [entries.privacy]
  "skill_disclosure.files.path" = "path"
  "skill_disclosure.files.kind" = "token"
  "skill_disclosure.files.breaks" = "token"
  "skill_disclosure.files.references.target" = "path"

[[entries]]
id = "core:skill_disclosure.files_breaking"
kind = "signal"
title = "Skill and agent files that break a disclosure rule"
collector = "core.skill_disclosure"
path = "skill_disclosure.files_breaking"
type = "number"
evidence = "head_structure"
null_means = "no_skill_files: the repository, or the skill unit, holds no SKILL.md or agent definition (files_considered 0), so there is nothing to measure"

[[entries]]
id = "core.cond.skill-disclosure.1.files_breaking"
kind = "condition"
title = "Skills load only what the task needs"
key = "skill-disclosure.1:skill_disclosure.files_breaking"
why = "A skill loads its whole SKILL.md every time it triggers, so detail that only one branch needs spends an agent's context before work starts; keeping the body small, the description within its limit and references one level deep keeps that cost to what the task uses."
why_source = "https://docs.claude.com/en/docs/agents-and-tools/agent-skills/best-practices"
fix = "For each file the report names, fix the rule it breaks: give each SKILL.md and agent definition a name and a description of at most 1024 characters, move detail only some tasks need into references/ linked from SKILL.md, and link each reference to a file that exists."
