# Check manifest fragment: the unit_rollup collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.unit_rollup"
kind = "collector"
title = "Monorepo unit roll-up"
summary = "The lowest unit's Step plus 'N of M measured units' at the next Step, and the changes that move units to their next Step, ranked by the units one change lifts, repository-wide changes first."
issues = [800, 865]
callable = "lib.core_scans:unit_rollup"
publishes = ["unit_rollup"]
reads = ["unit_levels", "maturity_model"]
stage = "post_offers"
shapes = [
  { path = "unit_rollup", type = "lib.unit_rollup:UnitRollUpBlock" },
]
revision = 1
  [entries.privacy]
  "unit_rollup.unit_count_reason" = "token"
  "unit_rollup.unlocks.gate" = "token"
  "unit_rollup.unlocks.scope" = "token"
  "unit_rollup.lines" = "drop"
  "unit_rollup.markdown" = "drop"
