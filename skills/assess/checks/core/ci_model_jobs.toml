# Check manifest fragment: the ci_model_jobs collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.ci_model_jobs"
kind = "collector"
title = "Model-backed CI jobs"
summary = "Each GitHub Actions or GitLab CI job that calls a model API. Signs are an eval harness, an agent action, the Claude Code CLI, a model-provider secret, pytest -m eval or an evals/ path. For each job, whether a gate stops it running on every push or pull request update. Gates are a paths filter, a schedule or manual trigger only, a label, or GitLab rules:changes."
issues = [1242]
callable = "lib.ci_model_jobs:scan_ci_model_jobs"
publishes = ["ci_model_jobs"]
reads = ["repo_root", "ghsync_root"]
stage = "post_offers"
headless = { ci_model_jobs = "registered" }
whys.ci_model_jobs = "A CI job that calls a model costs money on every run. If it runs on every merge and every pull request update, the cost grows with the number of changes agents make, not with changes to the prompts it tests."
shapes = [
  { path = "ci_model_jobs", type = "lib.ci_model_jobs:CiModelJobsBlock" },
]
revision = 2
unknown_reasons = [
  { code = "no_model_jobs", block = "ci_model_jobs", means = "With model_jobs at 0, no model-calling CI job was detected, so there is nothing to gate. A model call inside a script file a job runs is not read.", next_step = "Nothing to change." },
  { code = "trigger_unresolved", block = "ci_model_jobs", means = "The ungated count is null and ungated_reason holds this code. No model-backed job is ungated, but one could not be settled. Examples are an unreadable on: key, a label if: joined with ||, or a job that only names a provider secret. A GitLab merge that is not settled reads the same way.", next_step = "Nothing to change if the job is gated; a plain paths:, schedule: or label condition lets the scan read it." },
  { code = "ci_jobs_unread", block = "ci_model_jobs", means = "The ungated count is null and ungated_reason holds this code. Every model-backed job found is gated. But a job calls a reusable workflow from another repository on a route that is not gated, or a GitLab include was not read. An ungated job may sit there.", next_step = "Nothing to change: this reads as not measured until those files can be read." },
]
  [entries.privacy]
  "ci_model_jobs.ungated_reason" = "token"
  "ci_model_jobs.jobs.path" = "path"
  "ci_model_jobs.jobs.job" = "drop"
  "ci_model_jobs.jobs.platform" = "token"
  "ci_model_jobs.jobs.signs" = "token"
  "ci_model_jobs.jobs.triggers" = "token"
  "ci_model_jobs.jobs.gates" = "token"
  "ci_model_jobs.jobs.state" = "token"
  "ci_model_jobs.jobs.reason" = "token"

[[entries]]
id = "core:ci_model_jobs.ungated"
kind = "signal"
title = "Model-backed CI jobs that run on every change without a gate"
collector = "core.ci_model_jobs"
path = "ci_model_jobs.ungated"
type = "number"
evidence = "head_structure"
null_means = "trigger_unresolved or ci_jobs_unread: no model-backed job is ungated, but one could not be settled or read; no_model_jobs when model_jobs is 0"

[[entries]]
id = "core.cond.model-ci-gated.1.ungated"
kind = "condition"
title = "Model-backed CI jobs are gated"
key = "model-ci-gated.1:ci_model_jobs.ungated"
why = "A CI job that calls a model costs money on every run. If it runs on every merge and every pull request update, the cost grows with the number of changes agents make, not with changes to the prompts it tests."
fix = "Run each named job only when prompts, skills or instruction files change, or nightly, or on a label. Cancel superseded runs, sample the eval cases, and use the cheapest model that still tells good from bad. Move rule-checkable assertions into ordinary tests."
