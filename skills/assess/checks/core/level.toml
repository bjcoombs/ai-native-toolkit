# Check manifest fragment: the level collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.level"
kind = "collector"
title = "Verified tally and Step"
summary = "The conditions of the run's maturity model, each with its state, grade and reason, plus the verified tally and the autonomy Step. The model is the default, a --profile or a --levels file."
issues = [744]
callable = "lib.core_scans:level"
publishes = ["level"]
reads = ["agent_consistency", "agent_environment", "agent_ops", "ci_checks", "ci_model_jobs", "contributor_files", "coverage_gate", "doc_staleness", "guardrails", "instruction_claims", "layer_grades", "nested_instructions", "observability", "promissory_markers", "review_evidence", "review_reality", "secrets_guard", "skill_disclosure", "skill_personal_data", "skill_script_tests", "stats_summary", "structure", "structure_drift", "test_pressure", "owner_exclusions", "maturity_model", "pack"]
stage = "post_offers"
shapes = [
  { path = "level", type = "lib.scoring.level_result_types:LevelResult" },
]
revision = 1
  [entries.privacy]
  "level.levels_version" = "token"
  "level.counted" = "token"
  "level.listed" = "token"
  "level.not_measured.id" = "token"
  "level.not_measured.reason" = "token"
  "level.conditions.id" = "token"
  "level.conditions.row" = "token"
  "level.conditions.grade" = "token"
  "level.conditions.state" = "token"
  "level.conditions.reason" = "token"
  "level.conditions.polarity" = "token"
  "level.conditions.source" = "token"
  "level.conditions.why" = "drop"
  "level.next_step.blockers.kind" = "token"
  "level.next_step.blockers.gate" = "token"
  "level.next_step.blockers.condition" = "token"
  "level.next_step.blockers.state" = "token"
  "level.next_step.blockers.reason" = "token"
  "level.conditions.disposition" = "token"
  "level.conditions.exclusion_kind" = "token"
  "level.next_step.blockers.disposition" = "token"
  "level.next_step.blockers.exclusion_kind" = "token"
  "level.excluded.id" = "token"
  "level.excluded.kind" = "token"
  "level.excluded.source" = "token"
  "level.tags.tag" = "token"
  "level.tags.not_measured.id" = "token"
  "level.tags.not_measured.reason" = "token"
  "level.tags.countable_not_measured.id" = "token"
  "level.tags.countable_not_measured.reason" = "token"
