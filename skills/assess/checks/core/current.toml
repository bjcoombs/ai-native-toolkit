# Check manifest fragment: the current collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.current"
kind = "collector"
title = "Complexity stats (this run)"
callable = "lib.run.run_setup:current_stats"
publishes = []
reads = ["assess_dir"]
stage = "setup"
private = true
degrade = false
gate_reason = "setup"
revision = 2

[[entries]]
id = "core.finding.untrusted_hotspot"
kind = "finding"
title = "Untrusted hotspot"
name = "untrusted_hotspot"
why = "Complex, often-changed code whose tests let many mutants survive: an agent's change here is not held by the tests that look like they cover it."
order = 3
action = "make the tests check what the code does, as a caller sees it (not its internal state)"
mode = "characterize_first"
concern = true
inputs = ["current", "test_pressure"]
derive = "lib.testing.untrusted_hotspot:untrusted_hotspot_paths"
headless = "unregistered"

[[entries]]
id = "core.finding.self_referential_tests"
kind = "finding"
title = "Self-referential tests"
name = "self_referential_tests"
why = "Tests kept and committed beside the code they cover can check internal consistency rather than truth, so an agent changing both together can make them agree on a wrong answer."
order = 4
action = "ask a person to review: the tests check that the code agrees with itself, not that it is right"
mode = "verify_then_retire"
concern = true
inputs = ["current"]
derive = "lib.keyhole.keyhole_signals:_self_referential_test_paths"
headless = "unregistered"
