# Check manifest fragment: the agent_outcome collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.agent_outcome"
kind = "collector"
title = "Agent commit outcomes"
issues = [1085]
callable = "lib.agent_outcome:scan_agent_outcome"
publishes = ["agent_outcome"]
reads = ["repo_root", "scope", "history_window", "fleet_config"]
stage = "post_offers"
headless = { agent_outcome = "registered" }
whys.agent_outcome = "No other scan says whether agent work holds once it lands; this records the share of agent commits later reverted or rewritten within two weeks, as a history to set beside the gates. Nothing scores it."
shapes = [
  { path = "agent_outcome", type = "lib.agent_outcome:AgentOutcomeBlock" },
]
revision = 1
unknown_reasons = [
  { code = "shallow_clone", means = "The checkout is a shallow clone, so a reverting or rewriting commit may be cut from the history read.", next_step = "Nothing to change in the repository; a full clone (git fetch --unshallow) lets the scan read it." },
  { code = "shallow_unknown", means = "Git could not confirm the checkout is a full clone.", next_step = "Nothing to change in the repository; run the scan on a full clone." },
  { code = "not_a_repo", means = "The path is not a git repository, or one with no commits.", next_step = "Nothing to change: there is no history to read." },
  { code = "no_git", means = "git is not installed where the scan ran.", next_step = "Install git where the scan runs." },
  { code = "git_failed", means = "A git read past the windowed log (a patch-id, numstat or blame read) failed on a repository the log could read.", next_step = "Nothing to change in the repository; re-run the scan, and report the failure if it repeats." },
  { code = "git_timeout", means = "A git read took longer than the scan allows.", next_step = "Nothing to change in the repository; a shorter --window reads less history." },
]
  [entries.privacy]
  "agent_outcome.reason" = "reason"
  "agent_outcome.window" = "token"
  "agent_outcome.since" = "drop"
  "agent_outcome.agent_rule" = "token"
  "agent_outcome.revert_null_reason" = "token"
  "agent_outcome.rework_null_reason" = "token"
  "agent_outcome.limits" = "drop"
