# Check manifest fragment: the test_pressure collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.test_pressure"
kind = "collector"
title = "Test pressure"
callable = "lib.core_scans:test_pressure_block"
publishes = ["test_pressure"]
reads = ["test_pressure_scan"]
stage = "read_side"
degrade = false
gate_reason = "self_degrading"
headless = { test_pressure = "unregistered" }
whys.test_pressure = "Coverage says a line ran, not that a test would notice it changing; this reads mutation results and hollow-test patterns to show where tests hold the code to account."
shapes = [
  { path = "test_pressure", type = "lib.run_context_types:TestPressureBlock" },
  { path = "test_pressure", type = "lib.run_context_types:TestPressureUnavailable" },
]
revision = 1
  [entries.privacy]
  "test_pressure.reason" = "drop"
  "test_pressure.gap_signal" = "token"
  "test_pressure.mutation_note" = "drop"
  "test_pressure.mutation_tools_detected" = "token"
  "test_pressure.mutation_scope" = "path"
  "test_pressure.mutation_groups.root" = "path"
  "test_pressure.mutation_groups.config" = "token"
  "test_pressure.mutation_groups.scope" = "path"
  "test_pressure.mutation_groups.runner" = "token"
  "test_pressure.mutation_groups.unmeasured" = "path"
  "test_pressure.mutation_groups.reason" = "drop"
  "test_pressure.cheap_heuristics.confidence_note" = "drop"
  "test_pressure.cheap_heuristics.assertion_on_internal.subject_function" = "drop"
  "test_pressure.cheap_heuristics.assertion_on_internal.internal_field" = "drop"
  "test_pressure.cheap_heuristics.assertion_on_internal.confidence" = "token"
  "test_pressure.cheap_heuristics.untested_boundaries.operator" = "token"
  "test_pressure.cheap_heuristics.duplicate_truth.field_name" = "drop"
  "test_pressure.cheap_heuristics.duplicate_truth.derives_from" = "drop"
  "test_pressure.cheap_heuristics.duplicate_truth.confidence" = "token"

[[entries]]
id = "core:test_pressure.mutation_run"
kind = "signal"
title = "A mutation run completed"
collector = "core.test_pressure"
path = "test_pressure.mutation_run"
type = "bool"
evidence = "execution_artifact"

[[entries]]
id = "core.cond.layer-6-coverage.2.mutation_run"
kind = "condition"
title = "A mutation run has completed"
key = "layer-6-coverage.2:test_pressure.mutation_run"
why = "Coverage shows tests run the code; a mutation run shows whether they notice it changing. A completed run names the surviving mutants, which are the tests an agent cannot yet rely on."
fix = "Run the opt-in mutation pass to see which tests pin behaviour."
