# Check manifest fragment: the review_reality collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.review_reality"
kind = "collector"
title = "Review on merged changes"
summary = "Review and approval shares over the sampled merged changes, read through gh or glab."
callable = "lib.hosting.review_reality:review_reality_from_sample"
offline_callable = "lib.hosting.review_reality:review_reality_from_sample"
publishes = ["review_reality"]
reads = ["merged_sample", "gitlab_note_facts", "review_rules"]
stage = "read_side"
network = true
platform_pass = true
headless = { review_reality = "registered" }
whys.review_reality = "It shows how many recently merged changes had a review and an approval, which is how far a second reader reaches into what agents and people merge."
shapes = [
  { path = "review_reality", type = "lib.counts_only.block_shapes:ReviewRealityBlock" },
]
revision = 3
unknown_reasons = [
  { code = "network", means = "A headless run without --platform makes no GitHub or GitLab read.", next_step = "Run fleet or assess_signals.py with --platform, or /assess, with gh or glab signed in." },
  { code = "no_remote", means = "The repository has no GitHub or GitLab remote, so there are no merged changes to read.", next_step = "Nothing to change if the repository is local only; with a GitHub or GitLab remote, /assess and fleet --platform read its merged changes." },
]
  [entries.privacy]
  "review_reality.reason" = "drop"
  "review_reality.sequence" = "token"
  "review_reality.bot_sequence" = "token"
  "review_reality.merge_queue_source" = "token"

[[entries]]
id = "core:review_reality.reviewed_share"
kind = "signal"
title = "Share of merged changes reviewed"
collector = "core.review_reality"
path = "review_reality.reviewed_share"
type = "number"
evidence = "platform"

[[entries]]
id = "core:review_reality.approved_share"
kind = "signal"
title = "Share of merged changes approved"
collector = "core.review_reality"
path = "review_reality.approved_share"
type = "number"
evidence = "platform"

[[entries]]
id = "core.cond.layer-7-review.2.reviewed_share"
kind = "condition"
title = "Most merged changes are reviewed"
key = "layer-7-review.2:review_reality.reviewed_share"
why = "Review protects only the changes it reaches. At four in five merged changes, most of what lands, an agent's work included, has had a second reader."
fix = "Aim for a review on at least four in five merged changes."

[[entries]]
id = "core.cond.layer-7-review.2.approved_share"
kind = "condition"
title = "Half of merged changes are approved"
key = "layer-7-review.2:review_reality.approved_share"
why = "An explicit approval records that someone accepted the change, not just that it was looked at."
fix = "Approve changes explicitly when you review them."
