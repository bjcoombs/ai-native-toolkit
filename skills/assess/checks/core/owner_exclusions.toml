# Check manifest fragment: the owner_exclusions collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.owner_exclusions"
kind = "collector"
title = "Owner exclusions"
summary = "The conditions the owner excluded in .assess/config.toml [checks], each with its kind, reason and provenance, and the entries skipped with why. It also carries the agent-level opt-out in .assess/agents-declined.json, which reads the conditions it covers as declined. It carries a Copilot review opt-out read from the Copilot instruction files too, which is shown and declines no condition. A tracked hook file with a .disabled suffix declines the hook condition while no live hook counts."
issues = [910, 828, 851, 846]
callable = "lib.run.core_scans:owner_exclusions"
publishes = ["owner_exclusions"]
reads = ["repo_root"]
stage = "read_side"
degrade = false
gate_reason = "self_degrading"
headless = { owner_exclusions = "headless_variant" }
whys.owner_exclusions = "It reads the checks a repository's owners have committed as not applying to them, so the Step holds a team only to practices it has not deliberately set aside, and each exclusion stays visible and reviewable in the repository."
headless_variants = [
  { block = "owner_exclusions", callable = "lib.run.headless_static:owner_exclusions", reads = ["repo_root"], stage = "read_side" },
]
shapes = [
  { path = "owner_exclusions", type = "lib.scoring.level_result_types:OwnerExclusionsBlock" },
]
revision = 3
  [entries.privacy]
  "owner_exclusions.exclusions.id" = "token"
  "owner_exclusions.exclusions.kind" = "token"
  "owner_exclusions.exclusions.reason" = "drop"
  "owner_exclusions.exclusions.source" = "token"
  "owner_exclusions.exclusions.excluded_by" = "drop"
  "owner_exclusions.exclusions.excluded_at" = "token"
  "owner_exclusions.exclusions.version" = "token"
  "owner_exclusions.skipped.id" = "drop"
  "owner_exclusions.skipped.problem" = "token"
  "owner_exclusions.disclosures" = "drop"
  "owner_exclusions.declines.source" = "token"
  "owner_exclusions.declines.conditions" = "token"
  "owner_exclusions.declines.declined_by" = "drop"
  "owner_exclusions.declines.declined_at" = "token"
  "owner_exclusions.declines.version" = "token"
  "owner_exclusions.declines.reason" = "drop"
