# Check manifest fragment: the contributor_files collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.contributor_files"
kind = "collector"
title = "Contributor files"
summary = "A contributing guide and a security policy at the root, in .github/ or in docs/. The policy is a SECURITY file or a link to GitHub private vulnerability reporting. Issue and pull or merge request templates count as evidence."
issues = [1045]
callable = "lib.run.core_scans:contributor_files"
publishes = ["contributor_files"]
reads = ["repo_root", "archetype", "org_security_policy"]
stage = "post_offers"
headless = { contributor_files = "headless_variant" }
# Headless, archetype is itself a variant's block, so this scan runs as a variant too, after it.
headless_variants = [
  { block = "contributor_files", callable = "lib.run.headless_static:contributor_files", reads = ["repo_root", "archetype", "org_security_policy"], stage = "post_offers" },
]
whys.contributor_files = "A contributing guide tells a newcomer, human or agent, how to build, test and shape a change the way the project merges it, and a security policy gives them a private route for a vulnerability instead of a public issue."
shapes = [
  { path = "contributor_files", type = "lib.contributor_files:ContributorFilesBlock" },
]
revision = 1
unknown_reasons = [
  { code = "knowledge_base", means = "The repository is a knowledge base (archetype knowledge-base), which takes no code patches.", next_step = "Nothing to change: a contributing guide and a security policy are not measured for a knowledge base." },
  { code = "org_policy_not_read", block = "contributor_files", means = "The repository holds no security policy. The owner's shared .github repository, whose policy GitHub shows on this one, was not read. The cause is offline use, no --platform, a remote not on github.com, or gh not signed in.", next_step = "Commit a SECURITY.md, or run /assess with gh signed in (or fleet with --platform) so the owner's shared policy is read." },
]
  [entries.privacy]
  "contributor_files.reason" = "reason"
  "contributor_files.guide.path" = "path"
  "contributor_files.policy.path" = "path"
  "contributor_files.policy.kind" = "token"
  "contributor_files.policy.source" = "token"
  "contributor_files.policy.reason" = "reason"

[[entries]]
id = "core:contributor_files.guide.present"
kind = "signal"
title = "A contributing guide is committed"
collector = "core.contributor_files"
path = "contributor_files.guide.present"
type = "bool"
evidence = "head_structure"

[[entries]]
id = "core:contributor_files.policy.present"
kind = "signal"
title = "A security policy is committed or shared by the owner"
collector = "core.contributor_files"
path = "contributor_files.policy.present"
type = "bool"
evidence = "head_structure"
null_means = "org_policy_not_read: the repository holds no security policy and the owner's shared .github repository, whose policy GitHub shows, was not read"

[[entries]]
id = "core.cond.contributor-files.1.guide"
kind = "condition"
title = "A newcomer can learn how to send a change"
key = "contributor-files.1:contributor_files.guide.present"
why = "A contributing guide tells a newcomer, human or agent, how to build, test and shape a change the way the project merges it, and a security policy gives them a private route for a vulnerability instead of a public issue."
fix = "Commit a CONTRIBUTING.md that says how to build, test and shape a change, at the root, in .github/ or in docs/."

[[entries]]
id = "core.cond.contributor-files.1.policy"
kind = "condition"
title = "A newcomer can report a vulnerability privately"
key = "contributor-files.1:contributor_files.policy.present"
why = "A contributing guide tells a newcomer, human or agent, how to build, test and shape a change the way the project merges it, and a security policy gives them a private route for a vulnerability instead of a public issue."
fix = "Commit a SECURITY.md that says how to report a vulnerability privately, at the root, in .github/ or in docs/, or link GitHub private vulnerability reporting."
