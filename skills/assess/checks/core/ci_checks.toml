# Check manifest fragment: the ci_checks collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.ci_checks"
kind = "collector"
title = "CI runs a test or lint command"
summary = "Whether a GitHub Actions or GitLab CI line runs a test or lint command, whether one can fail its job on ordinary changes (not masked, not off the ordinary triggers), and whether such a line runs a linter; null when no check is found but a CI file pulls its jobs from elsewhere. Null too when no check is found and the tree tracks a CI file the scan does not parse, when under --platform most sampled merged pull requests carry an external CI check, or when a root Prow OWNERS_ALIASES is the only CI evidence."
issues = [698, 775, 782, 787, 919, 920, 928]
callable = "lib.ci_checks:scan_ci_checks"
publishes = ["ci_checks"]
reads = ["repo_root", "ghsync_root", "gitlab_merged_ci", "external_ci"]
stage = "post_offers"
platform_pass = true
headless = { ci_checks = "registered" }
shapes = [
  { path = "ci_checks", type = "lib.ci_checks:CiChecksBlock" },
]
revision = 5
unknown_reasons = [
  { code = "included_jobs", carried_in = "basis", means = "A CI file pulls its jobs from a file this checkout does not hold, so the check may live there.", next_step = "Nothing to change: this reads as not measured until the included file can be read. On GitLab, fleet --platform reads the merged configuration through the CI lint API." },
  { code = "merged_config_partial", carried_in = "basis", means = "GitLab's merged CI configuration was read and runs no check, but it may lack jobs: an include under rules: or a trigger: child pipeline is not expanded by the lint API.", next_step = "Nothing to change: a check in a conditional include or child pipeline is not read, so this stays not measured rather than reading false." },
  { code = "unknown_trigger", carried_in = "basis", means = "In enforced_basis: an unmasked check sits in a workflow or job whose triggers this reader cannot settle (no on: key, a rules: if: on a custom variable).", next_step = "Nothing to change if it runs on every change; naming push or pull_request, or a merge request rule, lets the scan read it." },
  { code = "check_target", carried_in = "basis", means = "No CI line runs the linter (lint_basis) or the check (enforced_basis), but one runs a target whose recipe is not read and may run it: make check or npm test for a linter; make foo, npm run foo or ./scripts/foo.sh for a check.", next_step = "Nothing to change if the target runs the check; calling the test or lint command in its own CI step (make test, pytest, ruff check .) lets the scan read it." },
  { code = "unread_ci_system", carried_in = "basis", means = "No readable GitHub Actions or GitLab CI line settles the signal, and the tree tracks a CI file of a system this scan does not parse (Jenkins, CircleCI, Azure Pipelines, Buildkite, LUCI, Prow, Zuul and others; the lib/unread_ci.py docstring lists the paths); unread_ci_files counts them.", next_step = "Nothing to change: the scanner cannot read those systems' configuration, so their checks read as not measured rather than absent." },
  { code = "external_ci", carried_in = "basis", means = "Under --platform only: no readable CI line settles the signal, and over half of the sampled merged pull requests carry a check run or status of a known external CI system (Buildkite, LUCI, Prow tide, Azure Pipelines). A check ran; that earns no credit.", next_step = "Nothing to change: the checks run on a CI system configured outside the repository, so they read as not measured rather than absent." },
  { code = "external_ci_marker", carried_in = "basis", means = "The tree tracks no CI file of any kind and the root holds a Prow OWNERS_ALIASES file, so presubmits likely run on Prow, configured in another repository. An OWNERS file alone is not a marker.", next_step = "Nothing to change: run with --platform to read the checks on merged pull requests instead." },
  { code = "analysers_in_build", carried_in = "basis", means = "In lint_basis: no CI line runs a linter, but a CI dotnet build runs the analysers a committed Directory.Build.props or .csproj turns on (EnforceCodeStyleInBuild, AnalysisLevel). Their severities live in .editorconfig, which the scan does not evaluate.", next_step = "Nothing to change if the analysers fail the build on a finding; a CI step running dotnet format --verify-no-changes lets the scan read a lint run." },
  { code = "compiler_gate_only", carried_in = "basis", means = "In lint_basis: no CI line runs a linter, and the only static gate is a compiler run with warnings as errors (mix compile --warnings-as-errors, -Werror, dotnet build -warnaserror, TreatWarningsAsErrors in Directory.Build.props). It is not counted as a lint run.", next_step = "Running a linter or analyser in its own CI step (mix credo, clang-tidy, dotnet format --verify-no-changes) lets the scan read a lint run." },
]
  [entries.privacy]
  "ci_checks.reason" = "drop"
  "ci_checks.basis" = "token"
  "ci_checks.enforced_basis" = "token"
  "ci_checks.lint_basis" = "token"
  "ci_checks.includes.kind" = "token"
  "ci_checks.includes.id" = "id"
  "ci_checks.includes.status" = "token"
  "ci_checks.includes.ref_basis" = "token"
  "ci_checks.merged_config" = "token"
  "ci_checks.merged_config_reason" = "token"

[[entries]]
id = "core:ci_checks.lint_runs"
kind = "signal"
title = "A CI line runs a linter on ordinary changes and can stop its job"
collector = "core.ci_checks"
path = "ci_checks.lint_runs"
type = "bool"
evidence = "ci_executed"
null_means = "included_jobs, merged_config_partial: an include may run it; unknown_trigger: unsettled; check_target: a target may; unread_ci_system: unparsed CI may; external_ci, external_ci_marker: CI elsewhere; analysers_in_build: .NET build analysers; compiler_gate_only: only warnings as errors"

[[entries]]
id = "core:ci_checks.enforced_check_runs"
kind = "signal"
title = "A CI check runs on ordinary changes and can stop its job"
collector = "core.ci_checks"
path = "ci_checks.enforced_check_runs"
type = "bool"
evidence = "ci_executed"
null_means = "included_jobs: it may be in an included file; unknown_trigger: its triggers are not settled; check_target: an unread target may run it; unread_ci_system: an unparsed CI system may run it; external_ci: merged changes carry external CI checks; external_ci_marker: a root Prow OWNERS_ALIASES, no CI file"

[[entries]]
id = "core.cond.layer-3-linters.1.lint_runs"
kind = "condition"
title = "CI runs a linter or type checker"
key = "layer-3-linters.1:ci_checks.lint_runs"
fix = "Add a CI step that runs your linter (ruff check ., eslint, mypy, make lint) on pull requests, without || true, continue-on-error or allow_failure."

[[entries]]
id = "core.cond.layer-5-ci.1.enforced_check_runs"
kind = "condition"
title = "CI runs your tests or linters, and an error stops the job"
key = "layer-5-ci.1:ci_checks.enforced_check_runs"
fix = "Add a CI step that runs your test or lint command on pull requests, without || true, continue-on-error or allow_failure."
