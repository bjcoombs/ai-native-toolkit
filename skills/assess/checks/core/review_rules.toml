# Check manifest fragment: the review_rules collector (evidence only, no condition of its own).
# Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.review_rules"
kind = "collector"
title = "Merge and review rules kept as code"
summary = "Merge and review rules a repository commits outside branch protection. It reads a merge queue, a policy-bot policy, Prow OWNERS files and a committed ruleset that requires review. It also reads a review guide folder that a pull request workflow names. Each file is parsed, not matched as text. OWNERS files that name one owner for everything do not count. Evidence only: it adds an evidence line to the review condition while that condition is met."
issues = [856]
callable = "lib.ci.review_rules:rules_or_unknown"
publishes = ["review_rules"]
reads = ["repo_root"]
stage = "read_side"
headless = { review_rules = "registered" }
whys.review_rules = "A rule kept as code is a rule an agent can read before it opens a change, and a reviewer can check it against the code. A merge queue, an approval policy or an owners file says who must look at a change before it lands."
shapes = [
  { path = "review_rules", type = "lib.run_context_types_review_rules:ReviewRulesBlock" },
]
revision = 1
  [entries.privacy]
  "review_rules.reason" = "drop"
  "review_rules.arms" = "token"
  "review_rules.rules.arm" = "token"
  "review_rules.rules.path" = "path"
  "review_rules.unsettled" = "path"
