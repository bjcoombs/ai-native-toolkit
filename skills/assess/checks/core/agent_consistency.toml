# Check manifest fragment: the agent_consistency collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.agent_consistency"
kind = "collector"
title = "Cross-agent instruction consistency"
summary = "Compares the root instruction files of every agent system present: Claude Code, AGENTS.md, Copilot, Cursor, Windsurf, Cline, Aider, Junie, Amazon Q, Kiro, Continue and Zed. It finds check commands one file names and another does not, and thresholds that conflict. It checks whether each file links to one canonical file, and gives the pointer line for each system that does not."
issues = [768]
callable = "lib.instructions.agent_consistency:scan_agent_consistency"
publishes = ["agent_consistency"]
reads = ["repo_root", "excludes"]
stage = "post_offers"
headless = { agent_consistency = "registered" }
whys.agent_consistency = "It compares the instruction files of every agent system present, so each agent is told the same checks and thresholds, from one source."
shapes = [
  { path = "agent_consistency", type = "lib.instructions.agent_consistency:AgentConsistencyBlock" },
]
revision = 2
  [entries.privacy]
  "agent_consistency.systems" = "token"
  "agent_consistency.conflicts_reason" = "token"
  "agent_consistency.unlinked_reason" = "token"
  "agent_consistency.canonical" = "path"
  "agent_consistency.files.path" = "path"
  "agent_consistency.files.system" = "token"
  "agent_consistency.files.link" = "token"
  "agent_consistency.divergences.kind" = "token"
  "agent_consistency.divergences.value" = "drop"
  "agent_consistency.divergences.named_in" = "token"
  "agent_consistency.divergences.missing_from" = "token"
  "agent_consistency.divergences.stated.system" = "token"
  "agent_consistency.next_steps.system" = "token"
  "agent_consistency.next_steps.path" = "path"
  "agent_consistency.next_steps.pointer" = "drop"
  "agent_consistency.next_steps.symlink" = "drop"
  "agent_consistency.not_read" = "drop"

[[entries]]
id = "core:agent_consistency.conflicts"
kind = "signal"
title = "Commands and thresholds the agent systems disagree on"
collector = "core.agent_consistency"
path = "agent_consistency.conflicts"
type = "number"
evidence = "head_structure"
null_means = "fewer than two agent systems: nothing to agree with; conflicts_reason fewer_than_two_systems reads the condition not applicable"

[[entries]]
id = "core:agent_consistency.unlinked"
kind = "signal"
title = "Agent systems not linked to the canonical instruction file"
collector = "core.agent_consistency"
path = "agent_consistency.unlinked"
type = "number"
evidence = "head_structure"
null_means = "fewer than two agent systems: nothing to link; unlinked_reason fewer_than_two_systems reads the condition not applicable"

[[entries]]
id = "core.cond.agent-consistency.1.conflicts"
kind = "condition"
title = "Every agent system names the same checks"
key = "agent-consistency.1:agent_consistency.conflicts"
why = "When agent systems are told different check commands or thresholds, one agent's change passes checks another agent was told to run differently."
fix = "Make the instruction files agree. Name the same test and lint commands and the same thresholds in each. Or replace each tool's file with the pointer line the report gives."

[[entries]]
id = "core.cond.agent-consistency.2.unlinked"
kind = "condition"
title = "Every agent system reads one canonical file"
key = "agent-consistency.2:agent_consistency.unlinked"
why = "One source of instructions keeps every agent's picture of the repository the same, and keeps it maintained in one place."
fix = "Keep AGENTS.md as the one source. Make each other tool's file a short pointer or a symlink to it, with the exact line the report gives for that tool."
