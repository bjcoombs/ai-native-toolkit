# Check manifest fragment: the gap_actions collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.gap_actions"
kind = "collector"
title = "Gap actions"
callable = "lib.run.core_scans:gap_actions"
publishes = ["gap_actions"]
reads = ["coverage_report", "doc_graph", "current", "archetype", "layer_grades", "nested_instructions", "instruction_placement"]
stage = "post_offers"
headless = { gap_actions = "unregistered" }
whys.gap_actions = "exempt: plumbing"
shapes = [
  { path = "gap_actions", type = "lib.report.gap_actions:GapAction" },
]
revision = 3
  [entries.privacy]
  "gap_actions.signal" = "token"
  "gap_actions.action" = "drop"
  "gap_actions.why" = "drop"
  "gap_actions.paths" = "path"
  "gap_actions.finding" = "token"
  "gap_actions.mode" = "token"
  "gap_actions.cost.metric" = "token"
  "gap_actions.cost.path" = "path"
