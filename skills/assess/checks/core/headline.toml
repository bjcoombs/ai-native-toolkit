# Check manifest fragment: the headline collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.headline"
kind = "collector"
title = "Deterministic headline"
summary = "The top card that opens the report states each fact once. It gives the Step, the gates held and the gate that blocks the next Step. Then it gives what moved since the last run, and one Start here and Done when from the first open action. It also gives the conditions not measured and the per-tag strip. The report pastes it. The badge and the log entry carry its summary, which names the next gate and no count."
issues = [747, 844, 1083, 1102, 1252]
callable = "lib.core_scans:headline"
publishes = ["headline"]
reads = ["level", "since_last_run", "maturity_model", "unit_rollup", "measured_commit", "assess_dir"]
stage = "post_offers"
shapes = [
  { path = "headline", type = "lib.scoring.level_result_types:Headline" },
]
revision = 4
  [entries.privacy]
  "headline.levels_version" = "token"
  "headline.lines" = "drop"
  "headline.markdown" = "drop"
  "headline.summary" = "drop"
  "headline.next_why" = "drop"
  "headline.summary_lines" = "drop"
  "headline.call_to_action" = "drop"
  "headline.summary_markdown" = "drop"
  "headline.reason" = "token"
  "headline.tags.tag" = "token"
