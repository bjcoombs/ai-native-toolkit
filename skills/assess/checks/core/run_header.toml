# Check manifest fragment: the run_header collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.run_header"
kind = "collector"
title = "Run header"
callable = "lib.run.run_setup:run_header"
publishes = ["run_id", "artifact_schema_version", "assess_method_version", "run_date", "scope", "scope_slug", "measured_commit", "prior_stats_exists", "stats_summary", "instruction_files", "instructions_grade", "diff", "diff_reliable", "diff_version_note", "diff_trend_reset", "prior_plugin_version", "schema_version", "prior_schema_version", "tool_versions", "prior_tool_versions", "diff_detail", "pruned_hotspots", "retired_excluded_hotspots", "dropped_first_flagged", "provisional_first_flagged", "log_integrity", "prior_findings_snapshot", "prior_level"]
reads = ["run_id", "run_date", "run_scope", "measured_commit", "current", "prior", "instruction_grading", "diff", "unfinalized"]
stage = "setup"
unit_scope = "scoped"
spread = true
degrade = false
gate_reason = "setup"
headless = { stats_summary = "headless_variant", diff = "unregistered" }
whys.stats_summary = "It summarises file size and complexity across the repository; the 95th-percentile file size is what decides whether an agent can read a file whole."
whys.diff = "exempt: plumbing"
headless_variants = [
  { block = "stats_summary", callable = "lib.run.headless_layers:stats_summary", reads = ["repo_root", "excludes", "scope"], stage = "read_side" },
]
shapes = [
  { path = "stats_summary.fn_ccn", type = "lib.run_context_types:FnCcnBlock" },
  { path = "stats_summary.top_hotspots", type = "lib.run_context_types:HotspotRow" },
  { path = "stats_summary.top_complex", type = "lib.run_context_types:HotspotRow" },
  { path = "stats_summary.top_large", type = "lib.run_context_types:HotspotRow" },
  { path = "stats_summary.complexity_unreliable", type = "lib.complexity.scc_coverage:UnreliableCcnRow" },
  { path = "prior_findings_snapshot", type = "lib.run_context_types:FindingsSnapshot" },
  { path = "prior_level", type = "lib.prior_level:PriorLevelBlock" },
  { path = "stats_summary.loc", type = "lib.run_context_types:SizeBlock" },
  { path = "stats_summary.est_tokens", type = "lib.run_context_types:SizeBlock" },
  { path = "stats_summary.loc_by_class", type = "lib.run_context_types_size:LocByClass" },
  { path = "stats_summary.est_tokens.budget", type = "lib.run_context_types:KeyholeBudget" },
]
revision = 1
  [entries.privacy]
  run_id = "token"
  artifact_schema_version = "token"
  schema_version = "token"
  prior_schema_version = "token"
  prior_plugin_version = "token"
  run_date = "token"
  scope = "path"
  scope_slug = "path"
  "tool_versions.*" = "token"
  "prior_tool_versions.*" = "token"
  diff_version_note = "drop"
  "measured_commit.committed_date" = "token"
  "measured_commit.head_sha" = "drop"
  "measured_commit.head_short" = "drop"
  "measured_commit.subject" = "drop"
  "measured_commit.upstream" = "drop"
  "stats_summary.ccn.basis" = "token"
  "stats_summary.fn_ccn.basis" = "token"
  "stats_summary.fn_ccn.source.name" = "token"
  "stats_summary.fn_ccn.backend_by_language.*" = "token"
  "stats_summary.est_tokens.budget.budget_basis" = "drop"
  "stats_summary.top_hotspots.ccn_basis" = "token"
  "stats_summary.top_hotspots.source" = "token"
  "stats_summary.top_hotspots.max_fn_name" = "drop"
  "stats_summary.top_complex.ccn_basis" = "token"
  "stats_summary.top_complex.source" = "token"
  "stats_summary.top_complex.max_fn_name" = "drop"
  "stats_summary.top_large.ccn_basis" = "token"
  "stats_summary.top_large.source" = "token"
  "stats_summary.top_large.max_fn_name" = "drop"
  "stats_summary.complexity_unreliable.path" = "path"
  "stats_summary.complexity_unreliable.language" = "token"
  pruned_hotspots = "path"
  retired_excluded_hotspots = "path"
  dropped_first_flagged = "path"
  provisional_first_flagged = "path"
  instructions_grade = "token"
  "instruction_files.{}.grade" = "token"
  "instruction_files.{}.findings.kind" = "token"
  "instruction_files.{}.findings.reference" = "drop"
  "instruction_files.{}.findings.reason" = "drop"
  "prior_findings_snapshot.findings.name" = "token"
  "prior_findings_snapshot.findings.paths" = "path"
  "prior_level.levels_version" = "token"
  "prior_level.tags.tag" = "token"
  "prior_level.tags.not_measured.id" = "token"
  "prior_level.tags.not_measured.reason" = "token"
  "prior_level.tags.countable_not_measured.id" = "token"
  "prior_level.tags.countable_not_measured.reason" = "token"
  "prior_level.reason" = "token"
  "prior_level.baseline.run_id" = "token"
  "prior_level.baseline.head_sha" = "token"
  "prior_level.baseline.held_gates" = "token"
  "prior_level.pruning.path" = "path"
  "prior_level.pruning.completed_sha" = "token"
  "prior_level.pruning.gates" = "token"
  "prior_level.pruning.credited_at" = "token"
  "prior_level.pruning.merged" = "token"
  "prior_level.models.*.levels_version" = "token"
  "prior_level.models.*.tags.tag" = "token"
  "prior_level.models.*.tags.not_measured.id" = "token"
  "prior_level.models.*.tags.not_measured.reason" = "token"
  "prior_level.models.*.tags.countable_not_measured.id" = "token"
  "prior_level.models.*.tags.countable_not_measured.reason" = "token"
  "prior_level.models.*.baseline.run_id" = "token"
  "prior_level.models.*.baseline.head_sha" = "token"
  "prior_level.models.*.baseline.held_gates" = "token"
  "prior_level.models.*.packs.name" = "token"
  "prior_level.models.*.packs.version" = "token"
  "prior_level.models.*.packs.sha256" = "id"

[[entries]]
id = "core:stats_summary.loc_by_class.source.p95"
kind = "signal"
title = "Production source file size at the 95th percentile"
collector = "core.run_header"
path = "stats_summary.loc_by_class.source.p95"
type = "number"
evidence = "head_structure"

[[entries]]
id = "core.cond.layer-4-architecture.2.p95"
kind = "condition"
title = "95% of production source files are 500 lines or fewer"
key = "layer-4-architecture.2:stats_summary.loc_by_class.source.p95"
why = "With nearly all source files at 500 lines or fewer, an agent can read a whole file before editing it, rather than a slice. Tests and fixtures are counted apart, so many small ones cannot hide a large source file. Generated-header files are left out; Elixir @moduledoc and @doc lines do not count."
fix = "Split the largest files along their natural seams."
