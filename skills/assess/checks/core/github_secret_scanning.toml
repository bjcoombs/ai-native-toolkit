# Check manifest fragment: the github_secret_scanning collector. Layout and merge order:
# skills/assess/checks/core.toml.

[[entries]]
id = "core.github_secret_scanning"
kind = "collector"
title = "GitHub secret scanning"
summary = "GitHub's own secret scanning and push protection settings, read through gh. They are returned only to a repository admin, organization owner or security manager."
issues = [1173]
callable = "lib.hosting.github_secret_scanning:scan_github_secret_scanning"
publishes = ["github_secret_scanning"]
reads = ["repo_root"]
stage = "read_side"
network = true
platform_pass = true
headless = { github_secret_scanning = "registered" }
whys.github_secret_scanning = "A token committed once stays in the history of every clone; a guard that scans each change before it lands is the check that stops an agent or a newcomer from leaking one."
shapes = [
  { path = "github_secret_scanning", type = "lib.hosting.github_secret_scanning:GithubSecretScanningBlock" },
]
revision = 1
unknown_reasons = [
  { code = "settings_not_readable", block = "github_secret_scanning", means = "Only a repository admin, organization owner or security manager can read GitHub's secret scanning and push protection settings.", next_step = "Run /assess with gh signed in as a repository admin, organization owner or security manager, or add a secrets scan to CI." },
]
  [entries.privacy]
  "github_secret_scanning.reason" = "reason"
