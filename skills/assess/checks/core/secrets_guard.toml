# Check manifest fragment: the secrets_guard collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.secrets_guard"
kind = "collector"
title = "Secrets guard"
summary = "A secrets hook in the pre-commit config and a secrets scan in CI, such as gitleaks, trufflehog or GitLab Secret-Detection. Each is recorded with its own evidence grade."
issues = [1173]
callable = "lib.secrets_guard:scan_secrets_guard"
publishes = ["secrets_guard"]
reads = ["repo_root", "scope", "ghsync_root"]
stage = "read_side"
headless = { secrets_guard = "registered" }
whys.secrets_guard = "A token committed once stays in the history of every clone; a guard that scans each change before it lands is the check that stops an agent or a newcomer from leaking one."
shapes = [
  { path = "secrets_guard", type = "lib.secrets_guard:SecretsGuardBlock" },
]
revision = 1
unknown_reasons = [
  { code = "secret_scanning_not_read", block = "secrets_guard", means = "No secrets scan runs in CI, and the repository is on GitHub, whose own secret scanning and push protection were not read.", next_step = "Add a secrets scan step to CI (gitleaks or trufflehog); GitHub's own settings are not read yet." },
  { code = "ci_includes_unresolved", block = "secrets_guard", means = "No secrets scan was found in the CI read. A GitLab include that could hold one, a local, project or remote file, was not read.", next_step = "Clone the included project beside this one (/ghsync), or add the secrets scan to the repository's own .gitlab-ci.yml." },
]
  [entries.privacy]
  "secrets_guard.pre_commit.file" = "path"
  "secrets_guard.pre_commit.tools" = "token"
  "secrets_guard.ci.files" = "path"
  "secrets_guard.ci.tools" = "token"
  "secrets_guard.enforcement.reason" = "reason"
  "secrets_guard.enforcement.source" = "token"
  "secrets_guard.sources.source" = "token"
  "secrets_guard.sources.grade" = "token"

[[entries]]
id = "core:secrets_guard.configured"
kind = "signal"
title = "A secrets guard is configured (pre-commit hook or CI scan)"
collector = "core.secrets_guard"
path = "secrets_guard.configured"
type = "bool"
evidence = "config_text"

[[entries]]
id = "core:secrets_guard.enforcement.present"
kind = "signal"
title = "A secrets scan runs where an agent cannot skip it (CI)"
collector = "core.secrets_guard"
path = "secrets_guard.enforcement.present"
type = "bool"
evidence = "head_structure"
null_means = "secret_scanning_not_read: no secrets scan in CI on a GitHub repository whose own secret scanning was not read; ci_includes_unresolved: no secrets scan in the CI read, and a GitLab include that could hold one was not read"

[[entries]]
id = "core.cond.secrets-guard.1.configured"
kind = "condition"
title = "A secrets guard is configured (a pre-commit hook counts; listed, not counted)"
key = "secrets-guard.1:secrets_guard.configured"
why = "A token committed once stays in the history of every clone; a guard that scans each change before it lands is the check that stops an agent or a newcomer from leaking one."
fix = "Add a secrets hook to .pre-commit-config.yaml (gitleaks or detect-secrets), or a secrets scan step to CI."

[[entries]]
id = "core.cond.secrets-guard.2.enforcement"
kind = "condition"
title = "A secrets scan runs where an agent cannot skip it"
key = "secrets-guard.2:secrets_guard.enforcement.present"
why = "A token committed once stays in the history of every clone; a guard that scans each change before it lands is the check that stops an agent or a newcomer from leaking one."
fix = "Add a secrets scan step to CI that runs on every change (gitleaks/gitleaks-action, trufflehog, or GitLab's Secret-Detection template); a pre-commit hook alone can be skipped with --no-verify."
