# Check manifest fragment: the stale_hubs collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.stale_hubs"
kind = "collector"
title = "Stale doc hubs"
callable = "lib.core_scans:stale_hubs"
publishes = ["stale_hubs"]
reads = ["doc_graph", "doc_staleness"]
stage = "read_side"
shapes = [
  { path = "stale_hubs", type = "lib.doc_staleness:DocStalenessRow" },
]
revision = 1
  [entries.privacy]
  "stale_hubs.subject_method" = "token"
  "stale_hubs.subject_roots" = "path"
  "stale_hubs.subject_paths" = "path"
  "stale_hubs.base_doc_dir" = "path"
  "stale_hubs.confidence" = "token"
  "stale_hubs.last_change_basis" = "token"
  "stale_hubs.last_commit_days_bound" = "token"
  "stale_hubs.provenance.method" = "token"
  "stale_hubs.provenance.sources" = "path"
  "stale_hubs.provenance.generated_by" = "drop"
