# Check manifest fragment: the archetype collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.archetype"
kind = "collector"
title = "Repository archetype"
callable = "lib.run.core_scans:archetype"
publishes = ["archetype"]
reads = ["repo_root"]
stage = "read_side"
headless = { archetype = "headless_variant" }
whys.archetype = "It tells a documentation repository from a software one, so the report does not ask a repository with no code for tests and CI on code it does not hold."
headless_variants = [
  { block = "archetype", callable = "lib.run.headless_static:archetype", reads = ["repo_root"], stage = "read_side" },
]
revision = 1
  [entries.privacy]
  "archetype.archetype" = "token"
  "archetype.detected_via" = "token"
  "archetype.reason" = "drop"
  "archetype.kb_maintenance.gist" = "drop"

[[entries]]
id = "core.finding.override_contradicts_signals"
kind = "finding"
title = "Archetype override contradicts the signals"
name = "override_contradicts_signals"
why = "The declared repository kind decides which checks apply; when the signals disagree, checks marked not applicable may hide gaps an agent would meet."
order = 9
action = "Review the archetype marker: the measured signals suggest a different kind of repository"
mode = "characterize_first"
concern = true
inputs = ["archetype"]
derive = "lib.keyhole.keyhole_signals:_override_contradiction_paths"
headless = "unregistered"
