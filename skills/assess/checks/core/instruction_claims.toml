# Check manifest fragment: the instruction_claims collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.instruction_claims"
kind = "collector"
title = "Instruction claims"
callable = "lib.instructions.instruction_claims:scan_instruction_claims"
publishes = ["instruction_claims"]
reads = ["repo_root", "instruction_files"]
stage = "post_offers"
headless = { instruction_claims = "registered" }
whys.instruction_claims = "An agent trusts its instruction file without checking it. This checks each claim that a script runs in CI, a version is pinned or a count holds, and names the line of each that no longer does."
shapes = [
  { path = "instruction_claims", type = "lib.counts_only.block_shapes:InstructionClaimsBlock" },
]
revision = 1
  [entries.privacy]
  "instruction_claims.failures.kind" = "token"
  "instruction_claims.failures.version" = "drop"
  "instruction_claims.failures.reason" = "drop"

[[entries]]
id = "core:instruction_claims.failed"
kind = "signal"
title = "Instruction claims that do not hold"
collector = "core.instruction_claims"
path = "instruction_claims.failed"
type = "number"
evidence = "head_structure"
null_means = "no_instruction_claims: the instruction files make no claim this check reads (instruction_claims.total 0), so there is nothing to hold"

[[entries]]
id = "core.cond.layer-0-instructions.2.failed"
kind = "condition"
title = "Every checkable instruction claim holds"
key = "layer-0-instructions.2:instruction_claims.failed"
why = "An agent takes its instructions literally. A line saying a script runs in CI, or a version is pinned, that is no longer true sends it the wrong way with full confidence."
fix = "Update the instruction lines whose claims no longer match the repository."
