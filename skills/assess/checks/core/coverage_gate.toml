# Check manifest fragment: the coverage_gate collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.coverage_gate"
kind = "collector"
title = "Coverage gate"
summary = "Finds coverage thresholds written in CI, task-runner and tool config, each with its file, line and threshold."
issues = [488]
callable = "lib.testing.coverage_gate:detect_coverage_gate"
publishes = ["coverage_gate"]
reads = ["repo_root", "scope", "excludes"]
stage = "read_side"
unit_scope = "override"
headless = { coverage_gate = "registered" }
whys.coverage_gate = "It finds the coverage threshold the repository sets and whether CI enforces it, which is the line that keeps tests from thinning out under a run of changes."
shapes = [
  { path = "coverage_gate", type = "lib.testing.coverage_gate:CoverageGateBlock" },
]
revision = 6
unknown_reasons = [
  { code = "go_rust_gate_form_not_read", carried_in = "unmeasured_reason", means = "The repository holds a go.mod or Cargo.toml with no coverage gate found for it. No gate of at least 50 percent exists for another language either (a low Python gate beside go.mod is not unmet). Its gate may be a script that compares go tool cover to a number, which this scan does not read.", next_step = "Nothing to change if a script gates coverage. To have it measured, set the threshold in go-test-coverage's .testcoverage.yml, cargo tarpaulin --fail-under or cargo llvm-cov --fail-under-lines." },
  { code = "codecov_target_not_read", carried_in = "unmeasured_reason", means = "The only coverage gate that could reach 50 percent is a Codecov project status. Its target is auto, missing (Codecov's default is auto) or not a number. So the floor it holds is the base commit's coverage, not a number this scan can compare.", next_step = "To have the coverage gate measured, run a coverage threshold of at least 50 percent in a CI step, such as pytest --cov --cov-fail-under=80. A numeric Codecov target (target: 80%) makes the threshold readable. Whether branch protection requires the status is not read." },
  { code = "codecov_patch_only", carried_in = "unmeasured_reason", means = "The only coverage gate that could reach 50 percent is a Codecov patch status. It bounds coverage of the changed lines only, and removing a test changes none, so it says nothing about the floor on total coverage.", next_step = "To have the coverage gate measured, run a coverage threshold of at least 50 percent in a CI step. Examples are pytest --cov --cov-fail-under=80, or a fail_under your CI runs. Or add a numeric target to a Codecov project status." },
  { code = "status_check_unconfirmed", carried_in = "enforced_basis", means = "The coverage gate of at least 50 percent is a Codecov status target, and no CI line runs it. Codecov posts it as a commit status. It holds a merge only when branch protection requires it, and this scan does not read branch protection.", next_step = "Nothing to change if the Codecov status is a required check. To have the coverage gate measured, also run the threshold in a CI step (pytest --cov --cov-fail-under=80)." },
  { code = "root_coverage_config_unresolved", carried_in = "unmeasured_reason", means = "A scoped run found a fail_under in the root coverage.py config for a Python package with none of its own, not where CI runs coverage. coverage.py reads the config of the directory it runs in. So the root floor counts only when CI runs coverage from the root or names that config.", next_step = "Run coverage in CI from the repository root (pytest --cov, coverage report), or pass the root config with --cov-config or --rcfile; or give the package its own fail_under and run coverage from its directory or with --cov-config naming that config." },
]
  [entries.privacy]
  "coverage_gate.gates.tool" = "token"
  "coverage_gate.gates.form" = "drop"
  "coverage_gate.gates.unit" = "token"
  "coverage_gate.gates.metric" = "token"
  "coverage_gate.unmeasured_reason" = "token"
  "coverage_gate.enforced_basis" = "token"
  "coverage_gate.not_detected" = "drop"

[[entries]]
id = "core:coverage_gate.enforced_meets_minimum"
kind = "signal"
title = "CI runs a coverage gate of at least 50 percent"
collector = "core.coverage_gate"
path = "coverage_gate.enforced_meets_minimum"
type = "bool"
evidence = "ci_executed"
null_means = "threshold_not_read: threshold unknown; unknown_trigger: triggers unsettled; check_may_pass: may not fail its job; indirect_run: make test or tox may run it; included_jobs: in an included file; unread_ci_system: unparsed CI may run it; status_check_unconfirmed: a Codecov status that may be optional"

[[entries]]
id = "core.cond.layer-6-coverage.1.enforced_meets_minimum"
kind = "condition"
title = "CI runs a coverage gate of at least 50 percent"
key = "layer-6-coverage.1:coverage_gate.enforced_meets_minimum"
why = "An enforced floor turns the job red when a change takes coverage below it, so tests an agent removes or skips show in CI instead of passing quietly."
fix = "Set a fail_under (or your tool's threshold) of at least 50 percent, written as a number, near your current coverage. Run the coverage check in a CI step on pull requests (pytest --cov, not plain pytest), without || true or continue-on-error. Then CI keeps coverage at the level you have reached."
