# Check manifest fragment: the guardrails collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.guardrails"
kind = "collector"
title = "Guardrails stated"
summary = "Lists the gates the repository configures (a ruff or flake8 complexity limit, the coverage floor, pre-commit hooks, mypy strict) and whether a graded instruction file states each one's rule and threshold; an unstated gate carries a ready one-line snippet."
issues = [767]
callable = "lib.guardrails:scan_guardrails"
publishes = ["guardrails"]
reads = ["repo_root", "instruction_files", "coverage_gate", "excludes", "scope"]
stage = "post_offers"
headless = { guardrails = "registered" }
whys.guardrails = "It lists the gates the repository configures and whether an instruction file states each rule and threshold, so an agent learns a gate before CI turns red on it."
shapes = [
  { path = "guardrails", type = "lib.guardrails:GuardrailsBlock" },
]
revision = 2
  [entries.privacy]
  "guardrails.gates.kind" = "token"
  "guardrails.gates.tool" = "token"
  "guardrails.gates.rule" = "token"
  "guardrails.gates.stated_in" = "path"
  "guardrails.gates.snippet" = "drop"
  "guardrails.not_read" = "drop"

[[entries]]
id = "core:guardrails.stated_pct"
kind = "signal"
title = "Share of configured gates an instruction file states"
collector = "core.guardrails"
path = "guardrails.stated_pct"
type = "number"
evidence = "head_structure"
null_means = "no gate found in the run (the scope, on a scoped run): nothing to state"

[[entries]]
id = "core.cond.guardrails-stated.1.stated_pct"
kind = "condition"
title = "Half the configured gates are stated"
key = "guardrails-stated.1:guardrails.stated_pct"
why = "A gate an agent does not know about turns its job red after the work is done. Stated with its threshold, the gate is a constraint it can plan for."
fix = "Add the ready one-line snippet the report gives for each unstated gate to CLAUDE.md or AGENTS.md, so the next session knows the rule before it runs into it."

[[entries]]
id = "core.cond.guardrails-stated.2.stated_pct"
kind = "condition"
title = "Every configured gate is stated"
key = "guardrails-stated.2:guardrails.stated_pct"
why = "With every configured gate written down, rule and threshold, an agent can check each one before it pushes."
fix = "Add the remaining snippets the report gives, one line per gate: its rule, its threshold and the command that checks it before pushing."
