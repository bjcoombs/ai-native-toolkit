# Check manifest fragment: the doc_staleness collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.doc_staleness"
kind = "collector"
title = "Doc staleness"
summary = "Each doc's last content change against its code subject's churn, following renames."
callable = "lib.run.core_scans:doc_staleness"
publishes = ["doc_staleness"]
reads = ["repo_root", "doc_graph", "excludes", "scope"]
stage = "read_side"
unit_scope = "scoped"
headless = { doc_staleness = "headless_variant" }
whys.doc_staleness = "It compares each doc's last change with the churn in the code it describes, so a doc whose code moved on is found before an agent relies on it."
headless_variants = [
  { block = "doc_staleness", callable = "lib.run.headless_static:doc_staleness", reads = ["repo_root", "doc_graph", "excludes"], stage = "read_side" },
]
shapes = [
  { path = "doc_staleness", type = "lib.docs.doc_staleness:DocStalenessBlock" },
]
revision = 2
  [entries.privacy]
  "doc_staleness.churn_window" = "drop"
  "doc_staleness.docs.subject_method" = "token"
  "doc_staleness.docs.subject_roots" = "path"
  "doc_staleness.docs.subject_match" = "token"
  "doc_staleness.docs.subject_paths" = "path"
  "doc_staleness.docs.base_doc_dir" = "path"
  "doc_staleness.docs.confidence" = "token"
  "doc_staleness.docs.last_change_basis" = "token"
  "doc_staleness.docs.last_commit_days_bound" = "token"
  "doc_staleness.history_boundary_date" = "token"
  "doc_staleness.docs.provenance.method" = "token"
  "doc_staleness.docs.provenance.sources" = "path"
  "doc_staleness.docs.provenance.generated_by" = "drop"
  "doc_staleness.bulk_commits_skipped.sha" = "drop"
  "doc_staleness.bulk_commits_skipped.date" = "token"
  "doc_staleness.declared_cross_repo.path" = "path"
  "doc_staleness.declared_cross_repo.repo" = "id"
  "doc_staleness.declared_cross_repo.scope" = "path"
  "doc_staleness.declared_cross_repo.status" = "token"
  "doc_staleness.declared_cross_repo.reason" = "token"
  "doc_staleness.summary.stale_pct_reason" = "token"
  "doc_staleness.normalisation.base_doc_subject" = "token"
  "doc_staleness.normalisation.rename_scope" = "token"

[[entries]]
id = "core:doc_staleness.summary.stale_pct"
kind = "signal"
title = "Share of mapped docs outrun by their code"
collector = "core.doc_staleness"
path = "doc_staleness.summary.stale_pct"
type = "number"
evidence = "git_history"
null_means = "a shallow or degenerate history, no git work tree, no mapped doc, or fewer than 20 measured docs (stale_pct_reason too_few_measured_docs)"

[[entries]]
id = "core.cond.doc-freshness.1.stale_pct"
kind = "condition"
title = "Most mapped docs keep pace with their code"
key = "doc-freshness.1:doc_staleness.summary.stale_pct"
why = "An agent reads the docs as true. A doc whose code has moved on misleads it about that code."
fix = "Refresh the docs the report lists under doc freshness."

[[entries]]
id = "core.cond.doc-freshness.2.stale_pct"
kind = "condition"
title = "Four in five mapped docs keep pace"
key = "doc-freshness.2:doc_staleness.summary.stale_pct"
why = "With four in five mapped docs keeping pace with their code, an agent can take most of what it reads at its word."
fix = "Refresh the docs the report lists under doc freshness, oldest first."
