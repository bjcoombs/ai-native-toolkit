# Check manifest fragment: the promissory collector and the signals, conditions and
# findings it owns. Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.promissory"
kind = "collector"
title = "Promissory marker scan"
callable = "lib.run.core_scans:promissory_scan"
publishes = []
reads = ["repo_root", "excludes", "scope"]
stage = "setup"
unit_scope = "scoped"
private = true
label = "promissory_markers"
revision = 1

[[entries]]
id = "core.finding.unactioned_intent"
kind = "finding"
title = "Unactioned intent"
name = "unactioned_intent"
why = "A TODO or skip that survives many edits reads to an agent as a live plan or a settled exception, and it cannot tell which."
order = 5
action = "keep the promise: fix it, open a ticket for it, or delete the marker or skip"
mode = "verify_then_retire"
concern = true
inputs = ["promissory"]
derive = "lib.keyhole.keyhole_signals:_unactioned_intent_paths"
headless = "unregistered"
