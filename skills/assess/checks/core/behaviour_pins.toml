# Check manifest fragment: the behaviour_pins collector (evidence only, no condition of its own).
# Layout and merge order: skills/assess/checks/core.toml.

[[entries]]
id = "core.behaviour_pins"
kind = "collector"
title = "Tests that pin behaviour beyond coverage"
summary = "Test practices that pin behaviour beyond line coverage, each read from a dependency declaration or a test signature: scheduled fuzzing, fuzz targets, property-based tests, network-isolated tests and snapshot tests. Evidence only: it adds an evidence line to the tests-run-in-CI condition while that condition is met, and counts toward nothing."
issues = [855]
callable = "lib.testing.behaviour_pins:pins_or_unknown"
publishes = ["behaviour_pins"]
reads = ["repo_root"]
stage = "post_offers"
headless = { behaviour_pins = "registered" }
whys.behaviour_pins = "Coverage says a line ran, not that its behaviour held. A fuzzer, a property test, a snapshot or a test that cannot reach the network turns red when behaviour moves, so an agent's change that passes the tests is more likely to be right."
shapes = [
  { path = "behaviour_pins", type = "lib.run_context_types_behaviour_pins:BehaviourPinsBlock" },
]
revision = 1
  [entries.privacy]
  "behaviour_pins.reason" = "token"
  "behaviour_pins.practices" = "token"
  "behaviour_pins.pins.practice" = "token"
  "behaviour_pins.pins.arm" = "token"
  "behaviour_pins.pins.path" = "path"
