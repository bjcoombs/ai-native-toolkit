# Check manifest fragment: the backlog_ready collector and the signals it owns. Layout and
# merge order: skills/assess/checks/core.toml. The backlog-ready row is held in a test model
# (tests/fixtures/backlog_ready/levels.toml) until #1324 places it, so this fragment has no
# condition entries and its block is in signal_grades.STAGED_BLOCKS.

[[entries]]
id = "core.backlog_ready"
kind = "collector"
title = "Backlog kept agent-ready (intake configuration)"
summary = "Whether new issues are asked for structure (an issue form with a required field), marked untriaged when they arrive (a workflow on issues opened that adds an untriaged label), and judged against a documented ready label with its criteria, and whether a stale job can close a ready issue. Committed files only."
issues = [1322]
callable = "lib.backlog_ready:scan_backlog_ready"
publishes = ["backlog_ready"]
reads = ["repo_root"]
stage = "post_offers"
headless = { backlog_ready = "registered" }
whys.backlog_ready = "An agent handed an issue with no structure, never triaged and judged against no written bar starts from a guess; intake that asks for structure and a documented ready label is the bar an issue clears before an agent picks it up."
shapes = [
  { path = "backlog_ready", type = "lib.backlog_ready:BacklogReadyBlock" },
]
revision = 1
unknown_reasons = [
  { code = "form_unreadable", block = "backlog_ready", means = "No issue form read has a required field, and a form could not be read: a tab indent, an unclosed flow collection, or no top-level body list.", next_step = "Fix the form so GitHub accepts it; a form GitHub rejects is not offered to the person opening an issue." },
  { code = "gitlab_templates", block = "backlog_ready", means = "The repository is on GitLab and holds no GitHub issue form. A GitLab issue template is Markdown with no required fields, so the form signal is not measured.", next_step = "Nothing to change: required fields are not measured on GitLab." },
  { code = "workflow_unreadable", block = "backlog_ready", means = "No workflow read adds an untriaged label when an issue opens, and a workflow's on: key could not be read.", next_step = "Nothing to change if that workflow labels new issues; a plain on: issues: types: [opened] lets the scan read it." },
  { code = "stale_input_unresolved", block = "backlog_ready", means = "No stale job can close a ready issue for certain, but one sets its close days or exempt labels to an expression this reader does not follow.", next_step = "Nothing to change if the job exempts the ready label; a literal exempt-issue-labels or days-before-issue-close: -1 lets the scan read it." },
]
  [entries.privacy]
  "backlog_ready.required_form_field_reason" = "token"
  "backlog_ready.untriaged_on_open_reason" = "token"
  "backlog_ready.stale_job_safe_reason" = "token"

[[entries]]
id = "core:backlog_ready.required_form_field"
kind = "signal"
title = "An issue form has a required field"
collector = "core.backlog_ready"
path = "backlog_ready.required_form_field"
type = "bool"
evidence = "config_text"
null_means = "form_unreadable: a form could not be read and none read has a required field; gitlab_templates: a GitLab repository, whose issue templates have no required fields"

[[entries]]
id = "core:backlog_ready.untriaged_on_open"
kind = "signal"
title = "A workflow labels each new issue untriaged"
collector = "core.backlog_ready"
path = "backlog_ready.untriaged_on_open"
type = "bool"
evidence = "config_text"
null_means = "workflow_unreadable: no workflow read adds an untriaged label on issues opened, and a workflow's on: key could not be read"

[[entries]]
id = "core:backlog_ready.ready_label_documented"
kind = "signal"
title = "A ready label is documented with its criteria"
collector = "core.backlog_ready"
path = "backlog_ready.ready_label_documented"
type = "bool"
evidence = "config_text"

[[entries]]
id = "core:backlog_ready.stale_job_safe"
kind = "signal"
title = "No stale job can close a ready issue"
collector = "core.backlog_ready"
path = "backlog_ready.stale_job_safe"
type = "bool"
evidence = "config_text"
null_means = "stale_input_unresolved: no stale job closes ready issues for certain, but one sets an input to an expression"
