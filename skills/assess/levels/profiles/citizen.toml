# Profile "citizen" (#1150): the lighter bar for a citizen developer while the
# app is being built, before it is handed to a production team (that bar is
# the "handover" profile). Selected by `/assess --profile citizen` or
# `/fleet --profile citizen`. A run with every practice below met reads
# "Meets the citizen bar (profile: citizen)"; otherwise the report lists each
# practice still missing (lib/profiles.py).
#
# A profile reuses the default model's practices and never redefines a signal:
# every row below is a row of levels/default.toml, with the same id, title and
# criteria, cut to fewer levels (tests/test_profiles.py fails on any
# difference). The Steps are the default model's first three, so a Step means
# the same under this profile; the bar holds every row those Steps' gates read
# (#1641). Step 4 needs the coverage gate and wide review, which this bar does
# not ask for.
#
# The secrets guard is a general practice in the check catalogue, carried by
# the default model at both levels; this profile is one working example of a
# profile that turns it on.
#
# Why each practice is in the bar:
# - layer-0-instructions.1: an instruction file is the cheapest way to tell
#   the agent building the app how to build and test it.
# - layer-0-instructions.2: the file names the check command the agent runs,
#   so the agent can check its own work (the instructions gate of Step 2).
# - layer-3-linters.1: a linter that CI runs catches the slips a test does not
#   look for (the linters gate of Step 3).
# - layer-5-ci.1: CI running the tests is the one check that catches a broken
#   change before anyone else depends on it.
# - layer-7-review.1: a second reader, a person or a review agent, sees each
#   change before it lands (the review gate of Step 3).
# - secrets-guard.1: a committed secret is the commonest way a credential
#   leaks, and a configured guard catches one before it lands.
# - secrets-guard.2: a secret committed once stays in every clone, so the
#   guard must run where nobody can skip it: CI or push protection.
#
# Changing a criterion changes results: bump "version" with every edit.

version = "profile-citizen-2026.11.28"

[[rows]]
id = "layer-0-instructions"
title = "Agent instructions"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  truth = ["agent_context"]
  criteria = [
    { signal = "layer_grades.instruction_file_present", op = "eq", value = true },
  ]

  [[rows.levels]]
  level = 2
  truth = ["agent_context", "docs"]
  criteria = [
    { signal = "agent_environment.check.named_total", op = "gt", value = 0 },
    { signal = "instruction_claims.failed", op = "eq", value = 0 },
    { signal = "nested_instructions.budget.claude_code.lines", op = "lte", value = 200 },
  ]

[[rows]]
id = "layer-3-linters"
title = "Linters run in CI, suppression cap"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  truth = ["structure"]
  criteria = [{ signal = "ci_checks.lint_runs", op = "eq", value = true }]

[[rows]]
id = "layer-5-ci"
title = "CI and the agent's local check"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  truth = ["behaviour"]
  criteria = [{ signal = "ci_checks.enforced_check_runs", op = "eq", value = true }]

[[rows]]
id = "layer-7-review"
title = "Review on merged pull requests"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  truth = ["governance"]
  criteria = [{ signal = "review_evidence.present", op = "eq", value = true }]

[[rows]]
id = "secrets-guard"
title = "Secrets guard"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  truth = ["governance"]
  criteria = [{ signal = "secrets_guard.configured", op = "eq", value = true }]

  [[rows.levels]]
  level = 2
  truth = ["governance"]
  criteria = [{ signal = "secrets_guard.enforcement.present", op = "eq", value = true }]

[[steps]]
step = 1
name = "Assisted"

[[steps]]
step = 2
name = "Supervised agent changes"
gates = [
  { id = "instructions", row = "layer-0-instructions", level = 2 },
]

[[steps]]
step = 3
name = "Unattended agent changes"
gates = [
  { id = "instructions", row = "layer-0-instructions", level = 2 },
  { id = "ci_runs_tests", row = "layer-5-ci", level = 1 },
  { id = "review", row = "layer-7-review", level = 1 },
  { id = "linters", row = "layer-3-linters", level = 1 },
  { id = "secrets_guard", row = "secrets-guard", level = 1 },
]
