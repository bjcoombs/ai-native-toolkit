# Profile "handover" (#1150): the bar a production team expects before it takes
# ownership of a repository, such as an app a citizen developer built. Selected
# by `/assess --profile handover` or `/fleet --profile handover`. A run with
# every practice below met reads "Ready for handover (profile: handover)";
# otherwise the report lists each practice still missing (lib/profiles.py).
#
# A profile reuses the default model's practices and never redefines a signal:
# every row below is a row of levels/default.toml, with the same id, title and
# criteria, cut to its first level (tests/test_profiles.py fails on any
# difference). The Steps are the default model's, so a Step means the same
# under this profile.
#
# Why each practice is in the bar:
# - layer-0-instructions.1: the receiving team and its agents need the
#   instruction file that says how to build and test the app (the instructions gate).
# - layer-3-linters.1: a linter that CI runs keeps the code readable for the
#   next owner without a manual style pass.
# - layer-5-ci.1: CI must run the tests on every change, or the new owner
#   inherits code nobody checks (the ci_runs_tests gate).
# - layer-6-coverage.1: an enforced coverage gate stops the suite thinning out
#   after handover (the coverage_gate gate).
# - layer-7-review.1: merged changes show review evidence, so the history the
#   team inherits was read by a second person.
# - doc-freshness.1: at most half the docs are stale, so the handover docs
#   describe the code being handed over.
#
# Changing a criterion changes results: bump "version" with every edit.

version = "profile-handover-2026.11.23"

[[rows]]
id = "layer-0-instructions"
title = "Agent instructions"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  truth = ["agent_context"]
  criteria = [
    { signal = "layer_grades.instruction_file_present", op = "eq", value = true },
  ]

[[rows]]
id = "layer-3-linters"
title = "Linters run in CI, suppression cap"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  truth = ["structure"]
  criteria = [{ signal = "ci_checks.lint_runs", op = "eq", value = true }]

[[rows]]
id = "layer-5-ci"
title = "CI and the agent's local check"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  truth = ["behaviour"]
  criteria = [{ signal = "ci_checks.enforced_check_runs", op = "eq", value = true }]

[[rows]]
id = "layer-6-coverage"
title = "Coverage gates and truth pressure"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  truth = ["behaviour"]
  criteria = [{ signal = "coverage_gate.enforced_meets_minimum", op = "eq", value = true }]

[[rows]]
id = "layer-7-review"
title = "Review on merged pull requests"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  truth = ["governance"]
  criteria = [{ signal = "review_evidence.present", op = "eq", value = true }]

[[rows]]
id = "doc-freshness"
title = "Documentation freshness"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  truth = ["docs"]
  criteria = [{ signal = "doc_staleness.summary.stale_pct", op = "lte", value = 50 }]

[[steps]]
step = 1
name = "Assisted"

[[steps]]
step = 2
name = "Supervised agent PRs"
gates = [
  { id = "instructions", row = "layer-0-instructions", level = 1 },
]

[[steps]]
step = 3
name = "Unattended agent PRs"
gates = [
  { id = "instructions", row = "layer-0-instructions", level = 1 },
  { id = "ci_runs_tests", row = "layer-5-ci", level = 1 },
]

[[steps]]
step = 4
name = "Autonomous loops"
gates = [
  { id = "instructions", row = "layer-0-instructions", level = 1 },
  { id = "ci_runs_tests", row = "layer-5-ci", level = 1 },
  { id = "coverage_gate", row = "layer-6-coverage", level = 1 },
]
