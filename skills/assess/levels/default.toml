# Default /assess maturity model: a deterministic approximation of the 0-8 layers.
#
# Loaded by lib/level_signals.py (load_default_levels) and evaluated by
# lib/levels.py. Each row is one layer; level 1 stands for Partial and level 2
# for Present, so level 0 is Missing. Team rows read one repository's signals
# (a headless document's "scans", or a full run-context.json) and roll up by
# the minimum across the repositories passed in.
#
# These levels CAN DISAGREE with the /assess layer verdicts on the same
# repository. The assess-layer-scorer agent starts from the deterministic
# grades and then applies judgement (integrity overrides, reading the code,
# the knowledge-base archetype's N/A layers); a maturity model reads signals only.
# Known gaps:
#
# - Layers 2 (code design), 3 (linters) and 4 (architecture tests) have no
#   deterministic grade: /assess judges them by reading type-checker and
#   linter configuration, architecture tests and code. Their rows read
#   proxies the run context already exposes, so they disagree with /assess
#   most often. Each starts from positive evidence at level 1, so an absent
#   signal is level 0 or unknown, never credit; a practice /assess looks for
#   can still be absent at level 2 (see each row below). A headless run
#   builds the structure, structure_drift, stats_summary and
#   promissory_markers blocks itself (lib/headless_layers.py) when grimp,
#   networkx, lizard and rg are installed; a missing tool makes its block
#   unavailable with a named reason, so the row is unknown there. Headless
#   stats_summary scores the files lizard reads only, so its loc p95 can
#   differ from a full run's.
# - Layer 2 reads the import graph's design, not type strictness: level 1 is
#   real module structure (Newman modularity Q >= 0.3, the usual threshold
#   for community structure), level 2 adds cross-package imports entering
#   through a package's front door (its public API) rather than burrowing
#   into its submodules, and needs at least one such import: with no
#   package boundary crossed the ratio is a vacuous 1.0, so a single-package
#   repository stops at level 1. A strictly typed codebase with tangled modules
#   scores low here and Present in /assess; a loosely typed one with clean
#   modules the reverse. The dominant source language's graph is measured
#   (structure.language names it), and a failing dominant builder keeps
#   its reason; another language's graph stands in when no builder covers
#   the dominant one or its builder found nothing to graph. Python, Go and TypeScript/JavaScript have builders.
#   TypeScript/JavaScript is one builder: a package is a named workspace
#   package or a directory with an index file. A Go graph's node is a
#   package (a directory) and each package is its own boundary: an import
#   reaches only exported identifiers, so Go's front_door_ratio is 1.0 by
#   construction and its level 2 reads modularity plus one cross-package
#   import. A repository with no graph reports structure unavailable with a
#   reason naming its dominant source language
#   (no_import_graph_<language>, no_python_packages for Python with no
#   importable package, no_source_files with no source), so the row is
#   unknown there, not 0. A graph with no import edges (modules that never
#   import each other) has no community structure to measure: modularity_q
#   is null with modularity_reason no_import_edges, so the row is unknown
#   there too, not level 0.
# - Layer 3 reads the linter's footprint, not its configuration: level 1 is
#   at least one suppression comment (noqa, eslint-disable, nolint, type:
#   ignore), which only exists where a linter or type checker runs; level 2
#   holds the stale bare suppressions to 10 or fewer, the erosion cap
#   /assess applies. The promissory_markers scan lists a family only when it
#   found a marker, so a repository with no suppressions (a clean linter, or
#   none) is unknown, not 0. A suppression is stale once it survives enough
#   edits to its file, so level 2 also needs aging_reliable: on degenerate
#   history (a shallow clone, a squashed import) a stale count of 0 says
#   nothing.
# - Layer 4 reads a declared boundary and the outcome of the commonest
#   architecture test: level 1 is a committed ownership or boundary map
#   (CODEOWNERS, ARCHITECTURE.md, DESIGN.md, or a README.md that declares
#   module boundaries) with at least one pattern matching a
#   tracked file, level 2 adds a file-size outcome (95% of scored files at
#   500 lines or fewer). Neither proves an architecture test runs in CI,
#   which is what /assess looks for. With no map the structure_drift block
#   is omitted (a headless run reports it unavailable), so the row is
#   unknown rather than 0.
# - Layer 0 level 1 reads layer_grades.instruction_file_present: a committed
#   instruction file at any location in
#   instruction_files.INSTRUCTION_FILE_PATHS (root CLAUDE.md, AGENTS.md,
#   GEMINI.md, .cursorrules; .github/copilot-instructions.md,
#   .github/claude-instructions.md, .github/claude-review-instructions.md;
#   docs/CLAUDE.md, docs/AGENTS.md), the presence /assess scores. A boolean,
#   never null, so "no instruction file" is level 0, as /assess scores a
#   null instructions_grade Missing, and a missing layer_grades block is
#   unknown. layer_grades.instructions_grade (the letter grade, null with no
#   file) is available to a maturity model too; this one does not grade on the
#   letter, since /assess weighs it with the instruction text. Level 2 reads
#   the size of the always-loaded Claude Code instruction text (root
#   CLAUDE.md or, without one, AGENTS.md, its imports, unscoped
#   .claude/rules); a repository whose only instruction file is for another
#   tool (.cursorrules, Copilot) reaches level 1 with that size 0.
# - Layer 1 reads the observability rung from committed files (telemetry
#   dependencies, a runbook or OBSERVABILITY.md, a logs or metrics MCP server
#   or skill). A headless run builds it too (lib/headless_static.py, #699), so
#   an uninstrumented repository reads level 0 there, not unknown.
# - Documentation freshness reads doc_staleness.summary.stale_pct: the share
#   of docs with a code subject of their own whose subject outran them (a
#   staleness ratio above STALENESS_RATIO_THRESHOLD = 2.0, or a newer declared
#   source; lib/doc_complexity_join.py). Level 1 holds that share to 50% or
#   less (most mapped docs keep pace), level 2 to 20% or less (one in five).
#   Repo-baseline docs (no subject of their own) are not counted. A truncated
#   (shallow) or degenerate history, a target that is not a git work tree, or
#   no mapped doc leaves the share null, so the row is unknown, never a false
#   fresh or a false 0.
# - Layer 7 level 1 reads review_evidence.present (lib/review_automation.py):
#   an AI review step committed in CI (review_automation: a pinned review
#   action or GitLab review component, a [review] ai_review_components entry,
#   or an AI review app's config file, git-tracked only) or a reviewed merged
#   change (review_reality.reviewed_share > 0). It is unknown when no AI review
#   step is committed and review_reality is unread. Level 2 reads
#   review_reality, which needs GitHub or GitLab through gh or glab: a headless
#   run without --platform makes no network calls, so a repository with an AI
#   review step reads "at least 1" there, and one without reads unknown.
# - Layer 5 level 1 reads ci_checks.test_or_lint_runs: a line of a GitHub
#   Actions workflow or .gitlab-ci.yml runs a test or lint command (pytest,
#   make check, npm test, a ./scripts/test.sh, as
#   check_command.is_check_command classifies an instruction file's
#   commands, or a lint target or linter: make lint, ruff, eslint). Triggers
#   are not read: a check in a push-only workflow counts the same as one on
#   pull requests. Other CI systems (Jenkins, CircleCI) are not read, so a
#   repository on them alone is level 0. A CI file with no check line that
#   pulls its jobs from elsewhere (a GitLab include: or component, a GitHub
#   job-level uses: of another repository's reusable workflow) is unknown,
#   never 0: the check may live in the included file. Level 2 is pinned
#   dependencies: agent_environment.pinning.unlocked_total is 0, so every
#   dependency manifest has its lockfile committed (a requirements*.txt pinned
#   with == is its own lock); a repository with no manifest has nothing to
#   lock. Committed setup does not stand in for a lockfile. Naming a check
#   command that resolves is read once, by Layer 0 level 2, so a missing named
#   check costs Layer 0 only (#786). A repository with locked dependencies but
#   no CI check line is 0.
#   The scan reads CI files line by line, with no YAML parser: a command
#   inside a non-script value (an env: block scalar holding pytest) counts as
#   a run, a known limit.
# - Layer 8 counts the agent_ops booleans only; /assess also weighs evidence
#   of repeated AI work cycles, which no scan measures.
#
# Conditions, the verified tally and Steps (lib/level_tally.py, #744): each
# row level is also one condition, <row id>.<level>. Only conditions whose
# signals are measured or verified (lib/level_signals.py) are counted; the
# rest are listed. A condition reads its own criteria; "requires" names a real
# dependency (mutation credit needs CI running tests). The [[steps]] at the end
# are the autonomy Steps. A Step needs its threshold of met, counted
# conditions and its gates, each a row's conditions up to a level, whatever
# their grade: instructions (layer 0), ci_runs_tests (layer 5) and
# coverage_gate (layer 6), added one per Step. The thresholds are provisional
# until the calibration corpus sets them (#842).
#
# Changing a criterion changes results: bump "version" with every edit.

version = "default-2026.11.13"

[[rows]]
id = "layer-0-instructions"
title = "Layer 0: agent instructions"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  criteria = [
    { signal = "layer_grades.instruction_file_present", op = "eq", value = true },
  ]

  [[rows.levels]]
  level = 2
  criteria = [
    { signal = "agent_environment.check.named_total", op = "gt", value = 0 },
    { signal = "instruction_claims.failed", op = "eq", value = 0 },
    { signal = "nested_instructions.budget.claude_code.lines", op = "lte", value = 200 },
  ]

[[rows]]
id = "layer-1-liveness"
title = "Layer 1: runtime legibility"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  criteria = [{ signal = "observability.rung", op = "gte", value = 1 }]

  [[rows.levels]]
  level = 2
  criteria = [{ signal = "observability.rung", op = "gte", value = 3 }]

[[rows]]
id = "layer-2-design"
title = "Layer 2: code design (module structure)"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  criteria = [{ signal = "structure.modularity_q", op = "gte", value = 0.3 }]

  [[rows.levels]]
  level = 2
  criteria = [
    { signal = "structure.cross_package_edges", op = "gt", value = 0 },
    { signal = "structure.front_door_ratio", op = "gte", value = 0.9 },
  ]

[[rows]]
id = "layer-3-linters"
title = "Layer 3: linters (suppression footprint)"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  criteria = [{ signal = "promissory_markers.families.suppression.total", op = "gt", value = 0 }]

  [[rows.levels]]
  level = 2
  criteria = [
    { signal = "promissory_markers.families.suppression.stale", op = "lte", value = 10 },
    { signal = "promissory_markers.aging_reliable", op = "eq", value = true },
  ]

[[rows]]
id = "layer-4-architecture"
title = "Layer 4: architecture boundaries and size"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  criteria = [{ signal = "structure_drift.tier_0.matched_patterns", op = "gt", value = 0 }]

  [[rows.levels]]
  level = 2
  criteria = [{ signal = "stats_summary.loc.p95", op = "lte", value = 500 }]

[[rows]]
id = "layer-5-ci"
title = "Layer 5: CI and the agent's local check"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  criteria = [{ signal = "ci_checks.test_or_lint_runs", op = "eq", value = true }]

  [[rows.levels]]
  level = 2
  criteria = [{ signal = "agent_environment.pinning.unlocked_total", op = "eq", value = 0 }]

[[rows]]
id = "layer-6-coverage"
title = "Layer 6: coverage gates and truth pressure"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  criteria = [{ signal = "coverage_gate.enforced", op = "eq", value = true }]

  [[rows.levels]]
  level = 2
  criteria = [{ signal = "test_pressure.mutation_run", op = "eq", value = true }]
  requires = ["layer-5-ci.1"]

[[rows]]
id = "layer-7-review"
title = "Layer 7: review on merged pull requests"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  criteria = [{ signal = "review_evidence.present", op = "eq", value = true }]

  [[rows.levels]]
  level = 2
  criteria = [
    { signal = "review_reality.reviewed_share", op = "gte", value = 0.8 },
    { signal = "review_reality.approved_share", op = "gte", value = 0.5 },
  ]

[[rows]]
id = "layer-8-agent-ops"
title = "Layer 8: AI project management"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  criteria = [{ signal = "agent_ops.summary.permissions_encoded", op = "eq", value = true }]

  [[rows.levels]]
  level = 2
  criteria = [
    { signal = "agent_ops.summary.hooks_present", op = "eq", value = true },
    { signal = "agent_ops.summary.routines_present", op = "eq", value = true },
  ]

[[rows]]
id = "doc-freshness"
title = "Documentation freshness"
scope = "team"
aggregation = "min"

  [[rows.levels]]
  level = 1
  criteria = [{ signal = "doc_staleness.summary.stale_pct", op = "lte", value = 50 }]

  [[rows.levels]]
  level = 2
  criteria = [{ signal = "doc_staleness.summary.stale_pct", op = "lte", value = 20 }]

[[steps]]
step = 1
name = "Assisted"
threshold = 0

[[steps]]
step = 2
name = "Supervised agent PRs"
threshold = 1
gates = [
  { id = "instructions", row = "layer-0-instructions", level = 1 },
]

[[steps]]
step = 3
name = "Unattended agent PRs"
threshold = 3
gates = [
  { id = "instructions", row = "layer-0-instructions", level = 1 },
  { id = "ci_runs_tests", row = "layer-5-ci", level = 1 },
]

[[steps]]
step = 4
name = "Autonomous loops"
threshold = 5
gates = [
  { id = "instructions", row = "layer-0-instructions", level = 1 },
  { id = "ci_runs_tests", row = "layer-5-ci", level = 1 },
  { id = "coverage_gate", row = "layer-6-coverage", level = 1 },
]
